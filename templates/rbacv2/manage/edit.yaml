{{- if eq (include "sds-node-configurator.rbacv2_new_scheme" .) "true" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:system-capability:sds-node-configurator:edit
  {{- include "helm_lib_module_labels" (list . (dict "rbac.deckhouse.io/aggregate-to-storage-as" "manager" "rbac.deckhouse.io/capability" "system-capability.sds-node-configurator.edit" "rbac.deckhouse.io/kind" "capability" "rbac.deckhouse.io/namespace" "d8-sds-node-configurator" "rbac.deckhouse.io/scope" "system")) | nindent 2 }}
  annotations:
    en.meta.deckhouse.io/description: "Manage the sds-node-configurator module configuration."
    en.meta.deckhouse.io/title: "Module sds-node-configurator: edit configuration"
    ru.meta.deckhouse.io/description: "Управление конфигурацией модуля sds-node-configurator."
    ru.meta.deckhouse.io/title: "Модуль sds-node-configurator: управление конфигурацией"
rules:
- apiGroups:
  - deckhouse.io
  resources:
  - moduleconfigs
  resourceNames:
  - sds-node-configurator
  verbs:
  - create
  - delete
  - patch
  - update
- apiGroups:
  - storage.deckhouse.io
  resources:
  - lvmvolumegroups
  verbs:
  - create
  - delete
  - deletecollection
  - patch
  - update
- apiGroups:
  - storage.deckhouse.io
  resources:
  - lvmvolumegroupsets
  verbs:
  - create
  - delete
  - deletecollection
  - patch
  - update
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: sds-node-configurator
    rbac.deckhouse.io/aggregate-to-storage-as: manager
    rbac.deckhouse.io/kind: manage
    rbac.deckhouse.io/level: module
    rbac.deckhouse.io/namespace: d8-sds-node-configurator
  name: d8:manage:permission:module:sds-node-configurator:edit
rules:
  - apiGroups:
      - storage.deckhouse.io
    resources:
      - lvmvolumegroups
      - lvmvolumegroupsets
    verbs:
      - create
      - update
      - patch
      - delete
      - deletecollection
{{- end }}
