{{- if eq (include "sds-node-configurator.rbacv2_new_scheme" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: sds-node-configurator
    rbac.deckhouse.io/aggregate-to-storage-as: viewer
    rbac.deckhouse.io/kind: capability
    rbac.deckhouse.io/capability: "system-capability.sds-node-configurator.view"
    rbac.deckhouse.io/scope: system
    rbac.deckhouse.io/namespace: d8-sds-node-configurator
  name: d8:system-capability:sds-node-configurator:view
  annotations:
    en.meta.deckhouse.io/title: "Module sds-node-configurator: view cluster resources"
    ru.meta.deckhouse.io/title: "Модуль sds-node-configurator: просмотр кластерных ресурсов"
    en.meta.deckhouse.io/description: "Read-only access to the cluster-scoped resources of the sds-node-configurator module (BlockDevice, LVMVolumeGroup, LVMVolumeGroupSet, LVMLogicalVolume, LVMLogicalVolumeSnapshot)."
    ru.meta.deckhouse.io/description: "Доступ только на чтение к кластерным ресурсам модуля sds-node-configurator (BlockDevice, LVMVolumeGroup, LVMVolumeGroupSet, LVMLogicalVolume, LVMLogicalVolumeSnapshot)."
rules:
  - apiGroups:
      - storage.deckhouse.io
    resources:
      - blockdevices
      - lvmvolumegroups
      - lvmvolumegroupsets
      - lvmlogicalvolumes
      - lvmlogicalvolumesnapshots
    verbs:
      - get
      - list
      - watch
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    heritage: deckhouse
    module: sds-node-configurator
    rbac.deckhouse.io/aggregate-to-storage-as: viewer
    rbac.deckhouse.io/kind: manage
    rbac.deckhouse.io/level: module
    rbac.deckhouse.io/namespace: d8-sds-node-configurator
  name: d8:manage:permission:module:sds-node-configurator:view
rules:
  - apiGroups:
      - storage.deckhouse.io
    resources:
      - blockdevices
      - lvmvolumegroups
      - lvmvolumegroupsets
      - lvmlogicalvolumes
      - lvmlogicalvolumesnapshots
    verbs:
      - get
      - list
      - watch
{{- end }}
