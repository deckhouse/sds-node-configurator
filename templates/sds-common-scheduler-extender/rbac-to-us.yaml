---
{{- /*
  Reaching the metrics of sds-common-scheduler-extender means holding "get" on its
  prometheus-metrics subresource. Only the Prometheus scraper is given it; the
  kube-rbac-proxy in the pod checks it on every scrape.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: access-to-sds-common-scheduler-extender-prometheus-metrics
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "sds-common-scheduler-extender")) | nindent 2 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments/prometheus-metrics"]
    resourceNames: ["sds-common-scheduler-extender"]
    verbs: ["get"]
{{- if (.Values.global.enabledModules | has "prometheus") }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: access-to-sds-common-scheduler-extender-prometheus-metrics
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "sds-common-scheduler-extender")) | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: access-to-sds-common-scheduler-extender-prometheus-metrics
subjects:
  - kind: User
    name: d8-monitoring:scraper
  - kind: ServiceAccount
    name: prometheus
    namespace: d8-monitoring
{{- end }}
