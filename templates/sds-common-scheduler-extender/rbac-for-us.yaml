---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sds-common-scheduler-extender
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "sds-common-scheduler-extender")) | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: d8:{{ .Chart.Name }}:sds-common-scheduler-extender-kube-scheduler
  {{- include "helm_lib_module_labels" (list . (dict "app" "sds-common-scheduler-extender")) | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:kube-scheduler
subjects:
  - kind: ServiceAccount
    name: sds-common-scheduler-extender
    namespace: d8-{{ .Chart.Name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: d8:{{ .Chart.Name }}:sds-common-scheduler-extender-volume-scheduler
  {{- include "helm_lib_module_labels" (list . (dict "app" "sds-common-scheduler-extender")) | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:volume-scheduler
subjects:
  - kind: ServiceAccount
    name: sds-common-scheduler-extender
    namespace: d8-{{ .Chart.Name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: d8:{{ .Chart.Name }}:sds-common-scheduler-extender
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "sds-common-scheduler-extender")) | nindent 2 }}
rules:
  - apiGroups: [ "storage.deckhouse.io" ]
    resources: [ "lvmvolumegroups" ]
    verbs: [ "list", "watch", "get"]
  - apiGroups: [ "storage.deckhouse.io" ]
    resources: [ "lvmlogicalvolumes" ]
    verbs: [ "list", "watch", "get"]
  - apiGroups: [ "storage.deckhouse.io" ]
    resources: [ "replicatedstorageclasses" ]
    verbs: [ "get", "list", "watch" ]
  - apiGroups: [ "storage.deckhouse.io" ]
    resources: [ "replicatedstoragepools" ]
    verbs: [ "get", "list", "watch" ]
  - apiGroups: [ "storage.deckhouse.io" ]
    resources: [ "replicatedvolumes" ]
    verbs: [ "get", "list", "watch" ]
  - apiGroups: [ "deckhouse.io" ]
    resources: [ "moduleconfigs" ]
    verbs: [ "get", "list", "watch" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: d8:{{ .Chart.Name }}:sds-common-scheduler-extender
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "sds-common-scheduler-extender")) | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: d8:{{ .Chart.Name }}:sds-common-scheduler-extender
subjects:
  - kind: ServiceAccount
    name: sds-common-scheduler-extender
    namespace: d8-{{ .Chart.Name }}
---
{{- /*
  The replicas elect the one that holds the space reservations over this Lease.
  "create" cannot be narrowed to a name; "get" and "update" are.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sds-common-scheduler-extender-leader-election
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "sds-common-scheduler-extender")) | nindent 2 }}
rules:
  - apiGroups: [ "coordination.k8s.io" ]
    resources: [ "leases" ]
    verbs: [ "create" ]
  - apiGroups: [ "coordination.k8s.io" ]
    resources: [ "leases" ]
    resourceNames: [ "sds-common-scheduler-extender" ]
    verbs: [ "get", "update" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sds-common-scheduler-extender-leader-election
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "sds-common-scheduler-extender")) | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sds-common-scheduler-extender-leader-election
subjects:
  - kind: ServiceAccount
    name: sds-common-scheduler-extender
    namespace: d8-{{ .Chart.Name }}
