{{- define "sds_common_scheduler_extender_resources" }}
cpu: 10m
memory: 25Mi
{{- end }}

{{- if (include "helm_lib_api_version_exists" (list . "autoscaling.k8s.io/v1/VerticalPodAutoscaler")) }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: sds-common-scheduler-extender
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "sds-common-scheduler-extender")) | nindent 2 }}
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: sds-common-scheduler-extender
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
  resourcePolicy:
    containerPolicies:
    - containerName: sds-common-scheduler-extender
      minAllowed:
        {{- include "sds_common_scheduler_extender_resources" . | nindent 8 }}
      maxAllowed:
        {{- /* Measured 7-day peak: 34m/53Mi, above the previous 20m/40Mi ceiling. The recommender
               rounds memory up to a multiple of 64Mi, so 40Mi could never be reached and pinned
               every recommendation to itself. */}}
        memory: 128Mi
        cpu: 100m
    {{- include "helm_lib_vpa_kube_rbac_proxy_resources" . | nindent 4 }}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sds-common-scheduler-extender
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "sds-common-scheduler-extender" )) | nindent 2 }}
spec:
  minAvailable: {{ include "helm_lib_is_ha_to_value" (list . 1 0) }}
  selector:
    matchLabels:
      app: sds-common-scheduler-extender
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sds-common-scheduler-extender
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "sds-common-scheduler-extender" )) | nindent 2 }}
spec:
  {{- include "helm_lib_deployment_strategy_and_replicas_for_ha" . | nindent 2 }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: sds-common-scheduler-extender
  template:
    metadata:
      annotations:
        checksum/ca: {{ .Values.sdsNodeConfigurator.internal.customSchedulerExtenderCert.ca | sha256sum | quote }}
      labels:
        app: sds-common-scheduler-extender
    spec:
      {{- include "helm_lib_priority_class" (tuple . "system-cluster-critical") | nindent 6 }}
      {{- include "helm_lib_node_selector" (tuple . "system") | nindent 6 }}
      {{- include "helm_lib_tolerations" (tuple . "system") | nindent 6 }}
      {{- include "helm_lib_module_pod_security_context_run_as_user_nobody" . | nindent 6 }}
      {{- include "helm_lib_pod_anti_affinity_for_ha" (list . (dict "app" "sds-common-scheduler-extender")) | nindent 6 }}
      imagePullSecrets:
        - name: {{ .Chart.Name }}-module-registry
      containers:
        - name: sds-common-scheduler-extender
          {{- include "helm_lib_module_container_security_context_pss_restricted_flexible" (dict "ro" true "seccompProfile" true) | nindent 10 }}
          image: {{ include "helm_lib_module_image" (list . "sdsCommonSchedulerExtender") }}
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 8
            httpGet:
              path: /healthz
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
              scheme: HTTP
            periodSeconds: 1
            failureThreshold: 3
          args:
            - --config=/etc/sds-common-scheduler-extender/scheduler-extender-config.yaml
          env:
            {{- /*
              Loopback: the endpoint authenticates nobody, and a pod port is reachable
              from every pod in the cluster. The kube-rbac-proxy below publishes it
              after an authorization check, the same shape the agent uses.
            */}}
            - name: METRICS_BIND_ADDRESS
              value: "127.0.0.1:{{ .Values.sdsNodeConfigurator.internal.schedulerExtenderMetricsPort }}"
            - name: LOG_LEVEL
              value: {{ include "helm_lib_module_controller_log_level" (list . "sdsNodeConfigurator") | quote }}
          volumeMounts:
          - name: scheduler-extender-config
            mountPath: /etc/sds-common-scheduler-extender
            readOnly: true
          - name: scheduler-extender-certs
            mountPath: /etc/sds-common-scheduler-extender/certs
            readOnly: true
          resources:
            requests:
              {{- include "helm_lib_module_ephemeral_storage_only_logs" . | nindent 14 }}
              {{- if not (include "helm_lib_api_version_exists" (list . "autoscaling.k8s.io/v1/VerticalPodAutoscaler")) }}
              {{- include "sds_common_scheduler_extender_resources" . | nindent 14 }}
              {{- end }}
          ports:
           - containerPort: 8099
             protocol: TCP
             name: http
        - name: kube-rbac-proxy
          {{- include "helm_lib_module_container_security_context_pss_restricted_flexible" dict | nindent 10 }}
          image: {{ include "helm_lib_module_common_image" (list . "kubeRbacProxy") }}
          imagePullPolicy: IfNotPresent
          args:
            - "--secure-listen-address=$(KUBE_RBAC_PROXY_LISTEN_ADDRESS):{{ .Values.sdsNodeConfigurator.internal.schedulerExtenderMetricsProxyPort }}"
            - "--v=2"
            - "--logtostderr=true"
            - "--stale-cache-interval=1h30m"
            - "--livez-path=/livez"
          env:
            - name: KUBE_RBAC_PROXY_LISTEN_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: KUBE_RBAC_PROXY_CONFIG
              value: |
                excludePaths:
                - /livez
                upstreams:
                - upstream: http://127.0.0.1:{{ .Values.sdsNodeConfigurator.internal.schedulerExtenderMetricsPort }}/metrics
                  path: /metrics
                  authorization:
                    resourceAttributes:
                      namespace: d8-{{ .Chart.Name }}
                      apiGroup: apps
                      apiVersion: v1
                      resource: deployments
                      subresource: prometheus-metrics
                      name: sds-common-scheduler-extender
          ports:
            - name: https-metrics
              containerPort: {{ .Values.sdsNodeConfigurator.internal.schedulerExtenderMetricsProxyPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /livez
              port: {{ .Values.sdsNodeConfigurator.internal.schedulerExtenderMetricsProxyPort }}
              scheme: HTTPS
          {{- /* No readinessProbe on purpose: readiness of the pod gates the endpoints of
                 the Service the kube-scheduler calls, and a sidecar that only serves metrics
                 must not be able to stop scheduling. A proxy that wedges is restarted by the
                 liveness probe, and one that is not up yet is kept out of the scrape targets
                 by the readiness filter in the PodMonitor. */}}
          resources:
            requests:
              {{- include "helm_lib_module_ephemeral_storage_only_logs" . | nindent 14 }}
              {{- if not (include "helm_lib_api_version_exists" (list . "autoscaling.k8s.io/v1/VerticalPodAutoscaler")) }}
              {{- include "helm_lib_container_kube_rbac_proxy_resources" . | nindent 14 }}
              {{- end }}
      volumes:
      - name: scheduler-extender-config
        configMap:
          defaultMode: 420
          name: sds-common-scheduler-extender
      - name: scheduler-extender-certs
        secret:
            secretName: common-scheduler-extender-https-certs
      serviceAccountName: sds-common-scheduler-extender
