{{- define "sds_common_scheduler_extender_resources" }}
cpu: 10m
memory: 25Mi
{{- end }}

{{- if (include "helm_lib_api_version_exists" (list . "autoscaling.k8s.io/v1/VerticalPodAutoscaler")) }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: sds-common-scheduler-extender
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "sds-common-scheduler-extender")) | nindent 2 }}
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: sds-common-scheduler-extender
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
  resourcePolicy:
    containerPolicies:
    - containerName: sds-common-scheduler-extender
      minAllowed:
        {{- include "sds_common_scheduler_extender_resources" . | nindent 8 }}
      maxAllowed:
        {{- /* Measured 7-day peak: 34m/53Mi, above the previous 20m/40Mi ceiling. The recommender
               rounds memory up to a multiple of 64Mi, so 40Mi could never be reached and pinned
               every recommendation to itself. */}}
        memory: 128Mi
        cpu: 100m
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sds-common-scheduler-extender
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "sds-common-scheduler-extender" )) | nindent 2 }}
spec:
  minAvailable: {{ include "helm_lib_is_ha_to_value" (list . 1 0) }}
  selector:
    matchLabels:
      app: sds-common-scheduler-extender
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sds-common-scheduler-extender
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "sds-common-scheduler-extender" )) | nindent 2 }}
spec:
  {{- include "helm_lib_module_controller_on_master_strategy_and_replicas_for_ha" . | nindent 2 }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: sds-common-scheduler-extender
  template:
    metadata:
      annotations:
        checksum/ca: {{ .Values.sdsNodeConfigurator.internal.customSchedulerExtenderCert.ca | sha256sum | quote }}
      labels:
        app: sds-common-scheduler-extender
    spec:
      {{- include "helm_lib_priority_class" (tuple . "system-cluster-critical") | nindent 6 }}
      {{- /* The extender is consulted by kube-scheduler on every scheduling attempt of the modules
             that register it, so it runs next to its only client — the control plane. The "master"
             selector falls back to system nodes in clusters that expose no master role, and the
             "any-node" tolerations are what actually let the pod onto a tainted control-plane node:
             the "system" strategy tolerates neither the control-plane taint nor custom ones. */ -}}
      {{- include "helm_lib_node_selector" (tuple . "master") | nindent 6 }}
      {{- include "helm_lib_tolerations" (tuple . "any-node") | nindent 6 }}
      {{- include "helm_lib_module_pod_security_context_run_as_user_nobody" . | nindent 6 }}
      {{- include "helm_lib_pod_anti_affinity_for_ha" (list . (dict "app" "sds-common-scheduler-extender")) | nindent 6 }}
      imagePullSecrets:
        - name: {{ .Chart.Name }}-module-registry
      containers:
        - name: sds-common-scheduler-extender
          {{- include "helm_lib_module_container_security_context_pss_restricted_flexible" (dict "ro" true "seccompProfile" true) | nindent 10 }}
          image: {{ include "helm_lib_module_image" (list . "sdsCommonSchedulerExtender") }}
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 8
            httpGet:
              path: /healthz
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
              scheme: HTTP
            periodSeconds: 1
            failureThreshold: 3
          args:
            - --config=/etc/sds-common-scheduler-extender/scheduler-extender-config.yaml
          env:
            {{- /*
              The extender authorizes every scrape itself with a TokenReview and a
              SubjectAccessReview, which its ServiceAccount creates through the
              binding to system:kube-scheduler.
            */}}
            - name: METRICS_BIND_ADDRESS
              value: ":{{ .Values.sdsNodeConfigurator.internal.schedulerExtenderMetricsProxyPort }}"
            - name: METRICS_AUTHORIZATION_NAMESPACE
              value: d8-{{ .Chart.Name }}
            - name: METRICS_AUTHORIZATION_DEPLOYMENT
              value: sds-common-scheduler-extender
            - name: LOG_LEVEL
              value: {{ include "helm_lib_module_controller_log_level" (list . "sdsNodeConfigurator") | quote }}
            {{- /*
              The space reservations live in the memory of one process, so the
              replicas elect a leader over a Lease and only the leader serves the
              routes that read or write them; the others forward those routes to
              it. The lease holder identity is <pod name>_<pod IP>: that is how a
              standby knows where to forward.
            */}}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          volumeMounts:
          - name: scheduler-extender-config
            mountPath: /etc/sds-common-scheduler-extender
            readOnly: true
          - name: scheduler-extender-certs
            mountPath: /etc/sds-common-scheduler-extender/certs
            readOnly: true
          resources:
            requests:
              {{- include "helm_lib_module_ephemeral_storage_only_logs" . | nindent 14 }}
              {{- if not (include "helm_lib_api_version_exists" (list . "autoscaling.k8s.io/v1/VerticalPodAutoscaler")) }}
              {{- include "sds_common_scheduler_extender_resources" . | nindent 14 }}
              {{- end }}
          ports:
           - containerPort: 8099
             protocol: TCP
             name: http
           - containerPort: {{ .Values.sdsNodeConfigurator.internal.schedulerExtenderMetricsProxyPort }}
             protocol: TCP
             name: https-metrics
      volumes:
      - name: scheduler-extender-config
        configMap:
          defaultMode: 420
          name: sds-common-scheduler-extender
      - name: scheduler-extender-certs
        secret:
            secretName: common-scheduler-extender-https-certs
      serviceAccountName: sds-common-scheduler-extender
