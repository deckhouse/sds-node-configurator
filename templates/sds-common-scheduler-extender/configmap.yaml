---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sds-common-scheduler-extender
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "sds-common-scheduler-extender")) | nindent 2 }}
data:
  scheduler-extender-config.yaml: |-
    listen: ":8099"
    health-probe-bind-address: ":8081"
    default-divisor: 1
    log-level: {{ include "helm_lib_module_controller_log_level" (list . "sdsNodeConfigurator") | quote }}
