{{- if (include "helm_lib_api_version_exists" (list . "monitoring.coreos.com/v1/PodMonitor")) }}
{{- /*
  The extender serves its metrics over TLS and behind an authorization check, so
  the scrape carries the Prometheus token. The certificate is self-signed, hence
  insecureSkipVerify.

  A PodMonitor and not a ServiceMonitor: the Service next to this file is the one
  kube-scheduler calls, and the metrics port has no business on it. The two other
  scheduler extenders of the fleet -- csi-nfs and csi-yadro-tatlin-unified -- are
  scraped the same way.
*/ -}}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: sds-common-scheduler-extender
  namespace: d8-monitoring
  {{- include "helm_lib_module_labels" (list $ (dict "prometheus" "main")) | nindent 2 }}
spec:
  podMetricsEndpoints:
    - port: https-metrics
      scheme: https
      path: /metrics
      bearerTokenSecret:
        name: "prometheus-token"
        key: "token"
      tlsConfig:
        insecureSkipVerify: true
      relabelings:
        - regex: endpoint|namespace|pod|container
          action: labeldrop
        - targetLabel: job
          replacement: sds-common-scheduler-extender
        - targetLabel: tier
          replacement: cluster
        # A PodMonitor selects pods by label, so without this the terminating pod of a
        # rolling update and a pod that is not ready yet stay in the target list
        # and every scrape of them fails. The ServiceMonitors get the same filter from
        # the EndpointSlice conditions.
        - sourceLabels: [__meta_kubernetes_pod_ready]
          regex: "true"
          action: keep
  selector:
    matchLabels:
      app: sds-common-scheduler-extender
  namespaceSelector:
    matchNames:
      - d8-{{ .Chart.Name }}
{{- end }}
