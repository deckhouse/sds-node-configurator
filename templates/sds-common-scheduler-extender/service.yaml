---
apiVersion: v1
kind: Service
metadata:
  name: sds-common-scheduler-extender
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "sds-common-scheduler-extender" )) | nindent 2 }}
spec:
  type: ClusterIP
  ports:
    - port: 8099
      targetPort: http
      protocol: TCP
      name: http
  {{- /* No metrics port here. This Service is what kube-scheduler calls; the metrics
         of the pod are scraped by the PodMonitor next to this file, the same way the
         other two scheduler extenders of the fleet are scraped. */}}
  selector:
    app: sds-common-scheduler-extender
