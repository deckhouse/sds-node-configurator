apiVersion: deckhouse.io/v1alpha1
kind: NodeGroupConfiguration
metadata:
  name: sds-node-configurator-host-lvm-autoactivation.sh
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
spec:
  weight: 100
  nodeGroups: ["*"]
  bundles: ["*"]
  content: |
    # Copyright 2026 Flant JSC
    #
    # Licensed under the Apache License, Version 2.0 (the "License");
    # you may not use this file except in compliance with the License.
    # You may obtain a copy of the License at
    #
    #     http://www.apache.org/licenses/LICENSE-2.0
    #
    # Unless required by applicable law or agreed to in writing, software
    # distributed under the License is distributed on an "AS IS" BASIS,
    # WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
    # See the License for the specific language governing permissions and
    # limitations under the License.

    host_lvm_cluster_uuid={{ ((.Values.global).discovery).clusterUUID | default "" | squote }}
    host_lvm_legacy_tag='@storage.deckhouse.io/enabled=true'
    host_lvm_cluster_tag_prefix='@storage.deckhouse.io/cluster='
    host_lvm_module_tag=
    if [[ $host_lvm_cluster_uuid =~ ^[A-Za-z0-9_+.-]+$ ]]; then
      host_lvm_module_tag="${host_lvm_cluster_tag_prefix}${host_lvm_cluster_uuid}"
    fi
    host_lvm_conf_dir=${LVM_SYSTEM_DIR:-/etc/lvm}
    host_lvm_proc=/proc
    host_lvm_sys=/sys
    host_lvm_dev=/dev
    host_lvm_fstab=/etc/fstab
    host_lvm_initramfs_resume=/etc/initramfs-tools/conf.d/resume
    host_lvm_kubelet_dir=/var/lib/kubelet

    host_lvm_say() {
      echo "lvm autoactivation: $*" >&2
    }

    host_lvm_vg_of_dm_name() {
      local name=${1//--//} vg
      vg=${name%%-*}
      if [ -z "$vg" ] || [ "$vg" = "$name" ]; then
        return 1
      fi
      printf '%s\n' "${vg//\//-}"
    }

    host_lvm_vgs_below() {
      local dir=$1 uuid name slave
      if [ -r "$dir/dm/uuid" ]; then
        uuid=$(cat "$dir/dm/uuid")
        case $uuid in
          LVM-*)
            name=$(cat "$dir/dm/name")
            if ! host_lvm_vg_of_dm_name "$name"; then
              host_lvm_say "cannot tell the Volume Group of the device-mapper device ${name}"
              return 1
            fi
            ;;
        esac
      fi
      if [ -e "$dir/partition" ]; then
        host_lvm_vgs_below "$(readlink -f "$dir/..")" || return 1
      fi
      for slave in "$dir"/slaves/*; do
        if [ -e "$slave" ]; then
          host_lvm_vgs_below "$(readlink -f "$slave")" || return 1
        fi
      done
      return 0
    }

    host_lvm_sysfs_of_majmin() {
      local dir="$host_lvm_sys/dev/block/$1"
      if [ -e "$dir" ]; then
        readlink -f "$dir"
        return 0
      fi
      return 1
    }

    host_lvm_sysfs_of_path() {
      local path=$1 real hex major minor
      case $path in
        /dev/*) path="$host_lvm_dev/${path#/dev/}" ;;
      esac
      real=$(readlink -f -- "$path" 2>/dev/null) || return 1
      if [ -e "$host_lvm_sys/class/block/${real##*/}" ]; then
        readlink -f "$host_lvm_sys/class/block/${real##*/}"
        return 0
      fi
      if [ -b "$real" ]; then
        hex=$(stat -L -c '%t %T' -- "$real") || return 1
        read -r major minor <<< "$hex"
        host_lvm_sysfs_of_majmin "$((16#$major)):$((16#$minor))"
        return
      fi
      return 1
    }

    host_lvm_device_of_spec() {
      case $1 in
        UUID=*|LABEL=*|PARTUUID=*|PARTLABEL=*)
          findfs "$1" 2>/dev/null || true
          ;;
        /dev/*)
          printf '%s\n' "$1"
          ;;
      esac
    }

    host_lvm_vgs_of_spec() {
      local spec=$1 origin=$2 dev dir rest
      dev=$(host_lvm_device_of_spec "$spec")
      if [ -z "$dev" ]; then
        case $spec in
          UUID=*|LABEL=*|PARTUUID=*|PARTLABEL=*)
            host_lvm_say "cannot find the device ${spec} named in ${origin}; if it is on LVM, add its Volume Group to activation/auto_activation_volume_list"
            ;;
        esac
        return 0
      fi
      if dir=$(host_lvm_sysfs_of_path "$dev"); then
        host_lvm_vgs_below "$dir"
        return
      fi
      case $dev in
        /dev/mapper/*)
          host_lvm_vg_of_dm_name "${dev#/dev/mapper/}" || true
          ;;
        /dev/disk/*|/dev/md/*|/dev/block/*)
          ;;
        /dev/*/*)
          rest=${dev#/dev/}
          case $rest in
            */*/*) ;;
            *) printf '%s\n' "${rest%%/*}" ;;
          esac
          ;;
      esac
      return 0
    }

    host_lvm_unescape() {
      printf '%b' "${1//\\/\\0}"
    }

    host_lvm_under_kubelet() {
      case $1 in
        "$host_lvm_kubelet_dir"|"$host_lvm_kubelet_dir"/*) return 0 ;;
      esac
      return 1
    }

    host_lvm_vgs_of_mounts() {
      local majmin target rest fstype source dir root_found=
      while read -r _ _ majmin _ target rest; do
        target=$(host_lvm_unescape "$target")
        read -r fstype source _ <<< "${rest#* - }"
        source=$(host_lvm_unescape "$source")
        if host_lvm_under_kubelet "$target"; then
          continue
        fi
        if [ "$target" = / ]; then
          root_found=1
        fi
        if [ "${majmin%%:*}" != 0 ]; then
          if ! dir=$(host_lvm_sysfs_of_majmin "$majmin"); then
            if [ "$target" = / ]; then
              host_lvm_say "cannot find the block device ${majmin} of the root filesystem in sysfs"
              return 1
            fi
            continue
          fi
        else
          case $source in
            /dev/*) ;;
            *) continue ;;
          esac
          if ! dir=$(host_lvm_sysfs_of_path "$source"); then
            if [ "$target" = / ]; then
              host_lvm_say "cannot find the device ${source} of the root filesystem in sysfs"
              return 1
            fi
            continue
          fi
        fi
        if ! host_lvm_vgs_below "$dir"; then
          if [ "$target" = / ]; then
            return 1
          fi
        fi
      done < "$host_lvm_proc/self/mountinfo"
      if [ -z "$root_found" ]; then
        host_lvm_say "the root filesystem is not in $host_lvm_proc/self/mountinfo"
        return 1
      fi
      return 0
    }

    host_lvm_vgs_of_swaps() {
      local file type rest
      [ -r "$host_lvm_proc/swaps" ] || return 0
      while read -r file type rest; do
        if [ "$type" = partition ]; then
          host_lvm_vgs_of_spec "$(host_lvm_unescape "$file")" "$host_lvm_proc/swaps"
        fi
      done < <(tail -n +2 "$host_lvm_proc/swaps")
      return 0
    }

    host_lvm_vgs_of_fstab() {
      local spec rest
      [ -r "$host_lvm_fstab" ] || return 0
      while read -r spec rest; do
        case $spec in
          ''|'#'*) continue ;;
        esac
        host_lvm_vgs_of_spec "$(host_lvm_unescape "$spec")" "$host_lvm_fstab"
      done < "$host_lvm_fstab"
      return 0
    }

    host_lvm_vgs_of_cmdline() {
      local arg args=()
      [ -r "$host_lvm_proc/cmdline" ] || return 0
      read -r -a args < "$host_lvm_proc/cmdline" || true
      for arg in "${args[@]}"; do
        case $arg in
          rd.lvm.vg=?*) printf '%s\n' "${arg#rd.lvm.vg=}" ;;
          rd.lvm.lv=?*/*) arg=${arg#rd.lvm.lv=}; printf '%s\n' "${arg%%/*}" ;;
          root=?*) host_lvm_vgs_of_spec "${arg#root=}" "$host_lvm_proc/cmdline" ;;
          resume=?*) host_lvm_vgs_of_spec "${arg#resume=}" "$host_lvm_proc/cmdline" ;;
        esac
      done
      return 0
    }

    host_lvm_vgs_of_initramfs_resume() {
      local line
      [ -r "$host_lvm_initramfs_resume" ] || return 0
      while IFS= read -r line; do
        case $line in
          RESUME=?*)
            line=${line#RESUME=}
            line=${line#\"}
            line=${line%\"}
            host_lvm_vgs_of_spec "$line" "$host_lvm_initramfs_resume"
            ;;
        esac
      done < "$host_lvm_initramfs_resume"
      return 0
    }

    host_lvm_system_vgs() {
      {
        host_lvm_vgs_of_mounts || return 1
        host_lvm_vgs_of_swaps
        host_lvm_vgs_of_fstab
        host_lvm_vgs_of_cmdline
        host_lvm_vgs_of_initramfs_resume
      } > "$1"
    }

    host_lvm_list_entries() {
      printf '%s\n' "$1" | grep -o '"[^"]*"' | tr -d '"' || true
    }

    host_lvm_configure_autoactivation() {
      local current= entries=() vgs_file vg entry known changed= new
      command -V lvmconfig >/dev/null 2>&1 || return 0
      test -f "$host_lvm_conf_dir/lvm.conf" || return 0

      vgs_file=$(mktemp)
      if ! host_lvm_system_vgs "$vgs_file"; then
        rm -f "$vgs_file"
        host_lvm_say "the Volume Groups the node boots from are not known, $host_lvm_conf_dir/lvm.conf is left as it is"
        return 0
      fi

      if current=$(lvmconfig activation/auto_activation_volume_list 2>/dev/null); then
        while IFS= read -r entry; do
          case $entry in
            '') ;;
            "$host_lvm_module_tag") entries+=("$entry") ;;
            "$host_lvm_legacy_tag"|"$host_lvm_cluster_tag_prefix"*) changed=1 ;;
            *) entries+=("$entry") ;;
          esac
        done < <(host_lvm_list_entries "$current")
      else
        current=
        changed=1
      fi

      while IFS= read -r vg; do
        [ -n "$vg" ] || continue
        if [ "$vg" != "$host_lvm_module_tag" ] && ! [[ $vg =~ ^[A-Za-z0-9+_.-]+$ ]]; then
          host_lvm_say "${vg} is not a Volume Group name, left out"
          continue
        fi
        known=
        for entry in "${entries[@]}"; do
          if [ "$entry" = "$vg" ]; then
            known=1
            break
          fi
        done
        if [ -z "$known" ]; then
          entries+=("$vg")
          changed=1
        fi
      done < <(sort -u "$vgs_file"; if [ -n "$host_lvm_module_tag" ]; then echo "$host_lvm_module_tag"; fi)
      rm -f "$vgs_file"

      [ -n "$changed" ] || return 0

      new=
      if [ "${#entries[@]}" -gt 0 ]; then
        new=$(printf '"%s",' "${entries[@]}")
      fi
      new="[${new%,}]"
      lvmconfig --config "activation/auto_activation_volume_list=$new" --withcomments --merge > "$host_lvm_conf_dir/lvm.conf.$$"
      mv "$host_lvm_conf_dir/lvm.conf.$$" "$host_lvm_conf_dir/lvm.conf"
      if [ -n "$current" ]; then
        host_lvm_say "changed ${current} to ${new}"
      else
        host_lvm_say "set activation/auto_activation_volume_list to ${new}"
      fi
    }

    host_lvm_configure_autoactivation
