apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: d8:{{ .Chart.Name }}:sds-node-configurator
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch
  # The agent's own heartbeat: a Lease in this module's namespace, renewed while
  # the agent runs. A Lease rather than an annotation because liveness needs a
  # lifetime — see the heartbeat package.
  #
  # Deliberately without list and watch. The heartbeat reads exactly one object by
  # name and does it with an UNCACHED client, because a cached read would start an
  # informer over every Lease in the cluster and demand those two verbs for it.
  # Granting them here instead would have hidden that: the module would have got
  # cluster-wide read of every lease in every namespace to renew one of its own.
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - create
      - update
      - patch
  # patch on nodes carries the fact that this node holds a pool's lockspace.
  # It is read by another module, which is why it lives on the Node rather than
  # in a status this module owns. The cost is worth naming: RBAC does not narrow
  # to the agent's own node — NodeRestriction is about kubelet identities — so
  # this is the right to write annotations on any node in the cluster.
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - patch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - list
  - apiGroups:
      - storage.deckhouse.io
    resources:
      - blockdevices
      - lvmvolumegroups
      - lvmvolumegroups/status
      - lvmlogicalvolumes
      - lvmlogicalvolumes/status
      - lvmlogicalvolumesnapshots
      - lvmlogicalvolumesnapshots/status
      - lvmsharedvolumegroups
      - lvmsharedvolumegroups/status
      - lvmsharedlogicalvolumes
      - lvmsharedlogicalvolumes/status
      - lvmsharedlogicalvolumeattachments
      - lvmsharedlogicalvolumeattachments/status
    verbs:
      - get
      - list
      - create
      - delete
      - watch
      - update
      # patch is a separate verb from update, and every write in the shared-pool
      # reconcilers is a merge patch. Without it they fail at runtime with
      # "cannot patch resource" while the rule reads as sufficient.
      - patch
  - apiGroups:
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - update
      - list
      - delete
      - patch
  - apiGroups:
      - storage.deckhouse.io
    resources:
      - blockdevicefilters
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - daemonsets
      - daemonsets/prometheus-metrics
    verbs:
      - get
  - apiGroups: 
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
  - apiGroups:
      - authorization.k8s.io
    resources:
      - subjectaccessreviews
    verbs:
      - create
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: d8:{{ .Chart.Name }}:sds-node-configurator
  {{- include "helm_lib_module_labels" (list .) | nindent 2 }}
subjects:
  - kind: ServiceAccount
    name: agent
    namespace: d8-{{ .Chart.Name }}
roleRef:
  kind: ClusterRole
  name: d8:{{ .Chart.Name }}:sds-node-configurator
  apiGroup: rbac.authorization.k8s.io
