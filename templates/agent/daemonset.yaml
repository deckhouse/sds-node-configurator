{{- define "sds_utils_installer_resources" }}
cpu: 10m
memory: 25Mi
{{- end }}

{{- define "sds_node_configurator_agent_resources" }}
cpu: 50m
memory: 50Mi
{{- end }}

{{- if (include "helm_lib_api_version_exists" (list . "autoscaling.k8s.io/v1/VerticalPodAutoscaler")) }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: sds-node-configurator
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "sds-health-watcher-controller")) | nindent 2 }}
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: DaemonSet
    name: sds-node-configurator
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
  resourcePolicy:
    containerPolicies:
    {{- /* The agent shells out to the LVM tooling, so a scan fans out over every device on the
           node and the cost scales with their count, not with cluster size. Over 7 days on a
           5-node stand with 128 cores each, the per-pod peaks were 344m/115Mi at the median,
           882m/230Mi at p90 and 1716m/1648Mi at the top. The ceiling covers that top; the
           recommender rounds memory up to a multiple of 64Mi, so 2Gi is 32 buckets and anything
           under 64Mi would cap every recommendation unconditionally. Requests come from
           minAllowed, which stays at 50m/50Mi, so this reserves nothing on an idle node. */}}
    - containerName: "sds-node-configurator-agent"
      minAllowed:
        {{- include "sds_node_configurator_agent_resources" . | nindent 8 }}
      maxAllowed:
        cpu: 2000m
        memory: 2Gi
    {{- include "helm_lib_vpa_kube_rbac_proxy_resources" . | nindent 4 }}
{{- end }}

{{- if not .Values.sdsNodeConfigurator.disableDs }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sds-node-configurator
  namespace: d8-{{ .Chart.Name }}
  {{- include "helm_lib_module_labels" (list . (dict "app" "sds-node-configurator")) | nindent 2 }}
spec:
  selector:
    matchLabels:
      app: sds-node-configurator
  template:
    metadata:
      name: sds-node-configurator
      namespace: d8-{{ .Chart.Name }}
      labels:
        app: sds-node-configurator
        {{- if .Values.global.enabledModules | has "admission-policy-engine" }}
        security.deckhouse.io/security-policy-exception: sds-node-configurator
        {{- end }}
    spec:
      {{- include "helm_lib_priority_class" (tuple . "cluster-medium") | nindent 6 }}
      {{- include "helm_lib_tolerations" (tuple . "any-node" "storage-problems") | nindent 6 }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: storage.deckhouse.io/sds-replicated-volume-node
                    operator: In
                    values:
                      - ""
              - matchExpressions:
                  - key: storage.deckhouse.io/sds-local-volume-node
                    operator: In
                    values:
                      - ""
              - matchExpressions:
                  - key: storage.deckhouse.io/sds-elastic-node
                    operator: In
                    values:
                      - ""
      dnsPolicy: ClusterFirstWithHostNet
      imagePullSecrets:
        - name: {{ .Chart.Name }}-module-registry
      serviceAccountName: agent
      hostPID: true
      hostNetwork: true
      # We need root privileges to perform LVM operations on the node.
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
        runAsGroup: 0
        seLinuxOptions:
          level: s0
          type: spc_t
      initContainers:
      - name: sds-utils-installer
        image: {{ include "helm_lib_module_image" (list . "sdsUtilsInstaller") }}
        imagePullPolicy: IfNotPresent
        command:
        - /sds-utils-installer
        - /sds-utils
        - /var/lib/deckhouse/sds
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /var/lib/deckhouse/sds
          name: var-lib-deckhouse-sds
        resources:
          requests:
            {{- include "helm_lib_module_ephemeral_storage_only_logs" . | nindent 14 }}
{{- if not (include "helm_lib_api_version_exists" (list . "autoscaling.k8s.io/v1/VerticalPodAutoscaler")) }}
            {{- include "sds_utils_installer_resources" . | nindent 14 }}
{{- end }}
      - name: thin-volumes-enabler
        image: {{ include "helm_lib_module_image" (list . "agent") }}
        imagePullPolicy: IfNotPresent
        command:
          - /var/lib/deckhouse/sds/bin/nsenter
          - -t
          - "1"
          - -m
          - -u
          - -i
          - -n
          - -p
          - --
          - sh
          - -c
          # dm_snapshot is loaded whatever modules are enabled, as a safety net for any `lvcreate -s`
          # on the node: that form demands the dm-snapshot target even for a thin origin. The agent
          # itself creates thin snapshots with `--type thin` and does not need it, so a kernel
          # without dm_snapshot must not keep the agent from starting.
          - modprobe dm_thin_pool || echo "dm_thin_pool is not available, thin pools cannot be created on this node" >&2; modprobe dm_snapshot || echo "dm_snapshot is not available, skipped"
        # Privileged mode is required to use nsenter and access the host's mount namespace.
        # This is necessary to run modprobe and load the dm_thin_pool kernel module on the host.
        securityContext:
          privileged: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - mountPath: /dev/
            name: host-device-dir
          - mountPath: /sys/
            name: host-sys-dir
          - mountPath: /sys/fs/cgroup
            name: host-sys-fs-cgroup
          - mountPath: /run/udev/
            name: host-run-udev-dir
        resources:
          requests:
            {{- include "helm_lib_module_ephemeral_storage_only_logs" . | nindent 14 }}
{{- if not (include "helm_lib_api_version_exists" (list . "autoscaling.k8s.io/v1/VerticalPodAutoscaler")) }}
            {{- include "sds_utils_installer_resources" . | nindent 14 }}
{{- end }}
      containers:
      - name: sds-node-configurator-agent
        image: {{ include "helm_lib_module_image" (list . "agent") }}
        imagePullPolicy: IfNotPresent
        # startupProbe must succeed before liveness/readiness start.
        # The agent runs LVM operations (pvscan/vgscan/vgchange) via
        # nsenter on the host and they may take a long time on nodes
        # with many devices, so we allow up to ~5 minutes here.
        startupProbe:
          httpGet:
            path: /healthz
            host: 127.0.0.1
            port: 4228
            scheme: HTTP
          periodSeconds: 2
          failureThreshold: 150
        readinessProbe:
          httpGet:
            path: /readyz
            host: 127.0.0.1
            port: 4228
            scheme: HTTP
          initialDelaySeconds: 5
          failureThreshold: 2
          periodSeconds: 1
        livenessProbe:
          httpGet:
            path: /healthz
            host: 127.0.0.1
            port: 4228
            scheme: HTTP
          periodSeconds: 1
          failureThreshold: 3
        env:
          - name: HEALTH_PROBE_BIND_ADDRESS
            value: 127.0.0.1:4228
          # Read by every binary in the fleet under this name; the agent used to read
          # METRICS_PORT. kube-rbac-proxy in this same pod is what publishes it.
          #
          # The pod is hostNetwork, so this is the NODE's loopback: the endpoint is
          # unreachable from off the node but stays open, unauthenticated, to anything
          # in the node's network namespace. Fine for these metrics, not a place to put
          # anything else.
          - name: METRICS_BIND_ADDRESS
            value: 127.0.0.1:9000
          - name: NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: CLUSTER_UUID
            value: {{ ((.Values.global).discovery).clusterUUID | default "" | quote }}
          - name: FILE_DEVICES_DIRECTORY
            value: {{ .Values.sdsNodeConfigurator.fileDevicesDirectory | quote }}
          - name: FILE_DEVICES_MIN_FREE_SPACE_PERCENT
            value: {{ .Values.sdsNodeConfigurator.fileDevicesMinFreeSpacePercent | quote }}
          - name: MISSING_BLOCK_DEVICE_RETENTION_HOURS
            value: {{ .Values.sdsNodeConfigurator.missingBlockDeviceRetentionHours | quote }}
{{- /* The same define the controller container gets its level from, in place of a
       copy of the ERROR..TRACE map that was maintained here, in the extender
       deployment and in the extender ConfigMap. */}}
          - name: LOG_LEVEL
            value: {{ include "helm_lib_module_controller_log_level" (list . "sdsNodeConfigurator") | quote }}
          - name: ENABLE_NETLINK_BLOCK_DEVICE_DISCOVERY
            value: {{ .Values.sdsNodeConfigurator.enableNetlinkBlockDeviceDiscovery | quote }}
        # Privileged mode is required to use nsenter and execute host-level commands like lvm and lsblk.
        securityContext:
          privileged: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /dev/
          name: host-device-dir
        - mountPath: /sys/
          name: host-sys-dir
        - mountPath: /sys/fs/cgroup
          name: host-sys-fs-cgroup
        - mountPath: /run/udev/
          name: host-run-udev-dir
        # Read-only, and only so the agent can tell which block devices this
        # cluster has published to a workload: `publish/<pvName>/<podUID>` under
        # it is a device node kubelet created for a block volume, `staging/<pvName>`
        # a volume staged on the node. A device that is somebody's volume is not
        # this node's storage: the agent's lvm commands reject it by name. See
        # utils.PublishedDevices in the agent.
        #
        # HostToContainer so that anything a CSI driver bind-mounts inside this
        # tree (some drivers stage a block volume that way) is visible here too.
        - mountPath: /var/lib/kubelet/plugins/kubernetes.io/csi/volumeDevices
          name: host-csi-volume-devices-dir
          readOnly: true
          mountPropagation: HostToContainer
        resources:
          requests:
            {{- include "helm_lib_module_ephemeral_storage_only_logs" . | nindent 14 }}
{{- if not (include "helm_lib_api_version_exists" (list . "autoscaling.k8s.io/v1/VerticalPodAutoscaler")) }}
            {{- include "sds_node_configurator_agent_resources" . | nindent 14 }}
{{- end }}
      - name: kube-rbac-proxy
        {{- include "helm_lib_module_container_security_context_pss_restricted_flexible" dict | nindent 8 }}
        image: {{ include "helm_lib_module_common_image" (list . "kubeRbacProxy") }}
        args:
        - "--secure-listen-address=$(KUBE_RBAC_PROXY_LISTEN_ADDRESS):4202"
        - "--v=2"
        - "--logtostderr=true"
        - "--stale-cache-interval=1h30m"
        - "--livez-path=/livez"
        ports:
        - containerPort: 4202
          name: https-metrics
        livenessProbe:
          httpGet:
            path: /livez
            port: 4202
            scheme: HTTPS
        readinessProbe:
          httpGet:
            path: /livez
            port: 4202
            scheme: HTTPS
        env:
        - name: KUBE_RBAC_PROXY_LISTEN_ADDRESS
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: KUBE_RBAC_PROXY_CONFIG
          value: |
            # The path both probes of this container hit, and the one lib-helm's
            # kube-rbac-proxy block excludes. /healthz and /readyz were listed here
            # and are requested by nothing.
            excludePaths:
            - /livez
            upstreams:
            - upstream: http://127.0.0.1:9000/metrics
              path: /metrics
              authorization:
                resourceAttributes:
                  namespace: d8-{{ .Chart.Name }}
                  apiGroup: apps
                  apiVersion: v1
                  resource: daemonsets
                  subresource: prometheus-metrics
                  name: sds-node-configurator
        resources:
          requests:
            {{- include "helm_lib_module_ephemeral_storage_only_logs" . | nindent 14 }}
{{- if not (include "helm_lib_api_version_exists" (list . "autoscaling.k8s.io/v1/VerticalPodAutoscaler")) }}
            {{- include "helm_lib_container_kube_rbac_proxy_resources" . | nindent 14 }}
{{- end }}
      volumes:
      - hostPath:
          path: /var/lib/deckhouse/sds
          type: DirectoryOrCreate
        name: var-lib-deckhouse-sds
      - hostPath:
          path: /dev/
          type: ""
        name: host-device-dir
      - hostPath:
          path: /sys/
          type: Directory
        name: host-sys-dir
      - hostPath:
          path: /sys/fs/cgroup
          type: Directory
        name: host-sys-fs-cgroup
      - hostPath:
          path: /run/udev/
          type: Directory
        name: host-run-udev-dir
      # DirectoryOrCreate rather than Directory: the directory only exists once
      # kubelet has staged a block volume on the node, and the agent must start on
      # a node that never had one. An empty directory reads as "nothing published",
      # which is the agent's behaviour before this mount existed, so on a node
      # whose kubelet root is elsewhere the filter is silently off. The agent says
      # so at startup and publishes it as published_devices_directory_present;
      # moving the path means moving it here, in the mountPath above and in
      # internal.DefaultCSIVolumeDevicesDirectory together.
      - hostPath:
          path: /var/lib/kubelet/plugins/kubernetes.io/csi/volumeDevices
          type: DirectoryOrCreate
        name: host-csi-volume-devices-dir
{{- end }}
