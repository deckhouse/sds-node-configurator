{{- /* Webhook TLS Certs Secret */ -}}
{{- $secretConfig := dict
  "valuesKey" "sdsNodeConfigurator"
  "webhookCertPath" "internal.customWebhookCert"
}}
{{ include "helm_lib_module_webhook_certs_secret" (list . $secretConfig) }}

{{- /* Controller Deployment.
       controllerMaxCpu overrides the 200m default of helm_lib_module_controller_manifests: the
       health watcher polls every node's agent, so it is measurably hungrier than the generic
       controller the define is sized for, and its 7-day peak of 196m sat on that default, which
       pinned the recommendation to the ceiling. Memory peaked at 98Mi and the default covers it. */ -}}
{{- $controllerEnvs := list
  (dict "name" "LEADER_ELECTION" "value" "true")
  (dict "name" "LEADER_ELECTION_NAMESPACE" "valueFrom" (dict "fieldRef" (dict "fieldPath" "metadata.namespace")))
  (dict "name" "LEADER_ELECTION_ID" "value" "sds-health-watcher-controller-leader-election")
  (dict "name" "AGENT_NAMESPACE" "valueFrom" (dict "fieldRef" (dict "fieldPath" "metadata.namespace")))
  (dict "name" "MISSING_BLOCK_DEVICE_RETENTION_HOURS" "value" (.Values.sdsNodeConfigurator.missingBlockDeviceRetentionHours | toString))
  (dict "name" "MISSING_NODE_GRACE_PERIOD_MINUTES" "value" (.Values.sdsNodeConfigurator.missingNodeGracePeriodMinutes | toString))
}}

{{- $config := dict
  "valuesKey" "sdsNodeConfigurator"
  "webhookEnabled" true
  "webhooksInController" true
  "webhookCertPath" "internal.customWebhookCert"
  "onMasterNode" true
  "podSecurityContext" "nobody"
  "controllerMetricsPort" (int .Values.sdsNodeConfigurator.internal.controllerMetricsPort)
  "controllerMetricsProxyPort" (int .Values.sdsNodeConfigurator.internal.controllerMetricsProxyPort)
  "controllerMetricsInProcessAuthorization" true
  "additionalControllerEnvs" $controllerEnvs
  "controllerMaxCpu" "500m"
}}
{{ include "helm_lib_module_controller_manifests" (list . $config) }}

{{- /* Webhook Service with metrics port */ -}}
{{- $serviceConfig := dict
    "additionalPorts" (list
    (dict "name" "https-metrics" "port" (int .Values.sdsNodeConfigurator.internal.controllerMetricsProxyPort) "targetPort" "https-metrics")
  )
}}
{{ include "helm_lib_module_webhook_service" (list . $serviceConfig) }}

{{- /* ValidatingWebhookConfiguration for LVMLogicalVolumeSnapshots */ -}}
{{- $llvsWebhookConfig := dict
  "name" "llvs-validation"
  "webhookName" "llvs-validation"
  "valuesKey" "sdsNodeConfigurator"
  "path" "/llvs-validate"
  "rules" (list (dict "apiGroups" (list "storage.deckhouse.io") "apiVersions" (list "v1alpha1") "operations" (list "*") "resources" (list "lvmlogicalvolumesnapshots") "scope" "Cluster"))
}}
{{ include "helm_lib_module_validating_webhook_configuration" (list . $llvsWebhookConfig) }}

{{- /* ValidatingWebhookConfiguration for LVMVolumeGroups: rejects a second resource for a Volume Group of a node */ -}}
{{- $lvgWebhookConfig := dict
  "name" "lvg-validation"
  "webhookName" "lvg-validation"
  "valuesKey" "sdsNodeConfigurator"
  "path" "/lvg-validate"
  "rules" (list (dict "apiGroups" (list "storage.deckhouse.io") "apiVersions" (list "v1alpha1") "operations" (list "CREATE") "resources" (list "lvmvolumegroups") "scope" "Cluster"))
}}
{{ include "helm_lib_module_validating_webhook_configuration" (list . $lvgWebhookConfig) }}
