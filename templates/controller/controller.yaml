{{- /* Webhook TLS Certs Secret */ -}}
{{- $secretConfig := dict
  "valuesKey" "sdsNodeConfigurator"
  "webhookCertPath" "internal.customWebhookCert"
}}
{{ include "helm_lib_module_webhook_certs_secret" (list . $secretConfig) }}

{{- /* Controller Deployment */ -}}
{{- $leaderElectionEnvs := list
  (dict "name" "LEADER_ELECTION" "value" "true")
  (dict "name" "LEADER_ELECTION_NAMESPACE" "valueFrom" (dict "fieldRef" (dict "fieldPath" "metadata.namespace")))
  (dict "name" "LEADER_ELECTION_ID" "value" "sds-health-watcher-controller-leader-election")
}}

{{- $config := dict
  "valuesKey" "sdsNodeConfigurator"
  "webhookEnabled" true
  "webhookCertPath" "internal.customWebhookCert"
  "onMasterNode" true
  "podSecurityContext" "nobody"
  "controllerMetricsPort" 8080
  "additionalControllerEnvs" $leaderElectionEnvs
}}
{{ include "helm_lib_module_controller_manifests" (list . $config) }}

{{- /* Webhook Service with metrics port */ -}}
{{- $serviceConfig := dict
    "additionalPorts" (list
    (dict "name" "metrics" "port" 8080 "targetPort" "metrics")
  )
}}
{{ include "helm_lib_module_webhook_service" (list . $serviceConfig) }}

{{- /* ValidatingWebhookConfiguration for LVMLogicalVolumeSnapshots */ -}}
{{- $llvsWebhookConfig := dict
  "name" "llvs-validation"
  "webhookName" "llvs-validation"
  "valuesKey" "sdsNodeConfigurator"
  "path" "/llvs-validate"
  "rules" (list (dict "apiGroups" (list "storage.deckhouse.io") "apiVersions" (list "v1alpha1") "operations" (list "*") "resources" (list "lvmlogicalvolumesnapshots") "scope" "Cluster"))
}}
{{ include "helm_lib_module_validating_webhook_configuration" (list . $llvsWebhookConfig) }}

{{- /*
  ValidatingWebhookConfigurations for the shared pool. Only the rules that need
  a SECOND object live here — a volume's erase policy against the floor its pool
  demands, an attachment's node against the pool's member list. Everything
  expressible inside one resource is a CRD validation rule instead, where it is
  enforced even when this webhook is unavailable.
*/ -}}
{{- $lsllvWebhookConfig := dict
  "name" "lsllv-validation"
  "webhookName" "lsllv-validation"
  "valuesKey" "sdsNodeConfigurator"
  "path" "/lsllv-validate"
  "rules" (list (dict "apiGroups" (list "storage.deckhouse.io") "apiVersions" (list "v1alpha1") "operations" (list "CREATE" "UPDATE") "resources" (list "lvmsharedlogicalvolumes") "scope" "Cluster"))
}}
{{ include "helm_lib_module_validating_webhook_configuration" (list . $lsllvWebhookConfig) }}

{{- $lsllvaWebhookConfig := dict
  "name" "lsllva-validation"
  "webhookName" "lsllva-validation"
  "valuesKey" "sdsNodeConfigurator"
  "path" "/lsllva-validate"
  "rules" (list (dict "apiGroups" (list "storage.deckhouse.io") "apiVersions" (list "v1alpha1") "operations" (list "CREATE" "UPDATE") "resources" (list "lvmsharedlogicalvolumeattachments") "scope" "Cluster"))
}}
{{ include "helm_lib_module_validating_webhook_configuration" (list . $lsllvaWebhookConfig) }}
