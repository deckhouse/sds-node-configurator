{{- /* RBAC */ -}}
{{- /*
  controllerMetricsProxyPort is not used as a port here. It is how
  helm_lib_module_controller_rbac learns that the pod carries a kube-rbac-proxy in
  front of the metrics, and therefore needs the ClusterRoleBinding to d8:rbac-proxy
  that lets the sidecar create the TokenReview and SubjectAccessReview every scrape
  is authorised with. Keep it in step with the value given to
  helm_lib_module_controller_manifests: without it the proxy fails closed on every
  scrape and the only symptom is up == 0 and a permanent TargetDown.
*/ -}}
{{- $rbacConfig := dict
  "controllerMetricsProxyPort" (int .Values.sdsNodeConfigurator.internal.controllerMetricsProxyPort)
  "roleRules" (list
    (dict "apiGroups" (list "") "resources" (list "events") "verbs" (list "create" "patch"))
  )
  "clusterRoleRules" (list
    (dict "apiGroups" (list "storage.deckhouse.io") "resources" (list "blockdevices") "verbs" (list "get" "list" "watch" "update" "delete"))
    (dict "apiGroups" (list "storage.deckhouse.io") "resources" (list "lvmvolumegroupsets" "lvmvolumegroupsets/status") "verbs" (list "get" "list" "watch" "update"))
    (dict "apiGroups" (list "storage.deckhouse.io") "resources" (list "lvmvolumegroups" "lvmvolumegroups/status") "verbs" (list "get" "list" "watch" "update" "create" "patch"))
    (dict "apiGroups" (list "storage.deckhouse.io") "resources" (list "lvmlogicalvolumes") "verbs" (list "get" "list" "patch"))
    (dict "apiGroups" (list "storage.deckhouse.io") "resources" (list "lvmlogicalvolumesnapshots") "verbs" (list "get" "list" "watch" "patch"))
    (dict "apiGroups" (list "") "resources" (list "events") "verbs" (list "create" "patch"))
    (dict "apiGroups" (list "") "resources" (list "nodes" "pods") "verbs" (list "get" "list" "watch"))
    (dict "apiGroups" (list "coordination.k8s.io") "resources" (list "leases") "verbs" (list "get" "list" "watch" "update" "create" "delete"))
  )
}}
{{ include "helm_lib_module_controller_rbac" (list . $rbacConfig) }}
{{- /*
  The controller records Events on LVMVolumeGroup and LVMVolumeGroupSet through
  the core/v1 recorder. Both kinds are cluster-scoped, and the Event of a
  cluster-scoped object is created in the default namespace: client-go creates
  it there and patches it on a repeat. The "events" rule in roleRules above
  covers only the module namespace, where leader election records.
*/}}
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: d8:{{ .Chart.Name }}:controller:events
  namespace: default
  {{- include "helm_lib_module_labels" (list . (dict "app" "controller")) | nindent 2 }}
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: d8:{{ .Chart.Name }}:controller:events
  namespace: default
  {{- include "helm_lib_module_labels" (list . (dict "app" "controller")) | nindent 2 }}
subjects:
  - kind: ServiceAccount
    name: controller
    namespace: d8-{{ .Chart.Name }}
roleRef:
  kind: Role
  name: d8:{{ .Chart.Name }}:controller:events
  apiGroup: rbac.authorization.k8s.io
