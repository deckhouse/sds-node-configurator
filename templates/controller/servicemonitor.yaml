{{- if (include "helm_lib_api_version_exists" (list . "monitoring.coreos.com/v1/ServiceMonitor")) }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sds-health-watcher-controller
  namespace: d8-monitoring
  {{- include "helm_lib_module_labels" (list $ (dict "prometheus" "main")) | nindent 2 }}
spec:
  endpoints:
  - port: https-metrics
    scheme: https
    path: /metrics
    bearerTokenSecret:
      name: "prometheus-token"
      key: "token"
    tlsConfig:
      insecureSkipVerify: true
    relabelings:
    - regex: endpoint|namespace|pod|container
      action: labeldrop
    - targetLabel: job
      replacement: sds-health-watcher-controller
    - targetLabel: tier
      replacement: cluster
    - sourceLabels: [__meta_kubernetes_endpointslice_endpoint_conditions_ready]
      regex: "true"
      action: keep
  selector:
    # The Service is the one helm_lib_module_webhook_service renders, and it is
    # labelled after the Deployment -- "controller". Selecting
    # "sds-health-watcher-controller" matched no Service at all, so nothing was
    # scraped however the port was declared; the job label below is what carries the
    # controller's name into Prometheus.
    matchLabels:
      app: controller
  namespaceSelector:
    matchNames:
    - d8-{{ .Chart.Name }}
{{- end }}
