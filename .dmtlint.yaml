linters-settings:
  container:
    exclude-rules:
      no-new-privileges:
        - kind: DaemonSet
          name: sds-node-configurator
          container: sds-node-configurator-agent
        - kind: DaemonSet
          name: sds-node-configurator
          container: thin-volumes-enabler
  module:
    oss:
      disable: true
    exclude-rules:
      license:
        directories:
          # The storage-e2e SDK, checked out into the module's workspace by the
          # e2e reusable workflow. Runners reuse workspaces, so it is still on
          # disk when a later job lints the module. It is another repository's
          # code and carries its own headers; .helmignore alone does not keep
          # this linter out of it.
          - _storage-e2e/
          # The CVE-scan tooling, dropped into the module's workspace by the
          # reusable scan job. Same reused-workspace story as above and the same
          # remedy: the Lint job checks out with clean:false, so whatever an
          # earlier job on that runner left behind is still there when dmt walks
          # the directory. Which runner picked the job then decides whether Lint
          # is red, for a tree that has not changed.
          - cve-scan/
        files:
          - cve_scan.sh
          - process_digest.py
          - send_report.py
  no-cyrillic:
    exclude-rules:
      directories:
        - hack/
        - e2e/
        # Same leftover checkout: its Russian comments are not ours to fix.
        - _storage-e2e/
  openapi:
    exclude-rules:
      enum:
        - spec.versions[0].schema.openAPIV3Schema.properties.status.properties.fsType
