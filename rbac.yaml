# The module RBAC declaration, read from the RBAC objects the module renders. Review it: every TODO is a
# decision "dmt lint" reports; then run "dmt lint --linter rbac --fix" to bring the templates in line with it.
# Objects rendered only under values other than the defaults are not here: lint with --values-file (or
# --matrix) before the first --fix of the templates if the module has such templates, and declare them with when.
#
# Notes:
# - ServiceAccount agent mounted its token (automountServiceAccountToken unset or true); kept as true -- set false once its pods mount the token themselves
# - ServiceAccount sds-common-scheduler-extender mounted its token (automountServiceAccountToken unset or true); kept as true -- set false once its pods mount the token themselves
#
# Not described by the declaration (stays hand-written, as it is):
# - ClusterRole/d8:sds-node-configurator:controller (templates/controller/rbac-for-us.yaml): rendered by an include of a named template (helm_lib or another chart), which owns it
# - ClusterRoleBinding/d8:sds-node-configurator:controller (templates/controller/rbac-for-us.yaml): rendered by an include of a named template (helm_lib or another chart), which owns it
# - ClusterRoleBinding/d8:sds-node-configurator:controller:rbac-proxy (templates/controller/rbac-for-us.yaml): rendered by an include of a named template (helm_lib or another chart), which owns it
# - d8-sds-node-configurator/Role/controller (templates/controller/rbac-for-us.yaml): rendered by an include of a named template (helm_lib or another chart), which owns it
# - d8-sds-node-configurator/RoleBinding/controller (templates/controller/rbac-for-us.yaml): rendered by an include of a named template (helm_lib or another chart), which owns it
# - d8-sds-node-configurator/ServiceAccount/controller (templates/controller/rbac-for-us.yaml): rendered by an include of a named template (helm_lib or another chart), which owns it
# - default/Role/d8:sds-node-configurator:controller:events (templates/controller/rbac-for-us.yaml): shares templates/controller/rbac-for-us.yaml with objects a helm_lib include renders; --fix writes the whole file, so it stays hand-written
# - default/RoleBinding/d8:sds-node-configurator:controller:events (templates/controller/rbac-for-us.yaml): shares templates/controller/rbac-for-us.yaml with objects a helm_lib include renders; --fix writes the whole file, so it stays hand-written
apiVersion: rbac.deckhouse.io/v1alpha1
resources:
