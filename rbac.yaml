serviceAccounts:
  - name: agent
    path: agent
    extraClusterRoles:
      - name: d8:sds-node-configurator:sds-node-configurator
        rules:
          - apiGroups:
              - ""
            resources:
              - nodes
            verbs:
              - get
              - list
              - watch
          - apiGroups:
              - ""
            resources:
              - events
            verbs:
              - create
              - patch
          - apiGroups:
              - storage.deckhouse.io
            resources:
              - blockdevices
              - lvmvolumegroups
              - lvmvolumegroups/status
              - lvmlogicalvolumes
              - lvmlogicalvolumes/status
              - lvmlogicalvolumesnapshots
              - lvmlogicalvolumesnapshots/status
            verbs:
              - get
              - list
              - create
              - delete
              - watch
              - update
          - apiGroups:
              - events.k8s.io
            resources:
              - events
            verbs:
              - create
              - update
              - list
              - delete
              - patch
          - apiGroups:
              - storage.deckhouse.io
            resources:
              - blockdevicefilters
            verbs:
              - get
              - list
              - watch
          - apiGroups:
              - apps
            resources:
              - daemonsets
              - daemonsets/prometheus-metrics
            verbs:
              - get
          - apiGroups:
              - authentication.k8s.io
            resources:
              - tokenreviews
            verbs:
              - create
          - apiGroups:
              - authorization.k8s.io
            resources:
              - subjectaccessreviews
            verbs:
              - create
    automountServiceAccountToken: true
  - name: sds-common-scheduler-extender
    path: sds-common-scheduler-extender
    labels:
      app: sds-common-scheduler-extender
    clusterRules:
      - apiGroups:
          - storage.deckhouse.io
        resources:
          - lvmvolumegroups
        verbs:
          - list
          - watch
          - get
      - apiGroups:
          - storage.deckhouse.io
        resources:
          - lvmlogicalvolumes
        verbs:
          - list
          - watch
          - get
      - apiGroups:
          - storage.deckhouse.io
        resources:
          - replicatedstorageclasses
        verbs:
          - get
          - list
          - watch
      - apiGroups:
          - storage.deckhouse.io
        resources:
          - replicatedstoragepools
        verbs:
          - get
          - list
          - watch
      - apiGroups:
          - storage.deckhouse.io
        resources:
          - replicatedvolumes
        verbs:
          - get
          - list
          - watch
      - apiGroups:
          - deckhouse.io
        resources:
          - moduleconfigs
        verbs:
          - get
          - list
          - watch
    namespaceRules:
      - apiGroups:
          - coordination.k8s.io
        resources:
          - leases
        verbs:
          - create
      - apiGroups:
          - coordination.k8s.io
        resources:
          - leases
        resourceNames:
          - sds-common-scheduler-extender
        verbs:
          - get
          - update
    roleName: sds-common-scheduler-extender-leader-election
    bindClusterRoles:
      - name: system:kube-scheduler
        bindingName: d8:sds-node-configurator:sds-common-scheduler-extender-kube-scheduler
      - name: system:volume-scheduler
        bindingName: d8:sds-node-configurator:sds-common-scheduler-extender-volume-scheduler
    automountServiceAccountToken: true
prometheusAccess:
  - path: agent
    name: prometheus-metrics
    daemonsets:
      - sds-node-configurator
    when: (.Values.global.enabledModules | has "prometheus")
    labels:
      app: sds-node-configurator
  - path: controller
    name: prometheus-metrics
    deployments:
      - controller
    when: (.Values.global.enabledModules | has "prometheus")
    labels:
      app: controller
  - path: sds-common-scheduler-extender
    name: prometheus-metrics
    deployments:
      - sds-common-scheduler-extender
    when: (.Values.global.enabledModules | has "prometheus")
    labels:
      app: sds-common-scheduler-extender
access:
  - name: admin-kubeconfig
    subjects:
      - kind: Group
        name: kubeadm:cluster-admins
    clusterRules:
      - apiGroups:
          - storage.deckhouse.io
        resources:
          - blockdevices
          - lvmlogicalvolumes
          - lvmlogicalvolumesnapshots
          - lvmvolumegroups
          - lvmvolumegroupsets
        verbs:
          - get
          - list
          - watch
          - create
          - delete
          - deletecollection
          - patch
          - update
