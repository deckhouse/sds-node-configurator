    resource: blockdevices
    system:
      manager:
        - create
        - delete
        - deletecollection
        - patch
        - update
      viewer:
        - get
        - list
        - watch
    legacy:
      ClusterEditor:
        - create
        - delete
        - deletecollection
        - patch
        - update
      User:
        - get
        - list
        - watch
  - group: storage.deckhouse.io
