Изменения:
  - Добавлена поддержка LVM на файловых устройствах: LVMVolumeGroup и LVMVolumeGroupSet принимают spec.fileDevices, что позволяет создавать LVM-хранилище на узле без свободного диска; каталог и резерв свободного места задаются настройками модуля fileDevicesDirectory и fileDevicesMinFreeSpacePercent
  - Добавлен экспериментальный режим обнаружения блочных устройств через netlink (флаг ENABLE_NETLINK_BLOCK_DEVICE_DISCOVERY, по умолчанию выключен)
  - Исправление: том, созданный из снапшота или клона, теперь расширяется до запрошенного размера — PVC больше не остаётся в Pending
  - Исправление: thin-pool, заданный процентом от VG, больше не зацикливается в состоянии «is not valid» из-за округления LVM на один экстент
  - Исправление: no-op расширение lvextend распознаётся на всех версиях LVM — LVMVolumeGroup больше не уходит в NotReady
  - Исправление: пустой lv_attr больше не приводит к панике контроллера обнаружения LVMVolumeGroup
  - Исправление: при взятии существующей VG под управление больше не формируется пустой blockDeviceSelector
  - Исправление: после pvcreate и vgcreate вызывается udevadm, чтобы обновить базу udev
  - Исправление: модуль ядра dm_snapshot загружается, когда включён storage-foundation
  - Обновление базовых образов до v1.3.10, Go 1.26.5 и lib-helm до 1.72.10, устранены уязвимости в golang.org/x/{net,text}
  - Документация: описание файловых устройств в RESOURCES и FAQ
  - Внутренние изменения в сборке модуля и в e2e-тестах
