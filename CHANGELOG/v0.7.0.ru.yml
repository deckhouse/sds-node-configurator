Изменения:
  - Исправление: агент больше не принимает за свои LVM-структуры внутри блочных устройств, отданных виртуальным машинам, — в LVM global_filter возвращено исключение /dev/loop. Устранены вызванные этим отказы LVMVolumeGroup с причинами CacheEmpty и ScanFailed — имя VG больше не считается идентификатором, а предупреждение LVM о дубликате чужого имени не приписывается нашей группе
  - Добавлена поддержка LVM на файлах: поле spec.fileDevices у LVMVolumeGroup и LVMVolumeGroupSet. Агент создаёт файл, подключает его как loop-устройство и использует как PV, что даёт LVM-хранилище на узле без свободного диска; поле blockDeviceSelector стало необязательным
  - Планировщик (scheduler-extender) учитывает PVC, перечисленные в аннотации пода extra-pvcs
  - LVMLogicalVolume, LVMLogicalVolumeSnapshot и LVMVolumeGroupSet публикуют status.conditions; у BlockDevice появилось условие Consumable, объясняющее, почему устройство нельзя использовать; обработка условий LVMVolumeGroup приведена к общему виду
  - Исправление: том, созданный из снапшота или клонированием, расширяется до запрошенного размера — раньше PVC оставался в Pending в ожидании размера, который никогда не появлялся
  - Исправление: тонкий пул, заданный процентом от размера VG, больше не застревает в VGConfigurationApplied=False из-за округления LVM на один экстент
  - Исправление: холостой вызов lvextend распознаётся как безобидный и на LVM 2.03.16 — иначе LVMVolumeGroup оставался в NotReady
  - Исправление: при взятии существующей VG под управление blockDeviceSelector больше не остаётся пустым
  - Исправление: после pvcreate и vgcreate агент вызывает udevadm, чтобы обновить базу udev
  - Исправление: при включённом storage-foundation агент загружает модуль ядра dm_snapshot
  - Удалён устаревший CRD LvmVolumeGroupBackup, оставшийся от разовой миграции: новый хук снимает финализаторы с остатков и удаляет сам CRD
  - Добавлен экспериментальный режим обнаружения блочных устройств через netlink, включаемый флагом ENABLE_NETLINK_BLOCK_DEVICE_DISCOVERY
  - Обновление базовых образов до v1.3.25, Go 1.26.5 и lib-helm до 1.72.13
  - Устранены уязвимости в golang.org/x/net, golang.org/x/sys и golang.org/x/crypto
  - Внутренние изменения в сборке модуля и CI, значительно расширен набор e2e-тестов
