Изменения:
  - Исправление: одно «осиротевшее» устройство device-mapper без диска больше не останавливает обнаружение BlockDevice на всём узле — раньше из-за него агент не создавал ни одного BlockDevice на ноде, включая исправные диски
  - Исправление: LVMVolumeGroup с единственным PV, чьё имя не удалось определить сразу, больше не зависает в Pending навсегда — устранены пустая публикация status.nodes и отсутствие повторной попытки при отсутствии udev-событий
  - Исправление: агент подставляет унаследованный от родительского устройства серийный номер, если прямое чтение серийника не удалось (участники multipath, crypt/dm-устройства) — раньше такие устройства пропускались при обнаружении BlockDevice
  - Опциональные ресурсы (VerticalPodAutoscaler, PodMonitor/ServiceMonitor) теперь включаются по факту наличия CRD в API, а не по списку enabledModules
  - Документация: исправлено дублирование ключа description в русских CRD LVMVolumeGroup, ломавшее docs-builder, добавлено недостающее описание status.extentSize и восстановлено описание blockDevice
