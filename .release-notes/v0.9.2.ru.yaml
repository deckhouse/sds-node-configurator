date: "2026-11-12"

summary: "Тонкие тома LVMLogicalVolume, которые одновременно создаются, расширяются, клонируются или восстанавливаются, больше не выводят thin-пул за его allocationLimit, LVMVolumeGroup, который не удаётся создать из-за оставшегося на узле /dev/<vg>, называет это причиной, а образы пересобраны на базовых образах v4.0.12 с Go 1.27.4."

highlights:
  - "Тонкие (thin) тома `LVMLogicalVolume`, запрошенные одновременно в одном thin-пуле (пуле тонкого выделения), больше не превышают его `allocationLimit`: агент обрабатывает их в одном thin-пуле по очереди и сверяет каждый с данными самого LVM."
  - "LVMVolumeGroup, который не удаётся создать из-за оставшегося на узле каталога `/dev/<vg>`, теперь получает причину `VGNameTakenOnNode` с сообщением, в котором названы узел и способ проверить и удалить каталог."

fixes:
  - "Если группу томов не удаётся создать, потому что на узле остался каталог `/dev/<vg>` от группы томов с таким именем, удалённой вручную, условие `VGConfigurationApplied` ресурса LVMVolumeGroup теперь имеет причину `VGNameTakenOnNode` и сообщение с названием узла и инструкцией, как проверить и удалить каталог, вместо сырой ошибки `vgcreate` под `VGCreationFailed`. Агент каталог не удаляет сам; после его удаления LVMVolumeGroup создаётся при следующем проходе (reconcile — цикл согласования ресурса)."
  - "Тонкие тома `LVMLogicalVolume`, которые одновременно создаются, расширяются, клонируются или восстанавливаются в одном thin-пуле, больше не превышают его `allocationLimit`. Агент сверял каждый запрос со `status.thinPools[].availableSpace`, а это поле обновляет только периодическое сканирование группы томов, поэтому все тома, запрошенные между двумя сканированиями, проходили проверку. Теперь агент обрабатывает такие запросы в одном thin-пуле по очереди и берёт уже выделенное в пуле место, размер пула и размер расширяемого тома из данных самого LVM; клон и восстановление учитываются по размеру источника, если он больше запрошенного, потому что LVM создаёт новый том размером с источник. Запрос, который не помещается, переходит в `Failed` с `not enough space`, выделенным и допустимым объёмом в причине и повторяется."

docs:
  - "В FAQ описано, почему LVMVolumeGroup не создаётся с ошибкой `/dev/<vg>: already exists in filesystem`: откуда берётся такой каталог, как проверить на узле, что в нём только битые ссылки, и что после его удаления агент сам создаст группу томов."

dependencies:
  - name: base images
    from: "v4.0.7"
    to: "v4.0.12"
    notes: "Все образы модуля пересобраны на актуальных базовых образах."
  - name: Go
    from: "1.27.3"
    to: "1.27.4"
    notes: "Тулчейн (набор инструментов сборки), которым собираются компоненты модуля на Go."
