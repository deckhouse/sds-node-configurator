date: "2026-10-01"

summary: "Агент удаляет ресурсы `BlockDevice`, остающиеся в состоянии `Missing` дольше настраиваемого срока, расширение планировщика в режиме HA больше не обещает одно и то же свободное место дважды, а неактивные тонкие тома снова активируются."

highlights:
  - "Новая настройка модуля `missingBlockDeviceRetentionHours` (по умолчанию 24): `BlockDevice`, устройство которого отсутствует так долго и который не использует ни один `LVMVolumeGroup`, удаляется, и на узлах с динамически подключаемыми LUN ресурсы `Missing` больше не копятся бесконечно."
  - "При двух репликах `sds-common-scheduler-extender` (режим HA (high availability, высокая доступность)) резервирования места обслуживает одна выбранная реплика, поэтому двум подам больше не может быть обещано одно и то же свободное место тонкого пула."
  - "Тонкий `LVMLogicalVolume`, деактивированный при активном тонком пуле, агент снова активирует."

new_features:
  - "Настройка модуля `missingBlockDeviceRetentionHours` (в часах, от 0 до 8760, по умолчанию 24). `BlockDevice`, который нельзя использовать, при пропаже устройства не удаляется: ему выставляется condition (условие) `Missing`, переходящий в `True` после 10 минут отсутствия устройства. Теперь агент удаляет такой ресурс своего узла, когда `Missing` остаётся `True` дольше этого срока, если ни один `LVMVolumeGroup` не перечисляет его в `status.nodes` и его `status.lvmVolumeGroupName` не указывает на существующий `LVMVolumeGroup`: физический том, пропавший из-под работающей группы томов, остаётся на виду. Если устройство вернётся, ресурс создаётся заново. `0` отключает удаление. Новая метрика `sds_node_configurator_block_devices_missing{node,reason}` считает оставшиеся ресурсы с `Missing=True`; каждое удаление агент пишет в лог."
  - "В DKP 1.78 и новее роли доступа модуля следуют схеме RBAC capability/scope (возможность/область действия): ClusterRole `d8:system-capability:sds-node-configurator:view` и `d8:system-capability:sds-node-configurator:edit` дают доступ только на чтение и полный доступ к `BlockDevice`, `LVMVolumeGroup`, `LVMVolumeGroupSet`, `LVMLogicalVolume` и `LVMLogicalVolumeSnapshot`. В версиях ниже 1.78 модуль сохраняет роли `d8:manage:permission:module:sds-node-configurator:view` и `:edit`."

fixes:
  - "В режиме HA каждая из двух реплик `sds-common-scheduler-extender` хранила свои резервирования места в памяти, поэтому запросам планирования, на которые отвечали разные реплики, могло быть обещано одно и то же свободное место с переподпиской тонкого пула. Теперь реплики выбирают лидера через Lease (аренду) `d8-sds-node-configurator/sds-common-scheduler-extender`; запросы фильтрации, оценки и резервирования обслуживает только лидер, вторая реплика пересылает их ему и отвечает `503`, пока лидер недоступен."
  - "Тонкий `LVMLogicalVolume`, деактивированный сам по себе (например, командой `lvchange -an`) при активном тонком пуле, больше никогда не активировался, и том оставался недоступен. Теперь агент выполняет `vgchange -ay` для его группы томов, как уже делал для толстых томов и тонких пулов. Логические тома с флагом пропуска активации, который модуль никогда не выставляет, по-прежнему остаются неактивными."

upgrade_notes:
  - "Удаление ресурсов `Missing` включено по умолчанию. Сразу после обновления агент удалит каждый `BlockDevice`, который уже больше 24 часов находится в `Missing=True` и не используется `LVMVolumeGroup`. Чтобы сохранить их, до обновления задайте `missingBlockDeviceRetentionHours` равным `0` или большему значению."
  - "В DKP 1.78 и новее ClusterRole `d8:manage:permission:module:sds-node-configurator:view` и `:edit` заменяются на `d8:system-capability:sds-node-configurator:view` и `:edit`. Привязки, которые ссылаются на старые имена ролей напрямую, нужно перевести на новые."

docs:
  - "Русскоязычный справочник `BlockDevice` теперь описывает `status.conditions` и его поля."

dependencies:
  - name: "LVM2 (`lvm`, `dmsetup` на узлах)"
    from: "снимок ветки main"
    to: "2.03.42"
    changelog_url: "https://gitlab.com/lvmteam/lvm2/-/tags/v2_03_42"
    notes: "Статические `lvm` и `dmsetup`, которые модуль ставит на узлы, теперь берутся из выпуска LVM2 2.03.42. Прежняя сборка закрепляла ревизию, но не переключалась на неё, поэтому на узлы попадал невыпущенный снимок ветки main LVM2."
