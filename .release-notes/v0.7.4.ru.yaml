date: "2026-09-11"

summary: "Метрики контроллера и scheduler extender теперь публикуются через kube-rbac-proxy, а LVMLogicalVolume с размером в процентах больше не отклоняется при создании и не остаётся в Failed после того, как достиг запрошенного размера."

highlights:
  - "Эндпоинты `/metrics` контроллера и scheduler extender больше недоступны без аутентификации: оба слушают на `127.0.0.1`, а публикует их kube-rbac-proxy, поэтому для сбора нужно право `get` на `deployments/prometheus-metrics`."
  - "`LVMLogicalVolume` с размером в процентах — `100%FREE` целой группы томов, как их выдаёт sds-elastic по одной на OSD, — больше не отклоняется при создании и не остаётся в `Failed` с `unable to extend LV, err: not enough space`."
  - "Скан LVM, дошедший до multipath-карты, у которой не осталось путей, больше не блокирует агент: узел продолжает сообщать о своих блочных устройствах, а его RWO-тома могут переехать на другой узел."

fixes:
  - "Размер `LVMLogicalVolume`, заданный процентом в `spec.size`, вычисляется от ёмкости, которую LVM сообщает как сумму устройств, а она не выровнена по extent'ам. Округление запроса вверх давало на один extent больше этой ёмкости, из-за чего запрос 100% группы томов считался в неё не влезающим: создание отклонялось, а extender переводил в `Failed` том, уже занимающий всё место. Теперь процентные размеры округляются вниз, к границе extent'а."
  - "`LVMLogicalVolume`, помеченный `Failed` из-за того, что свободное место группы ещё не догнало только что созданный LV, оставался в `Failed` до конца жизни: последующие проходы завершались раньше, увидев том уже нужного размера. Теперь такой том переходит в `Created`."
  - "Агент мог сообщить `block device size is invalid` для исправного устройства: переменная для результата ioctl лежала на стеке, и рост стека во время вызова перемещал её, поэтому размер записывался по старому адресу и оставался нулевым."
  - "Скан LVM, дошедший до multipath-карты без путей, блокировался в ядре вместо отказа, и каждый зависший скан держал карту открытой. Из-за этого агент останавливался, `multipath -f` не мог удалить карту, а том оставался в `Node.status.volumesInUse` и не подключался на другом узле. Теперь такие карты — device-mapper с UUID `mpath-` и без slaves — отбрасываются в `global_filter` каждой команды LVM."

improvements:
  - "Метрики scheduler extender собираются впервые: порт всегда был открыт менеджером, но никто его не объявлял и не опрашивал."
  - "`utils_commands_execution_count_total` и `utils_commands_errors_count_total` наконец экспортируются. Оба инкрементировались примерно в сорока местах агента и контроллера, но не были зарегистрированы, поэтому подсчитанное никуда не попадало."
  - "Все бинарники модуля пишут логи через один общий логгер. Имя компонента, выдавшего запись, теперь лежит в поле записи (`logger`), а не в виде префикса в тексте сообщения."

security:
  - "Закрыт анонимный доступ к метрикам контроллера и scheduler extender. Раньше эндпоинты никого не аутентифицировали, были доступны из любого пода кластера, а ServiceMonitor отправлял на них токен ServiceAccount'а Prometheus по обычному HTTP."
  - "`golang.org/x/crypto`, используемый хуками модуля, обновлён до 0.56.0 — это закрывает CVE-2026-56854 (критическая, обход аутентификации в `x/crypto/ssh`), CVE-2026-56855 и CVE-2026-78662."

upgrade_notes:
  - "Для метрик руками делать нечего: поставляемый с модулем ServiceMonitor уже опрашивает прокси по HTTPS с токеном. Перенастроить придётся только собственный сборщик, который читал метрики контроллера напрямую по HTTP: его нужно направить на порт прокси и выдать ему право `get` на `deployments/prometheus-metrics`."
  - "Формат записей лога изменился, поэтому фильтр, искавший имя компонента внутри текста сообщения, нужно перевести на поле `logger`."
