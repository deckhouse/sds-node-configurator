date: "2026-10-26"

summary: "Агент больше не предлагает путь multipath-карты как `BlockDevice`, обходит multipath-карты, у которых отказали все пути, и сообщает о них метриками и алертами, а его DaemonSet готов к строгому применению Pod Security Standards в DKP 1.79."

highlights:
  - "Путь multipath-карты никогда не становится `BlockDevice`, даже если udev не пометил его как `mpath_member`, поэтому `LVMVolumeGroup` больше нельзя построить поверх прямого пути к LUN, на котором уже лежат данные тома."
  - "Multipath-карта, у которой отказали все пути, теперь обрабатывается так же, как карта без путей: LVM-команды агента её не читают, как `BlockDevice` она не предлагается, а новые алерты `D8SdsNodeConfiguratorUnreadableMultipathMaps` и `D8SdsNodeConfiguratorLVMScanAbandoned` сообщают оператору, что такие карты есть, и объясняют, как их удалить."
  - "Модуль поставляет `SecurityPolicyException` (исключение из политики безопасности) для DaemonSet агента, поэтому его поды продолжат создаваться, когда DKP 1.79 начнёт отклонять поды, нарушающие Pod Security Standards в системных пространствах имён."

new_features:
  - "`SecurityPolicyException` `sds-node-configurator` в пространстве имён `d8-sds-node-configurator` описывает, что нужно агенту сверх профиля restricted: привилегированные контейнеры от root, сетевое пространство имён и пространство имён PID хоста, тип SELinux `spc_t`, тома hostPath и hostPort (порт на узле) для метрик. Поды агента получают метку `security.deckhouse.io/security-policy-exception: sds-node-configurator`. И исключение, и метка создаются, только если в кластере есть CRD модуля `admission-policy-engine`. Все три контейнера агента теперь отбрасывают все capabilities (привилегии ядра Linux), как требует профиль restricted; привилегированные контейнеры сохраняют свои права, потому что для них среда выполнения контейнеров этот список игнорирует."
  - "У модуля появились первые правила Prometheus. `D8SdsNodeConfiguratorUnreadableMultipathMaps` срабатывает, когда на узле 10 минут держится multipath-карта без рабочего пути; `D8SdsNodeConfiguratorLVMScanAbandoned` — когда запуск `pvs`, `vgs` или `lvs`, оставленный агентом по истечении срока, работает уже 5 минут. Тексты алертов объясняют последствия, например CSI-том, который нельзя отключить от узла, и порядок удаления карт."

improvements:
  - "Новые метрики агента: `sds_node_configurator_unreadable_multipath_maps{node}` считает multipath-карты, которые агент не пускает в LVM, `sds_node_configurator_lvm_scans_abandoned_total{node,command}` считает сканирования LVM, оставленные работать по истечении срока, а `sds_node_configurator_lvm_scans_outstanding{node,command}` равна `1`, пока такое сканирование ещё есть на узле. Агент перечисляет нечитаемые карты в логе на уровне `Info` под теми именами, которые показывает `multipath -ll`: когда впервые их видит и при каждом изменении набора."

fixes:
  - "Путь multipath-карты (устройство из `/sys/block/dm-N/slaves` карты, у которой `dm/uuid` начинается с `mpath-`) мог быть опубликован как доступный для использования `BlockDevice`. udev помечает путь как `mpath_member`, только если multipath забрал его в момент появления, а при `find_multipaths yes` он не забирает путь, появившийся до регистрации WWID LUN, — именно в таком порядке CSI-драйвер подключает том. Теперь агент читает пути каждой multipath-карты из sysfs и никогда не создаёт для них `BlockDevice`."
  - "Multipath-карта, у которой пути ещё перечислены, но все в состоянии failed, а `queue_if_no_path` включён, блокировала любое чтение так же, как карта без путей, но фильтр агента ловил только последнюю: `lvs` часами висел на такой карте, держа открытыми соседние карты, `multipath -f` завершался ошибкой `map in use`, а том ReadWriteOnce не мог переехать на другой узел. Теперь агент читает статус multipath-цели через встроенный `dmsetup`, который не выполняет ввод-вывод в карты, исключает карту без активного пути в `global_filter` LVM и убирает её из кандидатов в `BlockDevice`. Набор таких карт пересобирается непосредственно перед каждым проходом сканирования, поэтому карта, только что потерявшая последний путь, больше не открывается ещё один раз."
  - "Сканирование LVM (`pvs`, `vgs`, `lvs`), не уложившееся в срок, убивалось, и сканирование, заблокированное на нечитаемом устройстве, превращалось в процесс в состоянии D, который снимает только перезагрузка, а устройство оставалось открытым. Теперь такое сканирование остаётся работать и завершается само, как только с устройством разберутся; пока оно живо, агент не запускает другое сканирование того же вида."
  - "Init-контейнер `sds-utils-installer` агента записывал в лог неудачное копирование утилит на узел и завершался успешно, поэтому агент запускался с утилитами предыдущего выпуска. Теперь он завершается ошибкой, и под не стартует, пока копирование не пройдёт."

security:
  - "Обновлены Go-зависимости агента, контроллера, расширения планировщика, вебхуков и хуков модуля: закрыты CVE-2026-78669, CVE-2026-78659, CVE-2026-78660, CVE-2026-78663 и CVE-2026-97032 в `golang.org/x/net`, CVE-2026-56851 в `golang.org/x/text` и CVE-2026-63209 в `github.com/klauspost/compress`. `github.com/docker/distribution`, для которого нет выпуска с исправлением CVE-2026-85747, больше не входит в хуки модуля."

upgrade_notes:
  - "Руками делать ничего не нужно. Шаблон пода агента меняется во всех кластерах, поэтому DaemonSet агента один раз перезапускает свои поды."
  - "`BlockDevice`, уже созданный на пути multipath-карты, обрабатывается как ресурс, устройство которого ушло с узла: доступный для использования удаляется, а недоступный получает condition (условие) `Missing` и удаляется по истечении `missingBlockDeviceRetentionHours`, если его не использует ни один `LVMVolumeGroup`."

docs:
  - "FAQ: почему multipath-карты без рабочего пути и пути multipath-карт никогда не становятся ресурсами `BlockDevice`, какие метрики о них сообщают и как удалить такие карты командами `dmsetup message <карта> 0 fail_if_no_path` и `multipath -f <карта>`."
  - "Раздел о добавлении ёмкости на узле, который использует `LocalStorageClass`: класс принимает только один `LVMVolumeGroup` на узел, поэтому ёмкость добавляется расширением существующей группы томов через её `spec.blockDeviceSelector`, а не созданием второго `LVMVolumeGroup`."
