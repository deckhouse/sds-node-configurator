date: "2026-09-24"

summary: "Файлы модуля на узле переезжают из `/opt/deckhouse/sds` в `/var/lib/deckhouse/sds`, агент перестаёт читать LVM с дисков виртуальных машин, а тонким снимкам больше не нужен модуль ядра `dm_snapshot`."

highlights:
  - "Дерево модуля на узле переезжает в `/var/lib/deckhouse/sds`, куда можно писать и на узлах, где `/opt` доступен только для чтения, а значение `fileDevicesDirectory` по умолчанию становится `/var/lib/deckhouse/sds/file-devices`. Существующие записи `spec.fileDevices` в старом каталоге продолжают работать там же."
  - "На узле с виртуальными машинами группы томов, которые вложенный кластер создаёт на своих дисках, больше не превращаются в ресурсы `LVMVolumeGroup` и `BlockDevice` кластера-хозяина."
  - "`LVMLogicalVolumeSnapshot`, восстановление из VolumeSnapshot и клоны тонких томов работают на узлах без модуля ядра `dm_snapshot`."

improvements:
  - "Новые метрики: `sds_node_configurator_published_block_devices` и `sds_node_configurator_published_devices_directory_present` показывают, сколько устройств на узле агент не пускает в LVM и нашёл ли он там каталог kubelet с опубликованными блочными томами, а `sds_node_configurator_legacy_file_devices_directory_lvgs` считает ресурсы `LVMVolumeGroup`, у которых `spec.fileDevices` всё ещё указывает на `/opt/deckhouse/sds/file-devices`; их имена выводятся в лог модуля."

fixes:
  - "На узле с виртуальными машинами (DVP) агент читал LVM внутри дисков ВМ: группы томов гостевого кластера появлялись как ресурсы `LVMVolumeGroup`, а его диски — как ресурсы `BlockDevice` кластера-хозяина. Теперь команды `lvm` агента отвергают каждое устройство, которое kubelet опубликовал в под как блочный том, вместе с его разделами и всем, что построено поверх, для любого CSI-драйвера. Ресурсы, созданные так до обновления, выходят из `Ready`, и их можно удалить; группа томов внутри ВМ при этом не затрагивается."
  - "Группа томов с тегом `storage.deckhouse.io/lvmVolumeGroupName=<name>`, указывающим на `LVMVolumeGroup`, которого в этом кластере нет, импортировалась как новый ресурс, хотя такой тег пишет только модуль в другом кластере (например, внутри виртуальной машины). Теперь она не импортируется: агент один раз пишет отказ в лог и учитывает его в `sds_node_configurator_lvm_volume_group_import_refused_total`. Группа томов, переданная модулю тегом `storage.deckhouse.io/enabled=true` без тега с именем, импортируется как прежде, как и группа на файлах-подложках."
  - "Создание `LVMLogicalVolumeSnapshot`, восстановление из VolumeSnapshot и клонирование тонкого `LVMLogicalVolume` падали на узлах без загруженного модуля ядра `dm_snapshot` с ошибкой `snapshot: Required device-mapper target(s) not detected in your kernel`. Теперь тонкие снимки создаются без этого модуля. Агент по-прежнему загружает `dm_snapshot` на каждом узле с тонким выделением, а узел, где его нет, больше не мешает агенту запуститься."
  - "Встроенный `lvm` не мог сам загрузить недостающий модуль ядра device-mapper и вместо этого сообщал, что цель не найдена. Теперь он вызывает `/sbin/modprobe` узла."

breaking:
  - "Модуль больше не устанавливает `lvm` и `dmsetup` в `/opt/deckhouse/sds/bin` и удаляет старые копии с узлов. Скрипты вне модуля, которые запускали их оттуда, должны перейти на `/var/lib/deckhouse/sds/bin/`."

upgrade_notes:
  - "Руками делать ничего не нужно. После перезапуска пода агента на узле следующий прогон bashible удаляет файлы, которые модуль раньше устанавливал в `/opt/deckhouse/sds`; файлы других модулей и файлы-подложки там остаются на месте. Скрипты, которые запускали `/opt/deckhouse/sds/bin/lvm` или `dmsetup`, должны перейти на `/var/lib/deckhouse/sds/bin/`."
  - "Поле `spec.fileDevices[].directory` неизменяемое, поэтому записи, созданные со старым значением по умолчанию `/opt/deckhouse/sds/file-devices`, продолжают на него указывать, и агент продолжает его принимать. Не переносите их файлы-подложки руками: как перевести запись в новый каталог без остановки, описано в FAQ. Новые записи создавайте в новом каталоге по умолчанию. Значение `fileDevicesDirectory`, явно заданное в настройках модуля, остаётся как есть."

docs:
  - "FAQ: раздел о файлах-подложках, созданных до переноса базового каталога, с порядком перевода записи в новый каталог через `pvmove`."
