date: "2026-09-14"

summary: "Scheduler extender теперь работает на узлах control plane — рядом с kube-scheduler, который к нему обращается."

highlights:
  - "Под `sds-common-scheduler-extender` размещается на узлах control plane, а не на системных, и терпит их taint (метку-ограничение, запрещающую планирование обычных подов)."

fixes:
  - "Deployment `sds-common-scheduler-extender` запрашивал системные узлы и нёс tolerations стратегии `system`, которая не терпит ни taint узлов control plane, ни пользовательские, поэтому под не мог быть размещён на узле control plane. Теперь он выбирает master-узлы — с откатом на системные в кластерах, где роль master не объявлена, — и терпит любой узел, что ставит его рядом с kube-scheduler, который вызывает его при каждой попытке планирования в модулях, зарегистрировавших расширение."
