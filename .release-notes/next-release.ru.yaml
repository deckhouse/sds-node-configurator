# Заготовка для следующего релиза. Перед тегом переименовать в vX.Y.Z.ru.yaml
# (имя файла должно совпадать с тегом) и заполнить.
date: "2026-xx-xx"
summary: ""
highlights: []

fixes:
  - "Если группу томов не удаётся создать, потому что на узле остался каталог `/dev/<vg>` от группы томов с таким именем, удалённой вручную, условие `VGConfigurationApplied` ресурса LVMVolumeGroup теперь имеет причину `VGNameTakenOnNode` и сообщение с названием узла и инструкцией, как проверить и удалить каталог, вместо сырой ошибки `vgcreate` под `VGCreationFailed`. Агент каталог не удаляет сам; после его удаления LVMVolumeGroup создаётся при следующем проходе (reconcile — цикл согласования ресурса)."
  - "Тонкие (thin) тома `LVMLogicalVolume`, которые одновременно создаются, расширяются, клонируются или восстанавливаются в одном thin-пуле (пуле тонкого выделения), больше не превышают его `allocationLimit`. Агент сверял каждый запрос со `status.thinPools[].availableSpace`, а это поле обновляет только периодическое сканирование группы томов, поэтому все тома, запрошенные между двумя сканированиями, проходили проверку. Теперь агент обрабатывает такие запросы в одном thin-пуле по очереди и считает уже выделенное в пуле место по данным самого LVM; запрос, который не помещается, переходит в `Failed` с `not enough space`, выделенным и допустимым объёмом в причине и повторяется."

