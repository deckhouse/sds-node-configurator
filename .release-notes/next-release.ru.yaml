fixes:
  - "Удаление LVMVolumeGroup больше не зависает в `Terminating` на собственном thin-пуле. Раньше агент не удалял группу томов, пока в ней был хоть один логический том, включая thin-пулы из `spec.thinPools`, и удаление завершалось только после `lvremove` пула на узле. Теперь агент удаляет пустые thin-пулы LVMVolumeGroup (перечисленные в `spec.thinPools` или созданные для неё), а затем группу томов. Thin-пул удаляется, только если в нём нет ни одного thin-тома, — это проверяет LVM в той же команде. Thin-пул с томами, а также thin-пулы и логические тома, созданные не этой LVMVolumeGroup, не трогаются: условие `VGConfigurationApplied` перечисляет их, на LVMVolumeGroup записывается Warning-событие `VGHasLogicalVolumes`, и удаление продолжается само, как только они удалены."
  - "Гипервизор больше не активирует группы томов вложенного кластера, в котором тоже работает sds-node-configurator. Такой гость ставит на свои группы томов тег `storage.deckhouse.io/enabled=true`, как и гипервизор, а `auto_activation_volume_list` узла (с v0.10.0) и агент смотрели только на этот тег: thin-пулы и логические тома гостя поднимались на гипервизоре поверх дисков работающих виртуальных машин, а после удаления или переезда виртуальной машины держали её multipath-карту, у которой не осталось путей, и срабатывал алерт `D8SdsNodeConfiguratorUnreadableMultipathMaps`. Теперь агент активирует только группы томов, названные в ресурсе LVMVolumeGroup его узла (по `spec.actualVGNameOnTheNode` и, когда он известен, `status.vgUUID`), и никогда — группу томов с тегом другого кластера. В списке в `lvm.conf` теперь `@storage.deckhouse.io/cluster=<UUID кластера>` вместо `@storage.deckhouse.io/enabled=true`, и агент ставит этот тег на группу томов каждого ресурса LVMVolumeGroup своего узла."
  - "Описание алерта `D8SdsNodeConfiguratorUnreadableMultipathMaps` теперь начинает разбор с держателей карты (`/sys/block/dm-N/holders`) и объясняет, как снять удерживающие её логические тома вложенного кластера."
  - "При запуске агент заменяет старый тег `linstor-` на `storage.deckhouse.io/enabled=true` только на группах томов, которые названы в ресурсе LVMVolumeGroup его узла (а пока API-сервер недоступен — на группах с тегом этого кластера), и на их логических томах. Раньше он переписывал тег на любой видимой группе томов, в том числе на группе вложенного кластера на диске виртуальной машины, и после этого такая группа выглядела как группа модуля."

upgrade_notes:
  - "После обновления агент больше не активирует группу томов, которую не называет ни один ресурс LVMVolumeGroup его узла, даже если на ней стоит `storage.deckhouse.io/enabled=true`. Группа томов, переданная модулю этим тегом, активируется, когда модуль создаст для неё LVMVolumeGroup, как и раньше. Группа томов, импорт которой модуль отклонил (агент пишет в лог `not importing VG`), теперь тоже остаётся неактивной после перезагрузки; создайте для неё LVMVolumeGroup, как описано в разделе FAQ «Почему группа томов с тегами модуля не импортируется, и как взять её под управление?», или активируйте её вручную."
  - "NodeGroupConfiguration `sds-node-configurator-host-lvm-autoactivation.sh` при следующем применении bashible заменяет в `auto_activation_volume_list` файла `/etc/lvm/lvm.conf` запись `@storage.deckhouse.io/enabled=true` на `@storage.deckhouse.io/cluster=<UUID кластера>`, а агент ставит этот тег на группы томов ресурсов LVMVolumeGroup своего узла при следующей обработке. Пока на группе томов нет тега, узел не активирует её автоматически, а после перезагрузки её активирует агент при запуске. Перед перезагрузкой узла проверьте теги командой `vgs -o vg_name,vg_tags`. Группу томов с тегом другого кластера (кластер установлен заново на сохранённые диски) агент не активирует и не перетегирует; снимите старый тег командой `vgchange --deltag`, см. раздел FAQ «Какие группы томов узел активирует сам?»."
  - "Логические тома вложенных кластеров, активированные на гипервизоре до обновления, остаются активными, пока их не снимут или узел не перезагрузится. Снимите их, как описано в алерте `D8SdsNodeConfiguratorUnreadableMultipathMaps`."
