date: "2026-xx-xx"
summary: "LVMVolumeGroup теперь может поручить агенту вывод пустого Physical Volume устройства, убранного из селектора, устаревший дубль BlockDevice устройства, сменившего идентичность, удаляется агентом, а `kubectl get bd` показывает условие Missing. LVM самого узла больше не активирует автоматически группы томов вложенных кластеров."
highlights:
  - "Новое поле `spec.releaseEmptyBlockDevices` ресурса LVMVolumeGroup позволяет агенту вывести из группы томов пустой Physical Volume устройства, вышедшего из `blockDeviceSelector`."
  - "BlockDevice с `Missing`, устройство которого живёт под другим BlockDevice, удаляется через `missingBlockDeviceRetentionHours`, а не хранится, пока существует его LVMVolumeGroup."
  - "В `kubectl get bd` появилась колонка `Missing`."
  - "LVM узла теперь автоматически активирует только группы томов, с которых загружается узел, и группы с тегом модуля, поэтому группы томов вложенных кластеров на LUN и других блочных устройствах узла больше не активируются на узле."

new_features:
  - "Новое поле `spec.releaseEmptyBlockDevices` ресурса LVMVolumeGroup (и `spec.lvmVolumeGroupTemplate` ресурса LVMVolumeGroupSet) позволяет агенту вывести блочное устройство из группы томов командами `vgreduce` и `pvremove` после того, как оно перестало подходить под `blockDeviceSelector`. По умолчанию выключено. Агент действует, только если ресурс BlockDevice существует и у него нет условия `Missing`, ни один другой BlockDevice на узле не несёт тот же Physical Volume, Physical Volume найден по UUID и пуст (`pv_used` читается из LVM непосредственно перед `vgreduce`), группа томов несёт тег этого LVMVolumeGroup, не является общей, не принадлежит другому узлу и сохраняет хотя бы один другой Physical Volume, не выполняется `pvmove`, ни один thin pool с размером в процентах не окажется больше своей доли уменьшенной группы томов, и всё это подтверждено на двух проходах reconcile с промежутком не меньше минуты. Physical Volume с данными не затрагивается. Файловые устройства поле не затрагивает."

improvements:
  - "Пока устройство, вышедшее из `blockDeviceSelector`, остаётся в группе томов, условие `VGConfigurationApplied` (причина `ValidationFailed`) называет устройство и то, что мешает: объём данных на его Physical Volume и `pvmove`, который нужно выполнить, либо поле `spec.releaseEmptyBlockDevices`, если Physical Volume пуст."
  - "В `kubectl get bd` появилась колонка `Missing`: `Unknown`, пока устройства нет меньше 10 минут, `True` после этого, пусто у присутствующего устройства. Устаревший дубль BlockDevice теперь легко заметить."

fixes:
  - "BlockDevice неконсумабельного устройства, переиспользованный под старым именем после смены имени устройства, больше не получает `Missing` и не теряет его заново при каждом проходе обнаружения."
  - "`Missing` BlockDevice, который называет существующий LVMVolumeGroup в `status.lvmVolumeGroupName`, теперь удаляется через `missingBlockDeviceRetentionHours`, если то же устройство (тот же UUID Physical Volume, UUID раздела либо WWN с серийным номером) есть на узле под другим BlockDevice, а ни один LVMVolumeGroup не перечисляет устаревший в `status.nodes`. Раньше такой дубль оставался навсегда. `Missing` BlockDevice без живого двойника остаётся, как и раньше."
  - "На узлах с установленным lvm2 дистрибутива старше 2.03.12 (например, Ubuntu 22.04 с lvm2 2.03.11) в v0.9.1–v0.9.3 все LVMVolumeGroup узла были в `NotReady` с причиной `CacheEmpty`: lvm модуля передавал каждую команду системному `/usr/sbin/lvm` узла, который не знает опцию `--devicesfile`. Агент снова всегда выполняет lvm, который ставит модуль (2.03.42), как до v0.7.0, какой бы lvm2 ни стоял на узле."
  - "Автоматическое расширение тонкого `LVMLogicalVolume` с размером в процентах и создание `LVMLogicalVolumeSnapshot` больше не выводят thin pool за `allocationLimit`, если выполняются одновременно с другими запросами к этому пулу. В v0.9.2 это было исправлено только для создания, расширения и клонирования ресурсов `LVMLogicalVolume`; эти два пути по-прежнему сверялись с `status.thinPools[].availableSpace`, который обновляет только периодическое сканирование группы томов. Теперь они дожидаются других запросов к тому же thin pool и сверяют место с тем, что сообщает LVM. Расширение, которое не помещается, получает фазу `Failed` с `not enough space` и повторяется; снапшот, который не помещается, остаётся в `Pending` с выделенным и допустимым объёмом в причине и повторяется."
  - "В DKP ниже 1.78 наблюдатель и менеджер подсистемы storage теперь читают `BlockDeviceFilter`, как в DKP 1.78 и новее."

breaking:
  - "Модуль теперь задаёт `activation/auto_activation_volume_list` в `/etc/lvm/lvm.conf` каждого узла, где установлен lvm2 дистрибутива. В списке группы томов, с которых загружается узел (под смонтированными файловыми системами, swap, `/etc/fstab` и параметрами ядра `root=`, `resume=`, `rd.lvm.vg=` и `rd.lvm.lv=`), и `@storage.deckhouse.io/enabled=true`. Любая другая группа томов, в том числе созданная на узле вручную, больше не активируется при загрузке и при появлении её устройств; `vgchange -ay` по-прежнему её активирует. Раньше узел автоматически активировал все группы томов, которые видел, включая группы вложенных кластеров на LUN и других блочных устройствах узла."

security:
  - "`ClusterEditor` и менеджер подсистемы storage в ролевой модели RBACv2 больше не создают, не изменяют и не удаляют `BlockDevice`, `LVMLogicalVolume` и `LVMLogicalVolumeSnapshot`. Их создают и ведут агент, контроллер и CSI-драйверы, а документация `BlockDevice` запрещает менять его вручную. `LVMLogicalVolume` и `LVMLogicalVolumeSnapshot` теперь изменяют уровни от `ClusterAdmin` (в DKP 1.78 и новее — также суперадминистратор подсистемы storage через новую capability `d8:system-capability:sds-node-configurator:superadmin`): это нужно для процедуры из FAQ после удаления узла; `BlockDevice` изменяет только `SuperAdmin`. Читать их по-прежнему могут все уровни. `BlockDeviceFilter` тоже изменяют уровни от `ClusterAdmin` (в DKP 1.78 и новее — также через ту же capability), а не от `ClusterEditor` и менеджера подсистемы storage: если изменить или удалить фильтр CSI-драйвера, LUN его томов могут стать ресурсами `BlockDevice`, которые может занять `LVMVolumeGroup`. Читать его по-прежнему могут все уровни."

upgrade_notes:
  - "Перед перезагрузкой узла после обновления проверьте группы томов, созданные на нём в обход модуля: `lvmconfig activation/auto_activation_volume_list` показывает, что узел будет активировать автоматически. Добавьте недостающую группу томов в `auto_activation_volume_list` в `/etc/lvm/lvm.conf` (модуль сохраняет найденные там записи) или, если ею должен управлять модуль, поставьте на неё тег `storage.deckhouse.io/enabled=true`. Иначе после перезагрузки её логические тома останутся неактивными, а файловая система на них в `/etc/fstab` без `nofail` остановит загрузку. Список, уже заданный администратором, дополняется, а не заменяется. См. раздел FAQ «Какие группы томов узел активирует сам?»."
  - "Меняется доступ `user-authz` к модулю: `ClusterEditor` больше не пишет `BlockDevice`, `LVMLogicalVolume` и `LVMLogicalVolumeSnapshot`, но по-прежнему их читает; `ClusterAdmin` по-прежнему пишет `LVMLogicalVolume` и `LVMLogicalVolumeSnapshot`, но больше не пишет `BlockDevice`. `ClusterEditor` больше не создаёт, не изменяет и не удаляет `BlockDeviceFilter`, но по-прежнему его читает; это делает `ClusterAdmin`. В ролевой модели RBACv2 менеджер подсистемы storage теряет те же права, а в DKP 1.78 и новее суперадминистратор подсистемы storage получает `LVMLogicalVolume`, `LVMLogicalVolumeSnapshot` и `BlockDeviceFilter`. Уровни `LVMVolumeGroup` и `LVMVolumeGroupSet` не меняются. Удаление логического тома или снятие его финализатора после удаления узла теперь требует `ClusterAdmin`, как сказано в FAQ."
