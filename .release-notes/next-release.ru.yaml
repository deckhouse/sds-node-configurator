  - "В FAQ описано, как сделать, чтобы хранилище на новом узле поднималось само: записать метку в `/var/lib/node_labels` на узле до его добавления в кластер и выбрать её в `dataNodes.nodeSelector` модуля и в LVMVolumeGroupSet."
  - "В FAQ описано, как работает `allocationLimit` у thin pool: как считается `status.thinPools[].availableSpace`, что отклоняется при достижении предела и что происходит при изменении предела. Описания `allocationLimit` и `availableSpace` в LVMVolumeGroup и LVMVolumeGroupSet теперь говорят о том же."
  - "В разделе FAQ о смене UUID групп томов при клонировании виртуальных машин теперь сказано, что клон узла, группа томов которого создана модулем, несёт и тег `storage.deckhouse.io/lvmVolumeGroupName`, поэтому агент на клоне не импортирует группу томов, и что после `vgchange -u` этот тег нужно снять командой `vgchange --deltag`."
  - "В FAQ описано, что происходит с ресурсами LVMVolumeGroup, LVMLogicalVolume, LVMLogicalVolumeSnapshot и BlockDevice узла, удалённого из кластера, и как их убрать."
  - "В FAQ описано, как CSI-драйверы скрывают свои LUN от модуля ресурсами BlockDeviceFilter: правила по WWN, по модели и по цели, как строится значение лейбла `scsitarget` и какие у этого ограничения."
  - "Требования к устройству для создания ресурса BlockDevice больше не противоречат описанию создания раздела на блочном устройстве: у устройства с разделами или другими устройствами поверх него собственного BlockDevice нет (если это не физический том LVM), каждый его раздел получает BlockDevice, если соответствует требованиям, разделу с PARTUUID серийный номер не нужен, а таблица разделов без разделов оставляет диск не consumable с причиной `HasPartitionTable`."
  - "В требованиях к устройству для создания ресурса BlockDevice объяснено, почему диск, на котором установлена ОС, и его разделы при обычной разметке, в том числе с корнем на LVM, ресурсов BlockDevice не получают, а в FAQ — как отдать модулю свободное место на этом диске: новым разделом, передачей группы томов с корнем под управление тегом `storage.deckhouse.io/enabled=true` или файловыми устройствами."

