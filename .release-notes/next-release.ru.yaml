# Заготовка для следующего релиза. Перед тегом переименовать в vX.Y.Z.ru.yaml
# (имя файла должно совпадать с тегом) и заполнить.
date: "2026-xx-xx"
summary: ""
highlights: []

new_features:
  - "Контроллер снимает финализатор агента с ресурсов LVMVolumeGroup, LVMLogicalVolume и LVMLogicalVolumeSnapshot узла, удалённого из кластера, поэтому их удаление больше не зависает в `Terminating`, пока финализатор не снимут вручную. Он делает это, когда узел отсутствует дольше `missingNodeGracePeriodMinutes` (по умолчанию 10 минут, `0` отключает снятие) и финализатор агента остался единственным; LVMVolumeGroup, кроме того, ждёт, пока на нём не останется томов и снимков. Узел в состоянии `NotReady` или без работающего агента удалённым не считается. LVMVolumeGroup, удаление которого не запрошено, автоматически не удаляется, данные на дисках узла не затрагиваются. О каждом снятии создаётся событие `AgentFinalizerReleased`, а момент, когда узел впервые не был найден, записывается в аннотацию `storage.deckhouse.io/node-missing-since` его ресурсов LVMVolumeGroup."
  - "Новые алерты: `D8SdsNodeConfiguratorLVMVolumeGroupNodeMissing` срабатывает, когда узел LVMVolumeGroup отсутствует в кластере дольше 6 часов, а `D8SdsNodeConfiguratorResourcesOfMissingNodeStuck` — когда ресурсы удалённого узла остаются в `Terminating` после окончания периода ожидания; он называет причину, по которой финализатор не снят."
  - "LVMVolumeGroup, LVMVolumeGroupSet, LVMLogicalVolume и LVMLogicalVolumeSnapshot теперь создают событие Kubernetes (Event), когда меняется их состояние: `Warning` — когда ресурс ломается, `Normal` — когда он снова готов. Причина события совпадает с причиной условия, например `InvalidConditionStates` или `ReconcileFailed`, поэтому в `kubectl describe` видно, когда ресурс сломался и когда восстановился. Для LVMVolumeGroup агент также записывает изменения условий `VGConfigurationApplied` и `VGReady`, поэтому спецификация, которую агент отклонил, видна как `Warning` с причиной `ValidationFailed`, даже если сама группа остаётся `Ready`. Ресурс, который только создаётся, меняет размер или удаляется, не создаёт `Warning`, а проход согласования, который ничего не изменил, не создаёт событий. Ресурсы кластерные, поэтому их события лежат в пространстве имён `default`, и контроллеру выдано право создавать их там."

improvements:
  - "LVMVolumeGroupSet отслеживает изменения своих ресурсов LVMVolumeGroup: удалённый ресурс набора сразу создаётся заново, а изменённые вручную `thinPools`, `blockDeviceSelector` или `fileDevices` возвращаются к шаблону. Раньше это происходило только после изменения spec набора или перезапуска контроллера. Поле статуса `currentLVMVolumeGroupsCount` больше не учитывает удалённые ресурсы, а новое поле `readyLVMVolumeGroupsCount` (колонка `Ready LVG Count`) показывает, сколько ресурсов набора находится в фазе `Ready`."
  - "Thin pool, удалённый из `spec.thinPools` LVMVolumeGroup, теперь удаляется с узла, когда в нём не остаётся тонких томов. Раньше агент игнорировал удаление и thin pool оставался. Пока в thin pool есть тома, агент оставляет его и перечисляет их в условии `VGConfigurationApplied` с причиной `ThinPoolHasVolumes`; LVMVolumeGroup остаётся `Ready`. Удаляются только thin pool, которые были указаны в spec: теперь агент помечает их тегом `storage.deckhouse.io/lvmVolumeGroupName`."
  - "Симуляции планирования в kube-scheduler Deckhouse (запросы filter и prioritize с `dryRun: true`) больше не резервируют место в пулах LVM и не меняют резерв места симулируемого пода, поэтому descheduler проверяет целевые узлы, не отнимая свободное место у других подов. `sds-common-scheduler-extender` оценивает узлы в симуляции так же, как при обычном планировании, в том числе для пода с несколькими непривязанными PVC в одном пуле и для LVM-группы, которая входит и в локальный StorageClass, и в ReplicatedStoragePool. Запросы симуляций пишутся в лог на уровне Debug на всех репликах extender, и `/stat` показывает, сколько запросов filter и prioritize были симуляциями."
  - "Имена групп томов и логических томов теперь проверяются по правилам LVM при создании ресурса, а не падают позже в `vgcreate` или `lvcreate` на узле, оставляя ресурс в `Failed`. `actualVGNameOnTheNode` у LVMVolumeGroup и в шаблоне LVMVolumeGroupSet, `spec.thinPools[].name`, `actualLVNameOnTheNode` у LVMLogicalVolume и `actualSnapshotNameOnTheNode` у LVMLogicalVolumeSnapshot ограничены 127 символами из `a-z`, `A-Z`, `0-9`, `+`, `_`, `.` и `-`, не могут начинаться с дефиса или совпадать с `.` и `..`, а имена логических томов не могут начинаться с `snapshot` или `pvmove` и содержать суффиксы, которые LVM резервирует для своих служебных томов, например `_tdata` или `_tmeta`. LVMLogicalVolumeSnapshot без `actualSnapshotNameOnTheNode` отклоняется, если его собственное имя, которое тогда использует агент, начинается с `snapshot` или `pvmove` или длиннее 127 символов. В `spec.thinPools` может быть не больше 256 thin pool."
  - "Ресурсы BlockDevice для LUN iSCSI и Fibre Channel получают лейбл `status.blockdevice.storage.deckhouse.io/scsitarget` с целью, которой принадлежит LUN: именем цели iSCSI или WWPN порта цели Fibre Channel, прочитанными из sysfs; разделы и multipath-карты берут его у дисков под ними. CSI-драйвер может скрыть ресурсом BlockDeviceFilter по этому лейблу все LUN своих целей, в том числе LUN, который только что появился на узле и ещё не обнаружен драйвером. LUN, цель которого не удаётся прочитать, не получает BlockDevice, пока она не прочитается."
  - "Поддержка thin pool больше не зависит от настройки модуля: агент загружает модуль ядра `dm_thin_pool` на каждом узле, где он работает. Если в ядре узла нет `dm_thin_pool`, агент всё равно запускается: init-контейнер `thin-volumes-enabler` пишет в лог `dm_thin_pool is not available, thin pools cannot be created on this node`. Thin pool, запрошенный на таком узле, отражается в условии `VGConfigurationApplied` ресурса LVMVolumeGroup с причиной `ThinPoolCreationFailed` или `ThinPoolReconcileFailed`. Раньше init-контейнер в этом случае завершался с ошибкой и под агента на узле не запускался."

fixes:
  - "Агент мог упасть или работать с наполовину обновлённой картиной узла: кеш блочных устройств, PV и VG записывал сканер и читали контроллеры без блокировки, а вывод кеша после каждого сканирования обходил список логических томов, пока контроллер добавлял или удалял том, — на этом рантайм Go останавливает процесс с фатальной ошибкой. Удаление логического тома, который сканирование уже убрало из кеша, вызывало панику агента. Теперь каждое обращение к кешу берёт блокировку, удалённый том, которого уже нет в кеше, пропускается, а контроллер получает копию записи о томе."
  - "LVMVolumeGroupSet не создавал LVMVolumeGroup для узла, который вошёл в кластер или получил метку из его `nodeSelector` после создания набора: контроллер смотрел на узлы, только когда менялся сам набор или одна из его LVMVolumeGroup. Теперь он реагирует на добавление, удаление и смену меток узлов."
  - "LVMVolumeGroup с несколькими thin pool переходил в `NotReady`, если один thin pool не удавалось создать или расширить, и планировщик переставал размещать тома и на остальных thin pool. Теперь LVMVolumeGroup остаётся `Ready` с `VGConfigurationApplied=False` и причиной `ThinPoolCreationFailed` или `ThinPoolReconcileFailed`; упавший thin pool не используется, остальные продолжают принимать тома. Ошибка одного thin pool при создании группы томов больше не останавливает создание следующих."
  - "LVMVolumeGroup, создание которого упало после `pvcreate`, нельзя было создать снова: оставшийся на устройстве физический том делал BlockDevice не consumable, и проверка отказывала с тех пор каждый раз. Теперь физический том, который не входит ни в одну группу томов, consumable с причиной `OrphanPhysicalVolume`, и группа томов берёт его как есть."
  - "Агент удалял группу томов у удаляемого LVMVolumeGroup, даже если ресурс ещё удерживал своим финализатором другой контроллер. Теперь агент ждёт снятия чужих финализаторов и перечисляет их в условии `VGConfigurationApplied`."
  - "Агент не создавал thin pool из `spec.thinPools`, если в другой группе томов на том же узле был thin pool с таким же именем."
  - "Ресурсы BlockDevice узла, удалённого из кластера, или узла, с которого сняли метки, по которым размещается агент, не удалялись никогда: BlockDevice удаляет только агент своего узла, а там его не осталось. Теперь контроллер выставляет им condition `Missing` с причиной `NodeNotFound` или `AgentNotRunning` — сначала `Unknown`, через 10 минут `True` — и удаляет их через `missingBlockDeviceRetentionHours` (по умолчанию 24 часа), если на них не ссылается ни один LVMVolumeGroup."
  - "`sds-common-scheduler-extender` проверял место в пуле для каждого PVC пода отдельно, локального или реплицируемого. Узел проходил фильтр, если в пуле помещался каждый PVC по отдельности, но не все вместе, и под мог попасть на узел, где один из томов не создавался. Теперь пул должен вместить все PVC пода, которые в нём размещаются, в том числе локальные и реплицируемые PVC на LVM-группе, которая входит и в локальный StorageClass, и в ReplicatedStoragePool. Оценка узла по свободному месту теперь считает место, которое останется в пуле после размещения всех PVC пода, локальных и реплицируемых."
  - "`sds-common-scheduler-extender` при проверке тома считал место, зарезервированное под этот же том, занятым другими томами. При планировании пода с локальным PVC оценка по свободному месту второй раз уменьшалась на размер PVC, потому что шаг фильтрации резервирует PVC прямо перед оценкой. Если под планировался снова в течение минуты после предыдущей попытки или контроллер `sds-replicated-volume` повторял запрос на размещение реплики, пул со свободным местом от размера тома до удвоенного размера отклонялся. Теперь собственное резервирование тома в проверке не учитывается; резервирования других томов по-прежнему учитываются."
  - "`sds-common-scheduler-extender` оценивал узлы для подов с реплицируемыми PVC в сжатой шкале: по свободному месту узлы различались не больше чем на 2 балла, а в подах с локальными и реплицируемыми PVC реплицируемые пулы почти не учитывались. Теперь реплицируемые PVC оцениваются по свободному месту в той же шкале, что и локальные. Пул, в котором свободного места меньше запрошенного размера, или пул нулевого размера считается пулом без свободного места, как и узел без этого пула. PVC, diskful-реплика которого уже стоит на узле, больше не снижает оценку узла по свободному месту, поэтому при одинаково свободных пулах узел с репликами части томов пода не оказывается ниже узла без реплик. Узел с репликами всех томов по-прежнему получает высшую оценку, и его отрыв от остальных узлов теперь зависит от их свободного места. Узел с репликами только части томов может потерять отрыв: при 3 томах и пулах, свободных больше чем примерно наполовину, узел с репликами 2 из них оценивается так же, как узел без реплик."
  - "LVMLogicalVolume, удаление которого ждёт финализатор другого модуля (например, `storage.deckhouse.io/sds-local-volume-csi`), оставался с `Ready=True` и фазой `Created`, а агент писал об ожидании только на уровне Debug, и удаление выглядело зависшим без причины. Агент по-прежнему удаляет логический том только после того, как остальные финализаторы сняты, но пока он ждёт, ресурс сообщает `Ready=False` с причиной `Deleting` и перечисляет финализаторы в сообщении условия, а агент пишет об ожидании на уровне Info. Фаза остаётся `Created`, потому что логический том ещё на узле."
  - "`sds-common-scheduler-extender` не учитывал generic ephemeral volumes пода (`spec.volumes[].ephemeral`): такой под размещался без проверки, есть ли на узле LVM-группа StorageClass со свободным местом, и том мог не создаться на выбранном узле. Теперь extender берёт PVC, которую Kubernetes создаёт для тома, `<имя пода>-<имя тома>`, и проверяет её так же, как остальные PVC пода."
  - "Можно было создать второй LVMVolumeGroup для группы томов, которую уже описывал другой LVMVolumeGroup. Оба ресурса становились `Ready` над одной группой томов, scheduler extender учитывал её место дважды, агент на каждом проходе переносил тег `storage.deckhouse.io/lvmVolumeGroupName` группы томов между ними, а удаление ресурса, на который тег указывал в этот момент, удаляло группу томов, которую всё ещё описывал другой. Новый вебхук `lvg-validation` отклоняет создание такого ресурса и называет существующий. Если такой ресурс всё же попал в кластер, агент обслуживает только ресурс, для которого помечена группа томов, или более старый, а второй получает `VGConfigurationApplied=False` с причиной `ValidationFailed`."
  - "Лейбл BlockDevice, который агент выводит из статуса (`kubernetes.io/hostname`, `kubernetes.io/metadata.name`, `status.blockdevice.storage.deckhouse.io/*`), можно было изменить вручную, и изменение держалось до следующего события устройства на узле, потому что агент переписывает такие лейблы только при проходе дискавери. Неверное значение уводило устройство не в тот `blockDeviceSelector` LVMVolumeGroup или LVMVolumeGroupSet. Новая ValidatingAdmissionPolicy `d8-sds-node-configurator-blockdevice-label-guard` отклоняет изменение, удаление и добавление таких лейблов всем, кроме агента, и называет ключи; остальные лейблы ставятся свободно."
  - "`sds-common-scheduler-extender` отклонял узел для пода, который только монтирует уже лежащий на нём локальный том, если thin pool был переподписан на бумаге, например после восстановления тома в обход планировщика: привязанная PVC проверялась по свободному месту пула, которое было отрицательным, и под оставался `Pending`. Привязанная PVC, которая не растёт, больше не занимает место в пуле."
  - "`spec.thinPools[].size` у LVMVolumeGroup и LVMVolumeGroupSet и `spec.size` у LVMLogicalVolume объявлены как число или строка, и API-сервер принимал число, например `size: 1073741824`, но компоненты модуля читали поле только как строку. Один такой объект ломал разбор любого списка своего ресурса, и агент, контроллер и scheduler extender переставали видеть все LVMVolumeGroup или LVMLogicalVolume кластера. Теперь число читается как его десятичная запись — так же, как строка в кавычках."
  - "При обнаружении блочных устройств по умолчанию, через `lsblk`, агент брал точки монтирования из своего контейнера, а не с узла. Диск, смонтированный на узле, сигнатуры файловой системы которого нет в базе udev (например, после `wipefs`), считался consumable (пригодным для LVM) и мог попасть в LVMVolumeGroup. Теперь агент в обоих режимах обнаружения берёт точки монтирования из таблицы монтирования узла (`/proc/1/mountinfo`), и такой BlockDevice не consumable с причиной `Mounted`."
  - "Если группа томов не импортировалась, потому что её тег `storage.deckhouse.io/lvmVolumeGroupName` указывает на LVMVolumeGroup той же группы томов на другом узле, сообщение в логе агента предлагало только решение для общего хранилища — перенести LVMVolumeGroup на этот узел. Для диска, клонированного с другого узла, этот совет неверен, поэтому теперь сообщение описывает и случай клона: сменить UUID группы томов командой `vgchange -u` и снять тег командой `vgchange --deltag`."
  - "На узле без thin-provisioning-tools, например в облачных образах Debian и Ubuntu, LVM активировал thin pool без проверки метаданных и писал `WARNING: Check is skipped, please install recommended missing binary /usr/sbin/thin_check!`, так что пул с повреждёнными метаданными вводился в работу. Теперь модуль устанавливает `thin_check`, `thin_dump` и `thin_repair` в `/var/lib/deckhouse/sds/bin`, а нужные им загрузчик и библиотеки — в `/var/lib/deckhouse/sds/lib/pdata_tools`, и LVM агента пользуется ими на любом узле независимо от того, что на нём установлено. Thin pool, чьи метаданные не прошли проверку, больше не активируется: LVM сообщает `Check of pool ... failed (status:...). Manual repair required!`."
  - "LVMVolumeGroupSet оставлял в своём статусе LVMVolumeGroup узла, удалённого из кластера, и учитывал его среди текущих ресурсов и ресурсов в фазе `Ready`. Теперь такой ресурс исключается из статуса, но не удаляется."
  - "Параметр `spec.volumeCleanup` в LVMLogicalVolume теперь работает в редакциях SE и SE+. Агент этих редакций отклонял любой метод очистки с ошибкой `volume cleanup is not supported in your edition` и оставлял удаляемый LVMLogicalVolume в фазе `Failed`, а логический том — на узле. Теперь агент затирает том перед удалением во всех редакциях, кроме CE, а LVMLogicalVolume, оставшийся в таком состоянии, затирается и удаляется после запуска агента новой версии."
  - "BlockDevice, который после обновления перестал проходить BlockDeviceFilter (например, увеличенный LUN, скрываемый фильтром по размеру), удалялся только на следующем проходе обнаружения, а тот ждёт события udev, — и до тех пор оставался доступен ресурсам LVMVolumeGroup. Теперь он удаляется в том же проходе."
  - "LVMLogicalVolume с размером в процентах (например, `size: 50%`) не расширялся после роста группы томов или thin pool, если свободного места хватало на прирост, но не на весь новый размер тома: агент сравнивал со свободным местом целевой размер целиком, хотя текущий размер тома в свободном месте уже учтён как занятый. Том с `100%` или `100%FREE` не мог вырасти никогда. Том оставался в фазе `Failed` с причиной `unable to extend LV, err: not enough space`. Теперь агент сравнивает только прирост: для thick-тома — со свободным местом группы томов, для thin-тома — с местом, которое ещё оставляет в thin pool его `allocationLimit`."
upgrade_notes:
  - "Настройка `enableThinProvisioning` удалена, схема ModuleConfig переходит на версию 2. Руками делать ничего не нужно: Deckhouse сам преобразует существующий ModuleConfig и удаляет настройку при любом её значении. При `enableThinProvisioning: false` агент теперь тоже загружает `dm_thin_pool`. В release notes версии v0.5.16 было сказано, что настройка удалена; на самом деле она оставалась и работала до этого релиза."
  - "Команда init-контейнера `thin-volumes-enabler` меняется во всех кластерах, поэтому DaemonSet агента один раз перезапускает свои поды."

