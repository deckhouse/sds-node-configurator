# (имя файла должно совпадать с тегом) и заполнить.
date: "2026-xx-xx"
summary: ""
highlights: []

improvements:
  - "Симуляции планирования в kube-scheduler Deckhouse (запросы filter и prioritize с `dryRun: true`) больше не резервируют место в пулах LVM и не меняют резерв места симулируемого пода, поэтому descheduler проверяет целевые узлы, не отнимая свободное место у других подов. `sds-common-scheduler-extender` оценивает узлы в симуляции так же, как при обычном планировании, в том числе для пода с несколькими непривязанными PVC в одном пуле и для LVM-группы, которая входит и в локальный StorageClass, и в ReplicatedStoragePool. Запросы симуляций пишутся в лог на уровне Debug на всех репликах extender, и `/stat` показывает, сколько запросов filter и prioritize были симуляциями."

fixes:
  - "`sds-common-scheduler-extender` проверял место в пуле для каждого PVC пода отдельно, локального или реплицируемого. Узел проходил фильтр, если в пуле помещался каждый PVC по отдельности, но не все вместе, и под мог попасть на узел, где один из томов не создавался. Теперь пул должен вместить все PVC пода, которые в нём размещаются, в том числе локальные и реплицируемые PVC на LVM-группе, которая входит и в локальный StorageClass, и в ReplicatedStoragePool. Оценка узла по свободному месту теперь считает место, которое останется в пуле после размещения всех PVC пода, локальных и реплицируемых."
  - "`sds-common-scheduler-extender` при проверке тома считал место, зарезервированное под этот же том, занятым другими томами. При планировании пода с локальным PVC оценка по свободному месту второй раз уменьшалась на размер PVC, потому что шаг фильтрации резервирует PVC прямо перед оценкой. Если под планировался снова в течение минуты после предыдущей попытки или контроллер `sds-replicated-volume` повторял запрос на размещение реплики, пул со свободным местом от размера тома до удвоенного размера отклонялся. Теперь собственное резервирование тома в проверке не учитывается; резервирования других томов по-прежнему учитываются."
  - "`sds-common-scheduler-extender` оценивал узлы для подов с реплицируемыми PVC в сжатой шкале: по свободному месту узлы различались не больше чем на 2 балла, а в подах с локальными и реплицируемыми PVC реплицируемые пулы почти не учитывались. Теперь реплицируемые PVC оцениваются по свободному месту в той же шкале, что и локальные. Пул, в котором свободного места меньше запрошенного размера, или пул нулевого размера считается пулом без свободного места, как и узел без этого пула. PVC, diskful-реплика которого уже стоит на узле, больше не снижает оценку узла по свободному месту, поэтому при одинаково свободных пулах узел с репликами части томов пода не оказывается ниже узла без реплик. Узел с репликами всех томов по-прежнему получает высшую оценку, и его отрыв от остальных узлов теперь зависит от их свободного места. Узел с репликами только части томов может потерять отрыв: при 3 томах и пулах, свободных больше чем примерно наполовину, узел с репликами 2 из них оценивается так же, как узел без реплик."

