date: "2026-11-10"
summary: "Агент больше не переименовывает devices-файл LVM хоста на узлах семейства RHEL 9, `BlockDeviceFilter` получил те же правила доступа, что и остальные ресурсы модуля, исправлено падение агента."
highlights:
  - "На узлах RHEL 9, Rocky Linux 9 и AlmaLinux 9 агент больше не переименовывает файл хоста `/etc/lvm/devices/system.devices`; файл, переименованный до обновления, нужно вернуть вручную, если хост на него полагается."
  - "`BlockDeviceFilter` теперь могут читать наблюдатели и менять менеджеры подсистемы хранения, а не только суперадминистраторы."

improvements:
  - "`BlockDeviceFilter` теперь выдаётся так же, как остальные ресурсы модуля: get, list и watch — наблюдателю подсистемы storage и уровню `User`, create, update, patch, delete и deletecollection — менеджеру и уровню `ClusterEditor`. До этого читать и менять фильтры могли только суперадминистраторы."
  - "В DKP 1.78 и новее роли `d8:system-capability:sds-node-configurator:view` и `d8:system-capability:sds-node-configurator:edit` дают также доступ на чтение к ModuleConfig `sds-node-configurator`, а `edit` — и на запись, и несут стандартные заголовки и описания платформы, как все capability ролевой модели DKP 1.78. RBAC модуля теперь описан в `rbac.yaml`, и шаблоны RBACv2 пишутся из него; кластеры ниже DKP 1.78 сохраняют прежние роли."

fixes:
  - "На узлах RHEL 9, Rocky Linux 9 и AlmaLinux 9 агент больше не переименовывает файл хоста `/etc/lvm/devices/system.devices` в `system.devices-unused.*`, а его фильтр устройств теперь действует при любом значении `use_devicesfile` на хосте. Агент запускает команды LVM с `--devicesfile \"\"`. Файл, переименованный до обновления, автоматически не восстанавливается: если хост на него полагается, верните имя вручную. На хосте, где devices-файл остаётся, `lvs`, `vgs` и автоактивация LVM при загрузке не видят диски групп томов модуля, пока они не добавлены командой `lvmdevices --adddev`; группы томов модуль активирует сам."
  - "Агент больше не падает на LVMLogicalVolume типа `Thin` без `spec.thin`, если на узле уже есть LV с тем же именем; вместо этого LVMLogicalVolume помечается как некорректный."

upgrade_notes:
  - "Если агент прежней версии переименовал `/etc/lvm/devices/system.devices` в `system.devices-unused.*` на узле RHEL 9, Rocky Linux 9 или AlmaLinux 9, а хост полагается на этот файл, верните ему прежнее имя вручную после обновления: обновление его не восстанавливает."
