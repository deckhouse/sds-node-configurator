  - "The FAQ explains what to check before taking a node out of the cluster: how to list the LVMVolumeGroups, LVMLogicalVolumes and LVMLogicalVolumeSnapshots of the node, how to tell from the finalizers which module uses a volume, and where the modules describe moving their data off the node."
