highlights: []

new_features:
  - "The GPT name of a partition (PARTLABEL) is now shown in the new `status.partLabel` field of a BlockDevice and in the `status.blockdevice.storage.deckhouse.io/partlabel` label, so `blockDeviceSelector` of an LVMVolumeGroup can select disks by the partition name set with `sgdisk -c`. The label value is the slug of the name: `My data` becomes `My-data`. Existing BlockDevices get the field and the label on the next discovery pass."

