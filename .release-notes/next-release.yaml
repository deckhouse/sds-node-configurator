# Draft scaffold for the next release. Before tagging, rename to vX.Y.Z.yaml
# (the file name must match the git tag) and fill it in.
date: "2026-xx-xx"
summary: ""
highlights: []

improvements:
  - "LVMVolumeGroupSet follows its LVMVolumeGroup resources as they change: a resource of the set that is deleted is created again right away, and `thinPools`, `blockDeviceSelector` or `fileDevices` edited by hand are set back to the template. Before, this happened only after the set's spec changed or the controller restarted. The `currentLVMVolumeGroupsCount` status field no longer counts resources that were deleted, and the new `readyLVMVolumeGroupsCount` field (the `Ready LVG Count` column) shows how many resources of the set are in the `Ready` phase."
  - "A thin pool removed from `spec.thinPools` of an LVMVolumeGroup is now removed from the node once it holds no thin volumes. Before, the agent ignored the removal and the thin pool stayed. While the thin pool holds volumes, the agent keeps it and reports them in the `VGConfigurationApplied` condition with the reason `ThinPoolHasVolumes`; the LVMVolumeGroup stays `Ready`. Only thin pools that were listed in the spec are removed: the agent now tags them with `storage.deckhouse.io/lvmVolumeGroupName`."
  - "Scheduling simulations of the Deckhouse kube-scheduler (filter and prioritize requests with `dryRun: true`) no longer reserve space in LVM pools and no longer change the space reservation of the simulated Pod, so the descheduler can check target nodes without taking free space from other Pods. `sds-common-scheduler-extender` scores nodes in a simulation the same way as in real scheduling, including a Pod with several pending PVCs in one pool and an LVM volume group that serves both a local StorageClass and a ReplicatedStoragePool. Simulation requests are logged at Debug on every extender replica, and `/stat` shows how many filter and prioritize requests were simulations."
  - "The names of Volume Groups and logical volumes are now checked against the LVM rules when a resource is created, instead of failing later in `vgcreate` or `lvcreate` on the node and leaving the resource `Failed`. `actualVGNameOnTheNode` of an LVMVolumeGroup and of the LVMVolumeGroupSet template, `spec.thinPools[].name`, `actualLVNameOnTheNode` of an LVMLogicalVolume and `actualSnapshotNameOnTheNode` of an LVMLogicalVolumeSnapshot are limited to 127 characters from `a-z`, `A-Z`, `0-9`, `+`, `_`, `.` and `-`, must not start with a hyphen or be `.` or `..`, and the logical volume names must not start with `snapshot` or `pvmove` or contain a suffix LVM reserves for its internal volumes, such as `_tdata` or `_tmeta`. An LVMLogicalVolumeSnapshot without `actualSnapshotNameOnTheNode` is rejected if its own name, which the agent then uses, starts with `snapshot` or `pvmove` or is longer than 127 characters. `spec.thinPools` holds at most 256 thin pools."

fixes:
  - "The agent could crash or act on a half-updated picture of the node: its cache of block devices, PVs and VGs was written by the scanner and read by the controllers without a lock, and printing the cache after each scan walked the list of logical volumes while a controller added or removed one, which the Go runtime stops with a fatal error. Removing a logical volume that a scan had already dropped from the cache panicked the agent. Every access to the cache now takes its lock, a removed LV that is no longer cached is skipped, and a cached LV handed to a controller is a copy."
  - "An LVMVolumeGroupSet did not create the LVMVolumeGroup of a node that joined the cluster, or got the label of its `nodeSelector`, after the set was created: the controller looked at the nodes only when the set or one of its LVMVolumeGroups changed. It now reacts to nodes that are added, removed or relabelled."
  - "An LVMVolumeGroup with several thin pools went `NotReady` when one thin pool could not be created or extended, and the scheduler stopped placing volumes on its other thin pools too. The LVMVolumeGroup now stays `Ready` with `VGConfigurationApplied=False` and the reason `ThinPoolCreationFailed` or `ThinPoolReconcileFailed`, the failed thin pool is not used, and the others keep receiving volumes. A thin pool that fails while the Volume Group is created no longer stops the creation of the ones after it."
  - "An LVMVolumeGroup whose creation failed after `pvcreate` could not be created again: the Physical Volume left on the device made its BlockDevice not consumable, and validation refused it from then on. A Physical Volume that belongs to no Volume Group is now consumable with the reason `OrphanPhysicalVolume`, and a Volume Group takes it as it is."
  - "The agent removed the Volume Group of an LVMVolumeGroup being deleted even while another controller still held the resource with its finalizer. The agent now waits until the other finalizers are removed and names them in the `VGConfigurationApplied` condition."
  - "The agent did not create a thin pool from `spec.thinPools` when another Volume Group on the same node had a thin pool with the same name."
  - "BlockDevice resources of a node deleted from the cluster, or of a node that lost the labels the agent is placed by, were never deleted: only the node's own agent deletes BlockDevices, and none was left there. The controller now marks them `Missing` with the reason `NodeNotFound` or `AgentNotRunning`, `Unknown` at first and `True` after 10 minutes, and deletes them after `missingBlockDeviceRetentionHours` (24 hours by default) unless an LVMVolumeGroup references them."
  - "`sds-common-scheduler-extender` checked the space of a pool for each PVC of a Pod separately, local or replicated. A node passed the filter when the pool held each PVC alone but not all of them, and the Pod could land on a node where one of its volumes was not created. The pool must now hold all the Pod's PVCs placed in it, including local and replicated PVCs on an LVM volume group that serves both a local StorageClass and a ReplicatedStoragePool. The free space score of a node now uses the space left in the pool after all the Pod's PVCs, local and replicated, are placed."
  - "`sds-common-scheduler-extender` counted the space reserved for a volume as taken by other volumes when it checked the same volume again. Scheduling a Pod with a local PVC lowered its free space score by the PVC size a second time, because the filter step reserves the PVC right before scoring. When a Pod was scheduled again within a minute of the previous attempt, or the `sds-replicated-volume` controller repeated a placement request for a replica, a pool whose free space was between the volume size and twice the size was rejected. The volume's own reservation is now left out of the check; reservations of other volumes still count."
  - "`sds-common-scheduler-extender` scored nodes for Pods with replicated PVCs on a compressed scale: nodes differed by at most 2 points of free space, and in Pods with both local and replicated PVCs the replicated pools barely counted. Replicated PVCs are now scored by free space on the same scale as local PVCs. A pool with less free space than the requested size, or of zero size, counts as no free space, the same as a node without the pool. A PVC whose diskful replica is already on the node no longer lowers the node's free space score, so with equally free pools a node with replicas of some of the Pod's volumes is not ranked below a node without replicas. A node with replicas of all volumes still gets the top score, and its lead over other nodes now depends on their free space. A node with replicas of only some volumes may lose its lead: with 3 volumes and pools more than about half free, a node with replicas of 2 of them is scored the same as a node without replicas."
  - "An LVMLogicalVolume whose deletion waits for a finalizer of another module (for example, `storage.deckhouse.io/sds-local-volume-csi`) kept `Ready=True` and the `Created` phase, and the agent logged the wait only at Debug, so the deletion looked stuck for no reason. The agent still removes the logical volume only after the other finalizers are removed, but while it waits the resource now reports `Ready=False` with the reason `Deleting` and lists the finalizers in the condition message, and the agent logs the wait at Info. The phase stays `Created`, since the logical volume is still on the node."
  - "`sds-common-scheduler-extender` ignored generic ephemeral volumes (`spec.volumes[].ephemeral`) of a Pod: such a Pod was scheduled without checking whether the node has an LVM volume group of the StorageClass with enough free space, and the volume could fail to be created on the chosen node. The extender now takes the PVC that Kubernetes creates for the volume, `<pod name>-<volume name>`, and checks it like any other PVC of the Pod."
  - "A second LVMVolumeGroup could be created for a Volume Group that another LVMVolumeGroup already described. Both resources became `Ready` over the same Volume Group, the scheduler extender counted its space twice, the agent moved the `storage.deckhouse.io/lvmVolumeGroupName` tag of the Volume Group between them on every pass, and deleting the resource the tag named at that moment removed the Volume Group the other one still described. The new `lvg-validation` webhook rejects the creation of such a resource and names the existing one. If one gets into the cluster anyway, the agent serves only the resource the Volume Group is tagged for, or the older one, and reports the other with `VGConfigurationApplied=False` and the reason `ValidationFailed`."
  - "A label of a BlockDevice that the agent derives from its status (`kubernetes.io/hostname`, `kubernetes.io/metadata.name`, `status.blockdevice.storage.deckhouse.io/*`) could be changed by hand, and the change held until the next device event on the node, because the agent rewrites them only on a discovery pass. A wrong value sent the device to the wrong `blockDeviceSelector` of an LVMVolumeGroup or LVMVolumeGroupSet. The new `d8-sds-node-configurator-blockdevice-label-guard` ValidatingAdmissionPolicy rejects changing, removing or adding such labels for everyone except the agent and names the keys; other labels stay free to set."
  - "`sds-common-scheduler-extender` rejected a node for a Pod that only mounts a local volume already on it when the thin pool was overcommitted on paper, for example after a volume was restored outside the scheduler: the bound PVC was checked against the pool's free space, which was negative, and the Pod stayed `Pending`. A bound PVC that does not grow no longer claims space in the pool."
  - "`spec.thinPools[].size` of LVMVolumeGroup and LVMVolumeGroupSet and `spec.size` of LVMLogicalVolume are declared as integer or string, and the API server accepted a number such as `size: 1073741824`, but the module's components read the field as a string only. One such object made every list of its resource fail to decode, so the agent, the controller and the scheduler extender stopped seeing all LVMVolumeGroups or LVMLogicalVolumes of the cluster. A number is now read as its decimal text, the same as the quoted string."
  - "In the default block device discovery, through `lsblk`, the agent took mount points from its own container instead of the node. A disk mounted on the node whose filesystem signature was missing from the udev database, for example after `wipefs`, was reported as consumable and could be taken into an LVMVolumeGroup. The agent now takes mount points from the node's mount table (`/proc/1/mountinfo`) in both discovery modes, and such a BlockDevice is not consumable with the reason `Mounted`."
  - "When a Volume Group was not imported because its `storage.deckhouse.io/lvmVolumeGroupName` tag names the LVMVolumeGroup of the same Volume Group on another node, the message in the agent's log suggested only the remedy for shared storage: move the LVMVolumeGroup to this node. That advice is wrong for a disk cloned from another node, so the message now also covers a clone: change the UUID of the Volume Group with `vgchange -u` and remove the tag with `vgchange --deltag`."

docs:
  - "The FAQ explains how to make storage on a new node come up by itself: put a label into `/var/lib/node_labels` on the node before it joins the cluster, and select it in `dataNodes.nodeSelector` of the module and in an LVMVolumeGroupSet."
  - "The FAQ explains how `allocationLimit` of a thin pool works: how `status.thinPools[].availableSpace` is calculated, what is refused once the limit is reached, and what happens when the limit is changed. The descriptions of `allocationLimit` and `availableSpace` in LVMVolumeGroup and LVMVolumeGroupSet now say the same."
  - "The FAQ section on changing the UUID of Volume Groups when cloning virtual machines now explains that the clone of a node whose Volume Group was created by the module also carries the `storage.deckhouse.io/lvmVolumeGroupName` tag, so the agent on the clone does not import the Volume Group, and that the tag has to be removed with `vgchange --deltag` after `vgchange -u`."

