fixes:
  - "Deleting an LVMVolumeGroup no longer hangs in `Terminating` on its own thin pool. The agent used to refuse to remove the Volume Group while it had any logical volume, the thin pools of `spec.thinPools` included, and only `lvremove` of the pool on the node let the deletion finish. The agent now removes the empty thin pools of the LVMVolumeGroup (those listed in `spec.thinPools` or created for it) and then the Volume Group. A thin pool is removed only while it holds no thin volume, which LVM checks in the same command. A thin pool that holds volumes, and thin pools and logical volumes the LVMVolumeGroup did not create, stay as they are: the `VGConfigurationApplied` condition names them, a `VGHasLogicalVolumes` Warning event is recorded on the LVMVolumeGroup, and the deletion goes on by itself once they are deleted."
  - "A hypervisor no longer activates the Volume Groups of a nested cluster that runs sds-node-configurator too. Such a guest tags its Volume Groups `storage.deckhouse.io/enabled=true`, like the hypervisor does, and both the node's `auto_activation_volume_list` (since v0.10.0) and the agent went by that tag alone: the guest's thin pools and Logical Volumes came up on the hypervisor over the disks of running virtual machines, and after a virtual machine was deleted or moved they kept its multipath map open with no path left, which fired `D8SdsNodeConfiguratorUnreadableMultipathMaps`. The agent now activates only the Volume Groups an LVMVolumeGroup of its node names (by `spec.actualVGNameOnTheNode` and, once known, `status.vgUUID`), and never one tagged by another cluster. The list in `lvm.conf` now holds `@storage.deckhouse.io/cluster=<cluster UUID>` instead of `@storage.deckhouse.io/enabled=true`, and the agent puts this tag on the Volume Group of every LVMVolumeGroup of its node."
  - "The description of `D8SdsNodeConfiguratorUnreadableMultipathMaps` now starts the diagnosis with the holders of the map (`/sys/block/dm-N/holders`) and says how to remove the Logical Volumes of a nested cluster that hold it."
  - "On start, the agent replaces the legacy `linstor-` tag with `storage.deckhouse.io/enabled=true` only on Volume Groups an LVMVolumeGroup of its node names (or, while the API server is unreachable, that carry this cluster's tag), and on their Logical Volumes. Before, it rewrote the tag on any Volume Group it saw, a nested cluster's on a disk of a virtual machine included, and the rewritten tag made such a group look like the module's."

upgrade_notes:
  - "After the update the agent no longer activates a Volume Group that no LVMVolumeGroup of its node names, even if it carries `storage.deckhouse.io/enabled=true`. A Volume Group handed over with that tag is activated once the module has created its LVMVolumeGroup, as before. A Volume Group whose import the module refused (the agent logs `not importing VG`) now also stays inactive after a reboot; create its LVMVolumeGroup as the FAQ section \"Why is a Volume Group with the module's tags not imported, and how do I adopt it?\" describes, or activate it by hand."
  - "The NodeGroupConfiguration `sds-node-configurator-host-lvm-autoactivation.sh` replaces `@storage.deckhouse.io/enabled=true` in `auto_activation_volume_list` of `/etc/lvm/lvm.conf` with `@storage.deckhouse.io/cluster=<cluster UUID>` the next time bashible applies it, and the agent adds that tag to the Volume Groups of its node's LVMVolumeGroups on its next reconciliation. Until a Volume Group carries the tag, the node does not autoactivate it, and after a reboot the agent activates it when it starts. Check with `vgs -o vg_name,vg_tags` before rebooting a node. A Volume Group tagged by another cluster (the cluster was installed anew over kept disks) is neither activated nor retagged; remove the old tag with `vgchange --deltag`, see the FAQ section \"Which Volume Groups does the node activate on its own?\"."
  - "Logical Volumes of nested clusters activated on a hypervisor before the update stay active until they are removed or the node reboots. Remove them as the description of `D8SdsNodeConfiguratorUnreadableMultipathMaps` says."
