{{ $binaries := "/var/lib/deckhouse/sds/lib/libblkid.so.1 /var/lib/deckhouse/sds/lib/libmount.so.1 /var/lib/deckhouse/sds/lib/libsmartcols.so.1 /var/lib/deckhouse/sds/bin/nsenter /var/lib/deckhouse/sds/lib/x86_64-linux-gnu/libudev.so.1 /var/lib/deckhouse/sds/lib/x86_64-linux-gnu/libcap.so.2 /var/lib/deckhouse/sds/bin/lsblk.dynamic /usr/lib/ld-linux-x86-64.so.2 /usr/bin/thin_dump /usr/bin/pdata_tools" }}

# Do not remove. It's used in external tests.
---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}-src-artifact
from: {{ index $.Images "builder/src" }}
final: false

git:
  - add: {{ .ModuleDir }}
    to: /src
    includePaths:
      - api
      - lib/go
      - images/{{ $.ImageName }}
    stageDependencies:
      install:
        - '**/*'
    excludePaths:
      - images/{{ $.ImageName }}/werf.yaml

secrets:
- id: SOURCE_REPO
  value: {{ .SOURCE_REPO }}

shell:
  install:
    - git config --global advice.detachedHead false
    - git clone --depth 1 --branch v{{ include "get_oss_version_by_id" (list "util_linux" .) }} $(cat /run/secrets/SOURCE_REPO)/util-linux/util-linux.git /src/util-linux
    - rm -rf /src/util-linux/.git
    - rm -rf /src/.git

---
# The thin-provisioning-tools binaries ship ready-built in the
# container-factory catalogue, exactly as they shipped as an ALT package
# before; this stage only exists to give `import` something to copy from.
image: {{ .ModuleNamePrefix }}{{ .ImageName }}-thin-tools-artifact
from: {{ index $.Images "thin-provisioning-tools" }}
final: false

---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}-binaries-artifact
from: {{ index $.Images "builder/native" }}
final: false

import:
  - image: {{ .ModuleNamePrefix }}{{ .ImageName }}-src-artifact
    add: /src
    to: /src
    before: install
  # /usr/sbin is a symlink to /usr/bin on this builder, so the two land there
  # directly; thin_dump stays the relative symlink to pdata_tools it is in the
  # package.
  - image: {{ .ModuleNamePrefix }}{{ .ImageName }}-thin-tools-artifact
    add: /usr/sbin/pdata_tools
    to: /usr/bin/pdata_tools
    before: install
  - image: {{ .ModuleNamePrefix }}{{ .ImageName }}-thin-tools-artifact
    add: /usr/sbin/thin_dump
    to: /usr/bin/thin_dump
    before: install

git:
  - add: {{ .ModuleDir }}/tools/dev_images/additional_tools/binary_replace.sh
    to: /binary_replace.sh
    stageDependencies:
      install:
        - "**/*"

shell:
  install:
    # builder/native already carries everything util-linux bootstraps with --
    # gcc, make, autoconf, automake, libtool, bison, flex, pkgconf and a
    # gettext whose autopoint actually has its archive (the catalogue's gettext
    # package does not: on builder/golang autogen.sh dies with "infrastructure
    # files for version 0.18.3 not found"). Only two runtime libraries are
    # added here; pdata_tools and thin_dump come in as an import above.
    #
    # libudev has to be systemd's, not the libudev-zero stub the catalogue also
    # carries: zero answers every query from nothing, so an lsblk linked
    # against it reports wwn=null, and so does the prebuilt util-linux package
    # (it carries no libudev at all). WWN is what BlockDevice identity is built
    # from, so either would be silent data loss rather than a cosmetic
    # difference. Verified against a real NVMe: with systemd's libudev this
    # lsblk returns the same wwn the host's own lsblk does. MODEL and SERIAL
    # come from sysfs and survive either way, which is what makes the
    # difference easy to miss.
    - pm install systemd libcap
    - cd /src/util-linux
    - ./autogen.sh
    - ./configure LDFLAGS="-static" --enable-static-programs -disable-all-programs --enable-nsenter
    - make install-strip
    - ./configure --prefix /var/lib/deckhouse/sds --with-udev
    - make install-strip
    - mkdir -p /var/lib/deckhouse/sds/lib/x86_64-linux-gnu/
    - cp /src/util-linux/nsenter.static /var/lib/deckhouse/sds/bin/nsenter
    - cp /lib64/libudev.so.1 /var/lib/deckhouse/sds/lib/x86_64-linux-gnu/libudev.so.1
    - cp /lib64/libc.so.6 /var/lib/deckhouse/sds/lib/x86_64-linux-gnu/libc.so.6
    - cp /lib64/libcap.so.2 /var/lib/deckhouse/sds/lib/x86_64-linux-gnu/libcap.so.2
    # builder/native keeps the loader at /usr/lib (with /lib64 symlinked there),
    # not under the sys-root prefix the ALT builder used.
    - cp /usr/lib/ld-linux-x86-64.so.2 /var/lib/deckhouse/sds/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2
    - cp /var/lib/deckhouse/sds/bin/lsblk /var/lib/deckhouse/sds/bin/lsblk.dynamic
    - chmod +x /binary_replace.sh
    - /binary_replace.sh -i "{{ $binaries }}" -o /relocate

---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}-golang-artifact
from: {{ index $.Images "builder/golang" }}
final: false

import:
  - image: {{ .ModuleNamePrefix }}{{ .ImageName }}-src-artifact
    add: /src
    to: /src
    before: install

mount:
{{ include "mount points for golang builds" . }}

secrets:
- id: GOPROXY
  value: {{ .GOPROXY }}
{{ include "secret for private go modules" . }}

shell:
  setup:
    {{- include "svace toolchain for golang builds" . | nindent 4 }}
    {{- include "auth for private go modules" . | nindent 4 }}
    - cd /src/images/{{ $.ImageName }}/cmd
    - GOPROXY=$(cat /run/secrets/GOPROXY) go mod download
    - export GOOS=linux GOARCH=amd64 CGO_ENABLED=0
    - |
      {{- include "image-build.build" (set $ "BuildCommand" (printf `go build -ldflags="-s -w" -tags "%s" -o /%s` .MODULE_EDITION $.ImageName)) | nindent 6 }}
    - chmod +x /{{ $.ImageName }}

---
image: {{ .ModuleNamePrefix }}{{ .ImageName }}
from: {{ index $.Images "builder/distroless" }}
git:
{{- include "image mount points" . }}
import:
  - image: {{ .ModuleNamePrefix }}{{ .ImageName }}-binaries-artifact
    add: /relocate
    to: /
    before: setup
  - image: {{ .ModuleNamePrefix }}{{ .ImageName }}-golang-artifact
    add: /{{ $.ImageName }}
    to: /{{ $.ImageName }}
    before: setup

imageSpec:
  config:
    entrypoint: ["/{{ $.ImageName }}"]
