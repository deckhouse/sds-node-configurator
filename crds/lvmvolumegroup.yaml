---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: lvmvolumegroups.storage.deckhouse.io
  labels:
    heritage: deckhouse
    module: sds-node-configurator
    backup.deckhouse.io/cluster-config: "true"
spec:
  group: storage.deckhouse.io
  scope: Cluster
  names:
    kind: LVMVolumeGroup
    plural: lvmvolumegroups
    singular: lvmvolumegroup
    shortNames:
      - lvg
  preserveUnknownFields: false
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: |
            An interface for managing Volume Groups and Thin pools on the nodes.
            
            > These resources might be created both by a user and the `sds-node-configurator` controller. `sds-node-configurator` controller will automatically create an LVMVolumeGroup resource if it detects an existing Volume Group on a node tagged with 'storage.deckhouse.io/enabled=true'. Controller will fill in both the 'spec' and 'status' fields.
            > `spec.thinPools` field must be filled in by yourself.
          required:
            - spec
          properties:
            spec:
              type: object
              x-kubernetes-validations:
                - rule: |
                    (self.type == "Local" && has(self.local)) || self.type != "Local"
                  message: "The 'local' field is required when the 'type' field is 'Local'."
                - rule: |
                    has(self.blockDeviceSelector) || (has(self.fileDevices) && size(self.fileDevices) > 0)
                  message: "At least one of 'blockDeviceSelector' or 'fileDevices' must be specified."
                # The per-entry rules — 'directory' is immutable, 'size' may only
                # grow — live on fileDevices[] itself rather than here. See the
                # comment on that field.
              required:
                - type
                - actualVGNameOnTheNode
              properties:
                type:
                  type: string
                  description: |
                    Type of a Volume Group.
                    
                    Possible values:
                    
                    - `Local`: Local volume group; the devices used are not distributed (not Shared LUN).
                  enum:
                    - Local
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: "The type field is immutable."
                local:
                  type: object
                  description: |
                    Desired configuration for a local Volume Group.
                  required:
                    - nodeName
                  properties:
                    nodeName:
                      type: string
                      description: |
                        Desired node for the LVM Volume Group.
                        
                        > This field is immutable.
                      x-kubernetes-validations:
                        - rule: self == oldSelf
                          message: "The nodeName field is immutable."
                blockDeviceSelector:
                  type: object
                  description: |
                    Desired block device selector.
                    
                    > Note: Selected block devices must belong to the same node for a volume group of type ‘Local’.
                  properties:
                    matchLabels:
                      type: object
                      description: |
                        Desired block device selector labels.
                      additionalProperties:
                        type: string
                    matchExpressions:
                      type: array
                      description: |
                        Desired block device selector expressions.
                      items:
                        type: object
                        properties:
                          key:
                            type: string
                            description: |
                              Label key to check.
                          operator:
                            type: string
                            description: |
                              Operator used to compare values.
                            enum:
                              - In
                              - NotIn
                              - Exists
                              - DoesNotExist
                          values:
                            type: array
                            description: |
                              Array of values to compare. Required if the operator is `In` or `NotIn`.
                            items:
                              type: string
                actualVGNameOnTheNode:
                  type: string
                  description: |
                    Desired name of a Volume Group. Must be unique for the node it is on.
                    
                    > This field is immutable.
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: "The actualVGNameOnTheNode field is immutable."
                fileDevices:
                  type: array
                  maxItems: 32
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - name
                  description: |
                    File-backed block devices to create as LVM PVs for this Volume Group.

                    The agent will create a preallocated file in the specified directory,
                    attach it as a loop device, and use it as a Physical Volume.
                    File devices and block devices can be used together in the same VG.

                    Each entry is identified by its `name`. `directory` cannot be changed,
                    and `size` can only be increased: raising it grows the backing file, the
                    loop device and the Physical Volume in place, without unmounting anything
                    or interrupting the volumes on top. Lowering it is rejected: giving
                    capacity back means shrinking the Volume Group, which the module does
                    not do for block devices either.

                    Capacity can therefore be added two ways: raise the size of an existing
                    entry, or add a new entry under a new name when the extra space has to
                    come from a different filesystem. Prefer fewer, larger entries — every
                    entry costs a loop device, a PV and VG metadata, and thick logical volumes
                    requesting contiguous space get harder to place as free space is spread
                    across many small PVs.

                    An entry that was never provisioned (it is not present in
                    `status.nodes[].fileDevices`, for example because it failed validation)
                    can be removed from the spec. Removing an entry that backs a live PV is
                    not supported — the module never shrinks a Volume Group; the agent
                    reports the drift on the `VGConfigurationApplied` condition (reason
                    `FileDeviceDrift`) and takes no destructive action. The Volume Group
                    keeps working and stays `Ready`. Freeing space inside a file device is
                    done with `fstrim` instead, see the module FAQ.
                  items:
                    type: object
                    required:
                      - name
                      - directory
                      - size
                    # The first rule is checked on every entry; the two below it are
                    # transition rules, evaluated only against the entry that
                    # carried the same `name` before the edit.
                    #
                    # That correlation is the apiserver's, not ours: `fileDevices` is
                    # an x-kubernetes-list-type=map keyed on `name`, which makes this
                    # a correlatable position, so `oldSelf` here is the entry with the
                    # same name — and the rules are simply not evaluated for an entry
                    # that had no predecessor. Appending an entry and removing one are
                    # therefore exempt by construction rather than by being spelled
                    # out, and a reorder is a no-op because nothing is matched by
                    # position. See
                    # https://kubernetes.io/docs/tasks/extend-kubernetes/custom-resources/custom-resource-definitions/#transition-rules
                    #
                    # Expressing them per entry instead of as one nested all() over
                    # both the old and the new list also keeps the cost linear in
                    # maxItems rather than quadratic, and lets each violation report
                    # itself — one message naming both invariants tells an admin who
                    # edited `directory` about shrinking too.
                    x-kubernetes-validations:
                      # Rejected at admission for the same reason a decimal unit is:
                      # `size` cannot be lowered afterwards, so an entry accepted below
                      # the minimum is an entry the agent refuses forever and the user
                      # can only escape by removing and re-adding it. The agent keeps
                      # its own check for objects that were imported or already exist.
                      - rule: "quantity(self.size).compareTo(quantity('1Gi')) >= 0"
                        message: "A fileDevices entry's 'size' must be at least 1Gi."
                      - rule: "self.directory == oldSelf.directory"
                        message: "A fileDevices entry's 'directory' is immutable."
                      - rule: "quantity(self.size).compareTo(quantity(oldSelf.size)) >= 0"
                        message: "A fileDevices entry's 'size' can only be increased. Shrinking a Volume Group is not supported."
                    properties:
                      name:
                        type: string
                        maxLength: 63
                        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                        description: |
                          Identifier of this file device within the Volume Group, unique among
                          the entries of this LVMVolumeGroup. It becomes part of the backing
                          file's name on the node, so it is restricted to lowercase
                          alphanumerics and '-'.

                          > This field is the entry's key: an entry is identified by it, and
                          > changing it is not an edit but the removal of one entry and the
                          > addition of another. If the old name had already been provisioned,
                          > its Physical Volume stays in the Volume Group and the agent reports
                          > it on the `VGConfigurationApplied` condition.
                      directory:
                        type: string
                        maxLength: 4096
                        # Rejected at admission for the same reason `size` and `name`
                        # are: `directory` is immutable once the entry exists, so a
                        # malformed value is one the agent refuses forever and the user
                        # can only escape by removing and re-adding the entry. This is
                        # the same shape the fileDevicesDirectory module setting
                        # enforces — an absolute path of at least one non-empty
                        # component. A '..' component cannot be excluded here (an RE2
                        # regexp has no lookahead), so the agent keeps its own check for
                        # that, and for the base-directory subtree.
                        pattern: '^/[^/]+(/[^/]+)*$'
                        description: |
                          Absolute directory on the node's filesystem where the backing file
                          will be created.

                          Must be the module's configured base directory
                          (fileDevicesDirectory, default /opt/deckhouse/sds/file-devices) or a
                          subdirectory of it; the agent rejects paths outside that subtree so a
                          stray entry cannot fill an arbitrary host path.

                          The agent creates the directory automatically (mkdir -p) if it does
                          not exist. The path must be absolute and must not contain '..'
                          segments. Provisioning fails if the path is on a read-only
                          filesystem, a non-directory component is in the way, or there is not
                          enough free space for the requested size.
                      size:
                        type: string
                        maxLength: 32
                        pattern: '^[0-9]+(Mi|Gi|Ti|Pi|Ei)$'
                        description: |
                          Size of the preallocated backing file. Must be at least 1Gi;
                          a smaller value is rejected at admission, because `size` cannot
                          be lowered afterwards and an entry accepted below the minimum is
                          one the agent refuses forever.

                          Only binary units are accepted. Decimal units are rejected at
                          admission for the same reason: `1G` is 10^9 bytes, which is below
                          the 1Gi (2^30 bytes) minimum, and the mistake is easy to miss.

                          The value must be a whole number of the unit it names: `1536Mi`,
                          not `1.5Gi`. A Physical Volume is always a little smaller than
                          its backing file (LVM keeps metadata at the head of the device
                          and then rounds down to whole extents), and the reconciler treats
                          a difference of up to one extent as "already the right size". That
                          tolerance covers the metadata gap exactly as long as the requested
                          size is a whole number of mebibytes; a finer value can leave a
                          permanent gap the agent would try to close on every reconcile.
                thinPools:
                  type: array
                  description: |
                    Desired thin pool configuration.
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: |
                          Desired thin pool name.
                          
                          > This field is immutable.
                      size:
                        x-kubernetes-int-or-string: true
                        pattern: '^[0-9]+(\.[0-9]+)?(E|P|T|G|M|k|Ei|Pi|Ti|Gi|Mi|Ki)?$|^[1-9][0-9]?%$|100%'
                        description: |
                          Desired thin pool size. Might be specified as number or percent size of total Volume Group space.
                          
                          > Note, that if you specify the percent size, the thin pool will be automatically extended when Volume Group is extended.
                      allocationLimit:
                        type: string
                        pattern: '^[1-9][0-9]{2,3}%$'
                        default: "150%"
                        description: |
                          Thin pool oversize limit.
                    required:
                      - name
                      - size
            status:
              type: object
              properties:
                thinPoolReady:
                  type: string
                  description: |
                    Shows the number of healthy and total thin pools.
                configurationApplied:
                  type: string
                  description: |
                    Indicates if the last configuration has been successfully applied.
                phase:
                  type: string
                  description: |
                    General LVMVolumeGroup condition.
                  enum:
                    - Pending
                    - Ready
                    - NotReady
                    - Terminating
                    - ""
                conditions:
                  description: |
                    LVMVolumeGroup conditions.
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        description: |
                          Condition type.
                        enum:
                          - VGConfigurationApplied
                          - VGReady
                          - NodeReady
                          - AgentReady
                          - Ready
                      status:
                        type: string
                        description: |
                          Condition status.
                      reason:
                        type: string
                        description: |
                          Reason for the current status.
                      message:
                        type: string
                        description: |
                          Information about the current status.
                      lastTransitionTime:
                        type: string
                        description: |
                          Time the condition was updated.
                      observedGeneration:
                        type: integer
                        description: |
                          Resource version when the condition was applied.
                vgUUID:
                  type: string
                  description: |
                    Volume Group UUID.
                vgSize:
                  type: string
                  description: |
                    Volume Group capacity.
                vgFree:
                  type: string
                  description: |
                    Volume Group free space.
                extentSize:
                  type: string
                  description: |
                    Physical extent size of the Volume Group.
                allocatedSize:
                  type: string
                  description: |
                    Amount of space currently occupied on the Volume Group.
                thinPools:
                  type: array
                  description: |
                    Current state of the Volume Group's thin pools.
                    
                    > Might be empty if there are no thin pools in the Volume Group.
                  items:
                    type: object
                    required:
                      - name
                      - actualSize
                      - usedSize
                    properties:
                      name:
                        type: string
                        description: |
                          Thin pool name.
                      actualSize:
                        type: string
                        description: |
                          Thin pool capacity.
                      usedSize:
                        type: string
                        description: |
                          Thin pool used size.
                      allocatedSize:
                        type: string
                        description: |
                          Total requested size of logical volumes in the thin pool.
                      allocationLimit:
                        type: string
                        description: |
                          Thin pool oversize limit.
                        default: "150%"
                        pattern: '^[1-9][0-9]{2,3}%$'
                      availableSpace:
                        type: string
                        description: |
                          Thin pool free space available.
                      ready:
                        type: boolean
                        description: |
                          Thin pool health status.
                      message:
                        type: string
                        description: |
                          Information about the status.
                nodes:
                  type: array
                  description: |
                    Information about the nodes the Volume Group is on.
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: |
                          Node name.
                      devices:
                        type: array
                        description: |
                          Information about the devices used in the Volume Group on the current node.
                        items:
                          type: object
                          properties:
                            path:
                              type: string
                              description: |
                                Device path on the node (e.g., `/dev/sda`).
                            pvSize:
                              type: string
                              description: |
                                Physical Volume size.
                            devSize:
                              type: string
                              description: |
                                Block device size.
                            pvUUID:
                              type: string
                              description: |
                                LVM Physical Volume UUID.
                            blockDevice:
                              type: string
                              description: |
                                Name of the corresponding block device resource.
                      fileDevices:
                        type: array
                        description: |
                          Information about the file-backed devices used in the Volume Group on the current node.
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              description: |
                                Name of the `spec.fileDevices` entry this device was provisioned from.

                                An entry present here backs a live Physical Volume and cannot be
                                removed from the spec; an entry absent from this list has not been
                                provisioned and may be removed.
                            filePath:
                              type: string
                              description: |
                                Path to the backing file on the node.
                            loopDevice:
                              type: string
                              description: |
                                Loop device path (e.g., `/dev/loop0`).
                            size:
                              type: string
                              description: |
                                Size of the Physical Volume created on the backing file.
                                This is slightly smaller than the requested `spec.fileDevices[].size`
                                because LVM reserves space for PV metadata (the same way
                                `status.nodes[].devices[].pvSize` differs from the raw device size).
                            pvUUID:
                              type: string
                              description: |
                                LVM Physical Volume UUID.
      subresources:
        status: {}
      additionalPrinterColumns:
        - jsonPath: .status.thinPoolReady
          name: ThinPools
          type: string
          description: Current and total Thin pools count.
        - jsonPath: .status.configurationApplied
          name: Configuration Applied
          type: string
          description: If last configuration has been successfully applied.
        - jsonPath: .status.phase
          name: phase
          type: string
          description: Resource phase.
        - jsonPath: .status.nodes..name
          name: node
          type: string
          description: Node the Volume Group is on.
        - jsonPath: .status.vgSize
          name: size
          type: string
          description: Total Volume Group size.
        - jsonPath: .status.allocatedSize
          name: allocated size
          type: string
          description: Actual Volume Group size.
        - jsonPath: .spec.actualVGNameOnTheNode
          name: VG
          type: string
          description: Actual Volume Group name.
        - jsonPath: .spec.type
          name: type
          type: string
          description: Volume Group type.
          priority: 1
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
          description: Age of this resource.
