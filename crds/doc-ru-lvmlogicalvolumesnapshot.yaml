spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Ресурс LVMLogicalVolumeSnapshot определяет хранилище, в котором будет создан VolumeSnapshot.
          properties:
            spec:
              properties:
                actualSnapshotNameOnTheNode:
                  description: |
                    Имя снимка тома на узле.
                lvmLogicalVolumeName:
                  description: |
                    Имя ресурса LVMLogicalVolume, с которого создается снимок.
            status:
              description: |
                Описывает состояние ресурса.
              properties:
                nodeName:
                  description: |
                    Имя Kubernetes-узла, на котором находится снимок.
                actualVGNameOnTheNode:
                  description: |
                    Фактическое имя группы томов на узле, в которой находится снимок.
                actualLVNameOnTheNode:
                  description: |
                    Фактическое имя тома на узле, с которого создан снимок.
                phase:
                  description: |
                    Текущая фаза ресурса.
                    
                    Возможные значения:
                    
                    - `Created` — снимок создан успешно;
                    - `Pending` — снимок в процессе создания;
                    - `Failed` — ошибка при создании снимка.
                reason:
                  description: |
                    Причина выставленной фазы.
                observedGeneration:
                  description: |
                    Значение `metadata.generation`, которое контроллер обработал последним. Если оно
                    отстаёт от `metadata.generation`, последняя спецификация ещё не обработана, и
                    условия ниже описывают предыдущую.
                conditions:
                  description: |
                    Последние наблюдения состояния ресурса. Тип условия: `Ready`.
                  items:
                    properties:
                      type:
                        description: |
                          Тип условия.
                      status:
                        description: |
                          Текущий статус условия.
                      observedGeneration:
                        description: |
                          Значение `metadata.generation`, для которого было выставлено условие.
                      lastTransitionTime:
                        description: |
                          Время последней смены статуса условия. Не обновляется, если изменились
                          только причина или сообщение.
                      reason:
                        description: |
                          Машиночитаемая причина текущего статуса, пригодная для фильтрации логов
                          и алертинга.
                      message:
                        description: |
                          Человекочитаемое пояснение к текущему статусу.
                size:
                  description: |
                    Размер снимка Logical Volume на узле.
                usedSize:
                  description: |
                    Используемый размер снимка Logical Volume на узле.

