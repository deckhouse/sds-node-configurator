spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Один том внутри общей группы томов.

            Описывает сам том, а не то, где он используется. Создание, расширение и удаление — операции
            с метаданными, и принадлежат они одному узлу, владельцу метаданных группы, тогда как
            активация принадлежит тому узлу, к которому том подключён. Это два писателя разных вещей —
            поэтому подключение вынесено в отдельный ресурс, а не сделано полем здесь.
          properties:
            spec:
              description: |
                Описывает том.
              properties:
                lvmSharedVolumeGroupName:
                  description: |
                    Общая группа томов, из которой нарезан этот том.
                actualLVNameOnTheNode:
                  description: |
                    Имя логического тома в том виде, в каком он существует в группе томов.
                type:
                  description: |
                    Как размещается том.

                    Здесь существует только `Thick`, и это не упущение. Под lvmlockd thin-пул вообще
                    нельзя активировать в разделяемом режиме, поэтому каждый том thin-пула оказался бы
                    привязан к единственному узлу, который держит пул, — то есть ровно к тому свойству,
                    ради избавления от которого общая группа и существует. Переподписка на общем LUN —
                    задача массива.
                size:
                  description: |
                    Запрошенный размер тома.

                    Может быть увеличен и не может быть уменьшен. Фактический размер округляется вверх
                    до целого числа экстентов и публикуется в `status.actualSize`; при большом размере
                    экстента разницу стоит читать, а не предполагать.
                volumeCleanup:
                  description: |
                    Как стирается этот том при удалении.

                    Здесь лежит действующая политика, пришедшая из StorageClass, тогда как одноимённое
                    поле группы задаёт нижнюю границу: том, запросивший политику слабее групповой,
                    отбраковывается. `Discard` отбраковывается и тогда, когда массив не подтвердил чтение
                    нулей после размапливания, — иначе удаление молча передаст данные следующему
                    потребителю.
            status:
              description: |
                Наблюдаемое состояние тома; пишет только агент на владельце метаданных группы.
              properties:
                phase:
                  description: |
                    Текущее состояние тома, выводимое из перечисленных ниже условий.

                    Возможные значения:

                    - `Pending` — том ещё не создан.
                    - `Created` — том существует и может быть подключён.
                    - `Failed` — проход согласования завершился ошибкой; подробности в условиях.
                observedGeneration:
                  description: |
                    Значение `metadata.generation`, по которому агент отработал в последний раз.
                actualSize:
                  description: |
                    Фактический размер тома, округлённый вверх до целых экстентов.
                lvUUID:
                  description: |
                    UUID логического тома. Вместе с UUID группы он образует device-mapper-UUID каждой
                    карты этого тома — по нему узел опознаёт свои карты, не доверяя их именам.
                contiguous:
                  description: |
                    Занимает ли том непрерывный диапазон экстентов.
                conditions:
                  description: |
                    Последние наблюдения состояния тома.
                  items:
                    properties:
                      type:
                        description: |
                          Тип условия.

                          - `Created` истинно, когда логический том создан.
                          - `Zeroed` истинно, когда голова тома обнулена, — именно это не даёт свежему
                            тому предъявить сигнатуру файловой системы предыдущего потребителя.
                          - `Resized` сообщает исход последнего изменения размера.
                          - `Ready` обобщает остальные.
                      status:
                        description: |
                          Состояние условия.
                      observedGeneration:
                        description: |
                          Значение `metadata.generation`, для которого выставлено это условие.
                      lastTransitionTime:
                        description: |
                          Время последнего перехода состояния этого условия.
                      reason:
                        description: |
                          Машиночитаемая причина текущего состояния.
                      message:
                        description: |
                          Человекочитаемое объяснение текущего состояния.
