spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Группа томов LVM на хранилище, которое одновременно видят несколько узлов; кто и в какой
            том может писать, арбитрируют lvmlockd и sanlock.

            От LVMVolumeGroup отличается тем, чем адресуется. Локальная группа принадлежит одному узлу
            и находится через обнаруженные на нём блочные устройства; общая группа принадлежит множеству
            узлов и находится по WWID своих LUN, потому что пути и имена карт на разных узлах разные, и
            одинаков только WWID.

            Ровно один узел — `spec.metadataOwner` — выполняет операции с метаданными группы и является
            единственным писателем статуса этого ресурса. Остальные участники по-прежнему активируют
            свои тома сами; роль существует потому, что у метаданных LVM один писатель по построению,
            а не потому, что другие узлы чем-то хуже.

            Узловые факты здесь не живут. Шестнадцать-тридцать два агента, пишущих в одну
            `resourceVersion`, — это генератор конфликтов, поэтому узел сообщает своё состояние рядом с
            собой, а в этом статусе лежит только то, что о самой группе наблюдает владелец метаданных.
          properties:
            spec:
              description: |
                Описывает общую группу томов: LUN'ы, на которых она живёт, узлы, которым разрешено ею
                пользоваться, и зафиксированные для неё политики.
              properties:
                actualVGNameOnTheNode:
                  description: |
                    Имя группы томов в том виде, в каком она существует на узлах.

                    Ограничение в 44 символа не косметическое. lvmlockd добавляет к имени префикс `lvm_`
                    и проверяет результат против 64, а sanlock молча обрезает имя lockspace'а до 48, —
                    более длинное имя примут оба, после чего оно будет указывать на другой lockspace,
                    а не на предполагаемый.
                devices:
                  description: |
                    LUN'ы, на которых живёт эта группа томов, адресуемые по WWID.

                    Именно WWID, а не путь устройства и не ссылка на BlockDevice: один и тот же LUN на
                    разных узлах называется по-разному, а общая группа обязана означать одно и то же на
                    всех. Агент сам разрешает WWID в локальную multipath-карту.

                    Все устройства группы должны принадлежать одному классу геометрии, а класс
                    определяется тем же правилом, которое применяет сам LVM: физический **или** логический
                    размер блока 4096 означает 4К-геометрию. Устройство 512e и устройство 4Kn — один
                    класс, честное 512-байтное — другой. От этого зависит разметка аренд sanlock, поэтому
                    смешение классов отбраковывается при создании группы и при добавлении устройства.
                  items:
                    properties:
                      wwid:
                        description: |
                          Всемирно уникальный идентификатор LUN в том виде, в каком его сообщает multipath.
                nodes:
                  description: |
                    Узлы, входящие в состав группы. Агент на перечисленном здесь узле стартует lockspace
                    sanlock этой группы и может активировать её тома; агент на убранном отсюда узле
                    lockspace останавливает.

                    Состав определяет контроллер, владеющий пулом, по фактам, которые узлы сообщают о
                    себе. Узел нельзя убирать, пока он держит активный том этой группы.
                metadataOwner:
                  description: |
                    Узел, агент которого выполняет операции с метаданными группы — `vgcreate`,
                    `vgextend`, `lvcreate`, `lvremove`, `lvextend` неподключённых томов — и единственный
                    писатель статуса этого ресурса.

                    Должен входить в `spec.nodes`. Контроллер передаёт роль, когда держатель выходит из
                    группы или перестаёт быть готовым; передача безопасна, потому что собственного
                    состояния у роли нет.
                volumeCleanup:
                  description: |
                    Нижняя граница того, как стирается том этой группы при удалении.

                    Поле обязательное, и это сделано намеренно: том, нарезанный из общего LUN, передаётся
                    следующему потребителю как сырая ёмкость, поэтому «политики нет» — не защитимое
                    значение по умолчанию. Том может запросить политику строже групповой и никогда слабее.

                    Возможные значения:

                    - `Discard` — отправляет `UNMAP` массиву. Корректно только тогда, когда массив
                      гарантирует чтение нулей после размапливания (иначе следующий потребитель прочитает
                      данные предыдущего) и когда размер экстента кратен гранулярности размапливания —
                      иначе не освобождается ничего.

                    - `RandomFillSinglePass` — однократная перезапись тома случайными данными.

                    - `RandomFillThreePass` — трёхкратная перезапись тома случайными данными.
                lvm:
                  description: |
                    Параметры раскладки, передаваемые в `vgcreate` и зафиксированные на всё время жизни
                    группы томов.

                    Они лежат здесь, потому что `vgcreate` выполняет агент, и ни один из них потом не
                    меняется ничем, кроме уничтожения группы вместе со всем её содержимым. Сам блок
                    имеет значением по умолчанию пустой объект, а не отсутствует: отсутствующий объект
                    не даёт ни умолчаний, ни `oldSelf`, поэтому правило неизменяемости ниже не
                    срабатывало бы, и значение можно было бы внести уже после того, как группа создана
                    с другим.
                  properties:
                    physicalExtentSize:
                      description: |
                        Размер физического экстента и, соответственно, гранулярность каждого тома группы.

                        Должен быть кратен гранулярности размапливания LUN'ов группы, иначе дискард тома
                        не освобождает ничего, как бы честно массив ни отдавал потом нули. Проверяется
                        до создания группы, а не при первом удалении.
                    sanlockAlignSize:
                      description: |
                        Выравнивание области аренд sanlock, определяющее сразу две вещи: насколько велика
                        область аренд и каков потолок `host_id` — 250 хостов при 1Mi, 500 при 2Mi,
                        1000 при 4Mi, 2000 при 8Mi.

                        Агент передаёт значение в `vgcreate`, а потолок соблюдает аллокатор, потому что
                        сам LVM его не проверяет: `host_id` выше потолка принимается и отказывает позже,
                        когда узел пытается войти.
                    metadataSize:
                      description: |
                        Размер области метаданных группы томов на каждом физическом томе.

                        Метаданные переписываются при каждой операции с томами и не могут вырасти позже,
                        поэтому группе, рассчитанной на сотни томов, размер надо задать заранее.
                sanlockLVExtend:
                  description: |
                    На сколько растёт скрытый том аренд, когда в нём заканчиваются слоты.

                    Значение по умолчанию у LVM хорошее, и это поле существует на случай, когда оно не
                    подходит: расширение области происходит на фоне создания томов, поэтому больший шаг
                    меняет частую паузу на более редкую, но длинную. Обратно область не сокращается ни
                    при каком значении.
            status:
              description: |
                Наблюдаемое состояние группы; пишет только агент на узле `spec.metadataOwner`.
              properties:
                phase:
                  description: |
                    Текущее состояние группы, выводимое из перечисленных ниже условий.

                    Возможные значения:

                    - `Pending` — группа ещё не создана либо владелец метаданных её не увидел.
                    - `Created` — группа существует и может обслуживать тома.
                    - `Failed` — проход согласования завершился ошибкой; подробности в условиях.
                observedGeneration:
                  description: |
                    Значение `metadata.generation`, по которому агент отработал в последний раз.

                    Если оно отстаёт от `metadata.generation`, последняя спецификация ещё не обработана,
                    а условия описывают предыдущую.
                vgUUID:
                  description: |
                    UUID группы томов.

                    Это идентичность группы при переименованиях и на всех узлах, а также префикс
                    device-mapper-UUID каждого тома в ней — по нему узел понимает, принадлежит ли карта
                    этой группе, не доверяя её имени.
                vgSize:
                  description: |
                    Полный размер группы томов.
                vgFree:
                  description: |
                    Свободное место в группе томов. Область аренд из него уже исключена.
                extentSize:
                  description: |
                    Размер физического экстента — гранулярность каждого тома здесь. Фиксируется при
                    создании группы и потом не меняется.
                leaseAreaSize:
                  description: |
                    Текущий размер скрытого тома, в котором sanlock держит аренды.
                logicalVolumeCount:
                  description: |
                    Количество логических томов в группе.
                nodes:
                  description: |
                    Что каждый участник пула говорит о собственном участии в нём.

                    Это намеренно не condition: conditions описывают группу и пишутся только
                    владельцем метаданных, тогда как «поднят ли lockspace» — факт об узле.
                    Пофайловый факт в общем массиве давал бы значение, в котором побеждает
                    последний записавший, а читатель не может понять, чей ответ он получил.
                  items:
                    properties:
                      name:
                        description: |
                          Имя узла, к которому относится запись.
                      lockspaceStarted:
                        description: |
                          `true`, пока узел держит lockspace этой группы и, значит, может
                          активировать её тома. Пока `false`, ни один том группы не может быть
                          подключён к этому узлу — причина в `reason`.
                      reason:
                        description: |
                          Короткая машиночитаемая причина текущего состояния.

                          - `LockspaceStarted` — узел в пуле.
                          - `ReservationConflict` — на LUN стоит SCSI-резервация другого инициатора;
                            сама собой такая ситуация не рассасывается.
                          - `LUNNotReadyYet` — группа томов пока не читается на этом узле.
                          - `BarrierNotCleared` — узел был зафенсен, и `error`-таргет его лизовой
                            области всё ещё кем-то держится.
                          - `LockspaceNotStarted` — всё остальное, подробности в `message`.
                      message:
                        description: |
                          Состояние словами, включая то, что может сделать только человек, — если
                          такое есть.
                      persistentReservations:
                        description: |
                          Что этот узел может сказать о канале SCSI-резерваций для LUN пула — установлено **чтением**, а не попыткой.

                          Перевод пула на резервации — односторонняя дверь в середине собственной процедуры: между `vgchange --setpersist require` и успешным `vgchange --persist start` группа томов неработоспособна. Пул, узлы которого не могут заранее подтвердить работоспособность канала, через эту дверь вести нельзя.
                        properties:
                          ready:
                            description: |
                              `true`, когда выполнены все предусловия, которые узел способен проверить чтением. Это не значит, что резервации используются, — только что включение здесь не упадёт.
                          reason:
                            description: |
                              Короткая машиночитаемая причина, когда `ready` = `false`.

                              - `ReservationToolsMissing` — в образе демонов нет инструментов, которыми выполняется любая команда резервации: lvm2 запускает `/sbin/lvmpersist` по вкомпилированному пути, а тот — `sg_persist`. Это регрессия сборки, а не то, что чинится на узле.
                              - `NoReservationKey` — в конфигурации multipathd на этом узле нет `reservation_key`, поэтому команды резервации отбиваются, не доходя до массива, а вернувшийся путь не перерегистрируется. Модуль сам пишет его в `/etc/multipath/conf.d`.
                              - `ChannelUnreachable` — канал не читается с этого узла вовсе; так выглядит под без `hostNetwork`.
                          message:
                            description: |
                              Вердикт словами, включая то, что может сделать только человек.
                          key:
                            description: |
                              Ключ резервации, который этот узел держит на LUN пула, — так, как его сообщает хостовый multipathd. Пуст, пока узел ключ не зарегистрировал: так выглядит непереключённый пул.

                              Публикуется ради одного: пул должен уметь отобрать у узла доступ, когда самого узла уже не спросить. Массив перестаёт принимать записи ключа, который больше не зарегистрирован.

                              Остаётся пустым, пока все LUN пула не сообщат один и тот же ключ: ключ, который принадлежит этому узлу лишь предположительно, отрезал бы не тот узел.
                          state:
                            description: |
                              Где этот узел находится в переводе на резервации; так участники и согласуют переход: исполнитель ждёт от каждого соседа `Stopped`, прежде чем открыть одностороннюю дверь, а соседи ждут `Enabled`, прежде чем вернуться.

                              - `Off` — резервации здесь не используются.
                              - `Stopped` — узел остановил свой lockspace и свои резервации, чтобы исполнитель мог забрать группу. Томов в этом состоянии он не обслуживает.
                              - `Enabled` — узел держит регистрацию на массиве, его lockspace запущен под резервациями.
                      since:
                        description: |
                          Когда узел в последний раз изменил то, что здесь написано. Пока ответ
                          не меняется, время стоит на месте.
                conditions:
                  description: |
                    Последние наблюдения состояния группы.
                  items:
                    properties:
                      type:
                        description: |
                          Тип условия.

                          - `DevicesResolved` истинно, когда каждый WWID из спецификации разрешается в
                            устройство на владельце метаданных.
                          - `VGReady` истинно, когда группа томов создана и читается.
                          - `MetadataOwnerReady` истинно, пока владеющий узел держит lockspace и может
                            выполнять операции с метаданными.
                          - `Ready` обобщает остальные.
                      status:
                        description: |
                          Состояние условия.
                      observedGeneration:
                        description: |
                          Значение `metadata.generation`, для которого выставлено это условие.
                      lastTransitionTime:
                        description: |
                          Время последнего перехода состояния этого условия. Не обновляется, когда
                          меняются только причина или сообщение.
                      reason:
                        description: |
                          Машиночитаемая причина текущего состояния, пригодная для фильтрации логов и
                          алертинга.
                      message:
                        description: |
                          Человекочитаемое объяснение текущего состояния.
