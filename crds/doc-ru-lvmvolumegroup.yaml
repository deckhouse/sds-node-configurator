spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Интерфейс управления Volume Group'ами и Thin pool'ами на узлах.
            
            > Этот тип ресурсов может быть создан как самим пользователем, так и контроллером `sds-node-configurator`. Контроллер `sds-node-configurator` автоматически создаст ресурс LVMVolumeGroup в случае, если найдет на узле существующую Volume Group со специальным тегом 'storage.deckhouse.io/enabled=true', при этом контроллер самостоятельно заполнит как `spec`, так и `status` поля.
            > Поле `spec.thinPools` нужно заполнить самостоятельно.
          properties:
            spec:
              properties:
                type:
                  description: |
                    Тип группы томов.
                    
                    Возможные значения:
                    
                    - `Local` — локальная группа томов; используемые устройства не являются распределёнными (не Shared LUN).
                local:
                  description: |
                    Желаемая конфигурация для локальной группы томов.
                  properties:
                    nodeName:
                      description: |
                        Желаемый узел для группы томов LVM.
                        
                        > Это поле неизменяемое.
                blockDeviceSelector:
                  description: |
                    Желаемый селектор блочных устройств.

                    > Обратите внимание, что выбранные блочные устройства должны принадлежать одному узлу для группы томов с типом 'Local'.
                  properties:
                    matchLabels:
                      description: |
                        Метки для селектора блочных устройств.
                    matchExpressions:
                      description: |
                        Выражения для селектора блочных устройств.
                      items:
                        properties:
                          key:
                            description: |
                              Ключ метки для проверки.
                          operator:
                            description: |
                              Оператор для сравнения значений.
                          values:
                            description: |
                              Массив значений для сравнения. Требуется, если оператор `In` или `NotIn`.
                fileDevices:
                  description: |
                    Файловые устройства, создаваемые как LVM PV для этой группы томов.

                    Агент создаёт в указанном каталоге файл с предварительно выделенным местом,
                    подключает его как loop-устройство и использует как Physical Volume.
                    Файловые и блочные устройства можно совмещать в одной группе томов.

                    Каждый элемент определяется своим полем `name`. Поле `directory` изменить
                    нельзя, а `size` можно только увеличивать: увеличение наращивает файл-подложку,
                    loop-устройство и физический том (PV) на месте, ничего не размонтируя и не
                    прерывая работу томов поверх. Уменьшение отклоняется: вернуть ёмкость —
                    значит уменьшить группу томов, а этого модуль не делает и для блочных
                    устройств.

                    Таким образом ёмкость добавляется двумя способами: увеличить размер
                    существующего элемента либо добавить новый элемент с новым именем, если
                    место нужно взять с другой файловой системы. Предпочитайте меньшее
                    количество более крупных элементов: каждый элемент стоит одного
                    loop-устройства, одного PV и метаданных группы томов, а толстым (thick)
                    логическим томам, которым нужно непрерывное пространство, тем труднее
                    разместиться, чем сильнее свободное место размазано по мелким PV.

                    Элемент, который ещё не был создан на узле (его нет в
                    `status.nodes[].fileDevices` — например, он не прошёл валидацию), можно
                    удалить из спецификации. Удаление элемента, на котором держится живой PV,
                    не поддерживается: модуль никогда не уменьшает группу томов. Агент
                    сообщает о расхождении в условии `VGConfigurationApplied` (причина
                    `FileDeviceDrift`) и ничего не разрушает. Группа томов продолжает
                    работать и остаётся в фазе `Ready`. Чтобы освободить место внутри
                    файлового устройства, используйте `fstrim` — см. FAQ модуля.
                  items:
                    properties:
                      name:
                        description: |
                          Идентификатор файлового устройства внутри группы томов, уникальный
                          среди элементов этого ресурса LVMVolumeGroup. Он входит в имя
                          файла-подложки на узле, поэтому допустимы только строчные буквы,
                          цифры и '-'.

                          > Это поле является ключом элемента: по нему элемент опознаётся, и
                          > его изменение — это не правка, а удаление одного элемента и
                          > добавление другого. Если под старым именем устройство уже было
                          > создано, его PV остаётся в группе томов, а агент сообщает об этом
                          > в условии `VGConfigurationApplied`.
                      directory:
                        description: |
                          Абсолютный путь к каталогу на файловой системе узла, где будет
                          создан файл-подложка.

                          Должен совпадать с базовым каталогом модуля (параметр
                          fileDevicesDirectory, по умолчанию /opt/deckhouse/sds/file-devices)
                          либо быть его подкаталогом: агент отклоняет пути вне этого поддерева,
                          чтобы ошибочная запись не заполнила произвольный путь на узле.

                          Агент создаёт каталог автоматически (mkdir -p), если его нет. Путь
                          должен быть абсолютным и не содержать сегментов '..'. Выделение места
                          завершится ошибкой, если файловая система смонтирована только для
                          чтения, в пути встречается не-каталог или на диске недостаточно места
                          под запрошенный размер.
                      size:
                        description: |
                          Размер файла-подложки. Не менее 1Gi; меньшее значение
                          отклоняется на уровне admission, потому что `size` нельзя
                          уменьшить, и запись, принятую ниже минимума, агент будет
                          отвергать всегда.

                          Принимаются только двоичные единицы. Десятичные отклоняются на
                          уровне admission по той же причине: `1G` — это 10^9 байт, что
                          меньше минимума в 1Gi (2^30 байт), и такую ошибку легко не
                          заметить.

                          Значение должно быть целым числом в указанной единице: `1536Mi`,
                          а не `1.5Gi`. Physical Volume всегда немного меньше своего
                          файла-подложки (LVM резервирует метаданные в начале устройства,
                          а затем округляет вниз до целого числа extent-ов), и reconciler
                          считает расхождение в пределах одного extent как «размер уже
                          верный». Этого допуска хватает ровно до тех пор, пока запрошенный
                          размер кратен мебибайту; при более мелком значении может остаться
                          постоянный зазор, который агент будет пытаться закрыть на каждом
                          цикле согласования (reconcile).
                actualVGNameOnTheNode:
                  description: |
                    Желаемое имя группы томов. Должно быть уникальным для узла, на котором она находится.
                    
                    > Это поле неизменяемое.
                thinPools:
                  description: |
                    Желаемая конфигурация thin pool.
                  items:
                    properties:
                      name:
                        description: |
                          Желаемое имя thin pool.
                          
                          > Это поле неизменяемое.
                      size:
                        description: |
                          Желаемый размер thin pool. Может быть указан как в численном формате, так и в процентах от общего размера группы томов.
                          
                          > При указании размера в процентах thin pool будет автоматически расширен при расширении группы томов.
                      allocationLimit:
                        description: |
                          Предел расширения thin pool.
            status:
              properties:
                thinPoolReady:
                  description: |
                    Отображает количество здоровых и общее количество thin pool.
                configurationApplied:
                  description: |
                    Показывает, была ли последняя конфигурация успешно применена.
                phase:
                  description: |
                    Общее состояние ресурса LVMVolumeGroup.
                observedGeneration:
                  description: |
                    Значение `metadata.generation`, для которого watcher условий последним
                    вычислил вердикт. Если оно отстаёт от `metadata.generation`, фаза и
                    агрегирующее условие `Ready` описывают предыдущую спецификацию.

                    Поле заполняет только watcher условий — единственный писатель, который
                    смотрит на ресурс целиком. Агент и watcher инфраструктуры владеют
                    отдельными условиями стадий и проставляют поколение в них.
                conditions:
                  description: |
                    Условия ресурса LVMVolumeGroup.
                  items:
                    properties:
                      type:
                        description: |
                          Тип условия.
                      status:
                        description: |
                          Статус условия.
                      reason:
                        description: |
                          Машиночитаемая причина текущего статуса, пригодная для фильтрации логов
                          и алертинга.
                      message:
                        description: |
                          Информация о текущем статусе.
                      lastTransitionTime:
                        description: |
                          Время последней смены статуса условия. Не обновляется, если изменились
                          только причина или сообщение.
                      observedGeneration:
                        description: |
                          Значение `metadata.generation`, для которого было выставлено условие.
                vgUUID:
                  description: |
                    UUID группы томов.
                vgSize:
                  description: |
                    Ёмкость группы томов.
                vgFree:
                  description: |
                    Свободное место в группе томов.
                allocatedSize:
                  description: |
                    Объём пространства, занимаемый в данный момент в группе томов.
                thinPools:
                  description: |
                    Текущее состояние thin pool группы томов.
                    
                    > Может быть пустым, если в группе томов нет ни одного thin pool.
                  items:
                    properties:
                      name:
                        description: |
                          Имя thin pool.
                      actualSize:
                        description: |
                          Ёмкость thin pool.
                      usedSize:
                        description: |
                          Используемый размер thin pool.
                      allocatedSize:
                        description: |
                          Общий размер запрошенных логических томов в thin pool.
                      allocationLimit:
                        description: |
                          Предел расширения thin pool.
                      availableSpace:
                        description: |
                          Свободное место в thin pool.
                      ready:
                        description: |
                          Статус работоспособности thin pool.
                      message:
                        description: |
                          Информация о статусе.
                nodes:
                  description: |
                    Информация об узлах, на которых находится группа томов.
                  items:
                    properties:
                      name:
                        description: |
                          Имя узла.
                      devices:
                        description: |
                          Информация об устройствах, используемых в группе томов на текущем узле.
                        items:
                          properties:
                            path:
                              description: |
                                Путь к устройству на узле.
                            pvSize:
                              description: |
                                Размер физического тома.
                            devSize:
                              description: |
                                Размер блочного устройства.
                            pvUUID:
                              description: |
                                UUID физического тома LVM.
                            blockDevice:
                      fileDevices:
                        description: |
                          Информация о файловых устройствах, используемых в группе томов на текущем узле.
                        items:
                          properties:
                            name:
                              description: |
                                Имя элемента `spec.fileDevices`, из которого создано это устройство.

                                Присутствующий здесь элемент держит живой PV и не может быть удалён
                                из спецификации; отсутствующий здесь элемент ещё не создан на узле
                                и может быть удалён.
                            filePath:
                              description: |
                                Путь к файлу-подложке на узле.
                            loopDevice:
                              description: |
                                Канонический путь loop-устройства, к которому подключён файл.
                            size:
                              description: |
                                Размер PV на этом файловом устройстве.
                            pvUUID:
                              description: |
                                UUID PV, созданного на loop-устройстве.
                              description: |
                                Имя соответствующего ресурса блочного устройства.
