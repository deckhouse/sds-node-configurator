---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: lvmlogicalvolumes.storage.deckhouse.io
  labels:
    heritage: deckhouse
    module: sds-node-configurator
    backup.deckhouse.io/cluster-config: "true"
spec:
  group: storage.deckhouse.io
  scope: Cluster
  names:
    kind: LVMLogicalVolume
    plural: lvmlogicalvolumes
    singular: lvmlogicalvolume
    shortNames:
      - llv
  preserveUnknownFields: false
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: |
            LVMLogicalVolume resource defines the storage where a PV will be created.
          required:
            - spec
          properties:
            spec:
              type: object
              x-kubernetes-validations:
                - rule: |                  
                    (self.type == "Thin" && has(self.thin) && !has(self.thick)) || self.type != "Thin"
                  message: "Field 'thin' is required and field 'thick' is forbidden when 'type' is 'Thin'."
                - rule: >
                    (
                      (!has(self.thick) || !has(self.thick.contiguous)) && 
                      (!has(oldSelf.thick) || !has(oldSelf.thick.contiguous))
                    ) || (
                      has(self.thick) && has(self.thick.contiguous) &&
                      has(oldSelf.thick) && has(oldSelf.thick.contiguous)
                    )
                  message: "Field 'contiguous' is immutable and cannot be added if not specified at creation."
                - rule: |
                    self.type == "Thick" || !has(self.volumeCleanup) || self.volumeCleanup != "Discard"
                  message: "'volumeCleanup: Discard' is supported only for 'Thick' volumes"
              required:
                - actualLVNameOnTheNode
                - type
                - lvmVolumeGroupName
                - size
              properties:
                actualLVNameOnTheNode:
                  type: string
                  description: |
                    Logical Volume name on the node.
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: Value is immutable.
                  minLength: 1
                  pattern: '^[a-z0-9]([a-z0-9-._]{0,251}[a-z0-9])?$'
                type:
                  type: string
                  description: |
                    Logical Volume type.
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: Value is immutable.
                  enum: [Thick, Thin]
                size:
                  x-kubernetes-int-or-string: true
                  description: |
                    Desired Logical Volume size. It can be specified as a numerical value or percentage of the total Volume Group or thin pool space. For thin pools, the total space is calculated as the actual thin pool size multiplied by the `allocationLimit` value.
                    
                    > Note that if you specify a percentage, the Logical Volume will be automatically extended when Volume Group, thin pool, or thin pool's `allocationLimit` value is increased.
                  minLength: 1
                  pattern: '^[0-9]+(\.[0-9]+)?(E|P|T|G|M|k|Ei|Pi|Ti|Gi|Mi|Ki)?$|^[1-9][0-9]?%$|100%'
                lvmVolumeGroupName:
                  type: string
                  description: |
                    Name of a LVMVolumeGroup resource whose Volume Group will be used for Logical Volume creation.
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: Value is immutable.
                  minLength: 1
                  pattern: '^[a-z0-9]([a-z0-9-.]{0,251}[a-z0-9])?$'
                volumeCleanup:
                  type: string
                  enum: [RandomFillThreePass, RandomFillSinglePass, Discard]
                  description: |
                    Volume cleanup method after the PV is deleted. If this parameter is not set, there's no guarantee that the data will be completely deleted.

                    Allowed values:

                    - `RandomFillSinglePass`: Volume will be overwritten with random data once before deletion. This option is not recommended for solid-state drives (SSDs), as overwriting reduces the drive's lifespan. For thin volumes, only the space in use at the moment of volume deletion will be overwritten.
                    - `RandomFillThreePass`: Volume will be overwritten with random data three times before deletion. This option is also not recommended for SSDs, as overwriting reduces the drive's lifespan. For thin volumes, only the space in use at the moment of volume deletion will be overwritten.
                    - `Discard`: Before deletion, all blocks of the volume will be marked as free using the `discard` system call. This option is applicable only to SSDs and thick volumes.
                thin:
                  type: object
                  description: |
                    Defines the used thin pool. Specified only for Thin Logical Volume.
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: Value is immutable.
                  required:
                    - poolName
                  properties:
                    poolName:
                      type: string
                      description: |
                        Name of the used thin pool.
                      minLength: 1
                      pattern: ^.*$
                thick:
                  type: object
                  x-kubernetes-validations:
                    - rule: |
                        (!has(oldSelf.contiguous) || has(self.contiguous))
                      message: "Field 'contiguous' cannot be removed."
                  properties:
                    contiguous:
                      type: boolean
                      x-kubernetes-validations:
                        - rule: 'self == oldSelf'
                          message: Value is immutable.
                      description: |
                        If set to `true`, the logical volume will be created with the `contiguous` attribute.
                        
                        > Use this attribute carefully, as it may prevent from Logical Volume creation even if there is enough space for it.
                source:
                  type: object
                  description: |
                    Source of the volume, if present.
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: Value is immutable.
                  required:
                    - kind                  
                    - name                  
                  properties:
                    kind:
                      type: string
                      enum: [LVMLogicalVolume, LVMLogicalVolumeSnapshot]
                      description: |
                        Kind of the source. LVMLogicalVolume kind means that the current resource is a clone. LVMLogicalVolumeSnapshot kind means that the current resource is a restored volume.
                      x-kubernetes-validations:
                        - rule: self == oldSelf
                          message: Value is immutable.                      
                    name:
                      type: string
                      description: |
                        Name of the resource from which the current resource is created.
                      x-kubernetes-validations:
                        - rule: self == oldSelf
                          message: Value is immutable.
                      minLength: 1                    
            status:
              type: object
              description: |
                Describes the resource status.
              properties:
                phase:
                  type: string
                  enum: [Created, Pending, Cleaning, Resizing, Failed]
                  description: |
                    Current resource's phase.
                reason:
                  type: string
                  description: |
                    Reason of the phase.
                observedGeneration:
                  type: integer
                  format: int64
                  description: |
                    The value of `metadata.generation` the controller has last acted on. When it trails
                    `metadata.generation`, the controller has not yet processed the latest spec, and the
                    conditions below still describe the previous one.
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  description: |
                    The latest observations of the resource state. Condition type: `Ready`.
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        description: |
                          Condition type. `Ready` is `True` once the Logical Volume is in place, `False`
                          while it is not, and `Unknown` before anything has observed it.
                      status:
                        type: string
                        description: |
                          Current status of the condition.
                        enum:
                          - "True"
                          - "False"
                          - "Unknown"
                      observedGeneration:
                        type: integer
                        minimum: 0
                        format: int64
                        description: |
                          The value of `metadata.generation` this condition was set against.
                      lastTransitionTime:
                        type: string
                        format: date-time
                        description: |
                          Timestamp of the last status transition for this condition. It is not bumped
                          when only the reason or the message changes.
                      reason:
                        type: string
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        description: |
                          Machine-readable reason for the current status, suitable for log filtering
                          and alerting.
                      message:
                        type: string
                        maxLength: 32768
                        description: |
                          Human-readable explanation of the current status.
                actualSize:
                  description: |
                    Actual Logical Volume size on the node.
                  type: string
                contiguous:
                  description: |
                    Shows if the created Logical Volume has the `contiguous` attribute.
                  type: boolean
      subresources:
        status: {}
      additionalPrinterColumns:
        - jsonPath: .spec.actualLVNameOnTheNode
          name: LV Name
          type: string
          description: Actual Logical Volume name on the node.
        - jsonPath: .status.phase
          name: Phase
          type: string
          description: Current resource status.
        - jsonPath: .status.conditions[?(@.type=="Ready")].status
          name: Ready
          type: string
        - jsonPath: .spec.lvmVolumeGroupName
          name: LVMVolumeGroup
          type: string
          description: Selected LVMVolumeGroup resource.
        - jsonPath: .spec.thin.poolName
          name: ThinPool
          type: string
          description: Selected thin pool in LVMVolumeGroup. Might be empty if the LVMVolumeGroup is thick.
        - jsonPath: .status.actualSize
          name: Size
          type: string
          description: Actual LVMLogicalVolume size.
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
          description: Age of this resource.
