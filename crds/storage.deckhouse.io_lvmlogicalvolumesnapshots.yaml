apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    backup.deckhouse.io/cluster-config: "true"
    heritage: deckhouse
    module: sds-node-configurator
  name: lvmlogicalvolumesnapshots.storage.deckhouse.io
spec:
  group: storage.deckhouse.io
  names:
    kind: LVMLogicalVolumeSnapshot
    plural: lvmlogicalvolumesnapshots
    shortNames:
    - llvs
    singular: lvmlogicalvolumesnapshot
  preserveUnknownFields: false
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - description: Snapshotted LLV name
      jsonPath: .spec.lvmLogicalVolumeName
      name: Snapshotted LLV Name
      type: string
    - description: Name of the Kubernetes node the snapshot resides in.
      jsonPath: .status.nodeName
      name: NodeName
      type: string
    - description: Current resource status.
      jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - description: Snapshotted Logical Volume size.
      jsonPath: .status.size
      name: Size
      type: string
    - description: Space the snapshot maps when it is created, shared blocks included.
      jsonPath: .status.usedSize
      name: UsedSize
      type: string
    - description: Age of this resource.
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: LVMLogicalVolumeSnapshot resource defines the storage where a
          VolumeSnapshot will be created.
        properties:
          spec:
            properties:
              actualSnapshotNameOnTheNode:
                description: |-
                  Name of the volume snapshot on the node.
                  Optional: if omitted or empty, the agent uses the LLVS object name
                  (`metadata.name`). Once set to a non-empty value, the field is immutable.
                type: string
                x-kubernetes-validations:
                - message: Value is immutable.
                  rule: self == oldSelf
              lvmLogicalVolumeName:
                description: Name of the snapshotted LLV resource.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: Value is immutable.
                  rule: self == oldSelf
            required:
            - lvmLogicalVolumeName
            type: object
          status:
            description: Describes the resource status.
            properties:
              actualLVNameOnTheNode:
                description: Name of the volume the snapshot is created from.
                type: string
              actualVGNameOnTheNode:
                description: Name of the Volume Group, where the snapshot resides
                  in.
                type: string
              conditions:
                description: 'The latest observations of the resource state. Condition
                  type: `Ready`.'
                items:
                  properties:
                    lastTransitionTime:
                      description: |-
                        Timestamp of the last status transition for this condition. It is not bumped
                        when only the reason or the message changes.
                      format: date-time
                      type: string
                    message:
                      description: Human-readable explanation of the current status.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: The value of `metadata.generation` this condition
                        was set against.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        Machine-readable reason for the current status, suitable for log filtering
                        and alerting.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: Current status of the condition.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: |-
                        Condition type. `Ready` is `True` once the snapshot is in place, `False`
                        while it is not, and `Unknown` before anything has observed it.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              nodeName:
                description: Name of the Kubernetes node the snapshot resides in.
                type: string
              observedGeneration:
                description: |-
                  The value of `metadata.generation` the controller has last acted on. When it trails
                  `metadata.generation`, the controller has not yet processed the latest spec, and the
                  conditions below still describe the previous one.
                format: int64
                type: integer
              phase:
                description: |-
                  Current resource's phase.

                  Possible values:

                  - `Created`: Snapshot was created successfully.
                  - `Pending`: Snapshot is being created.
                  - `Failed`: An error occurred while creating the snapshot.
                enum:
                - Created
                - Pending
                - Failed
                type: string
              reason:
                description: Reason of the phase.
                type: string
              size:
                anyOf:
                - type: integer
                - type: string
                description: Snapshotted Logical Volume size on the node.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              usedSize:
                anyOf:
                - type: integer
                - type: string
                description: |-
                  Space the snapshot Logical Volume maps on the node when the snapshot is created: its
                  Data% times its size. The snapshot is thin, so this counts the blocks it shares with
                  the origin as well, and it does not grow as the origin is written to. It is not the
                  space that deleting the snapshot would free.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
