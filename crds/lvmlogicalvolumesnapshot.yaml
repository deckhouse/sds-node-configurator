---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: lvmlogicalvolumesnapshots.storage.deckhouse.io
  labels:
    heritage: deckhouse
    module: sds-node-configurator
    backup.deckhouse.io/cluster-config: "true"
spec:
  group: storage.deckhouse.io
  scope: Cluster
  names:
    kind: LVMLogicalVolumeSnapshot
    plural: lvmlogicalvolumesnapshots
    singular: lvmlogicalvolumesnapshot
    shortNames:
      - llvs
  preserveUnknownFields: false
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: |
            LVMLogicalVolumeSnapshot resource defines the storage where a VolumeSnapshot will be created.
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - lvmLogicalVolumeName
              properties:
                actualSnapshotNameOnTheNode:
                  type: string
                  description: |
                    Name of the volume snapshot.
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: Value is immutable.
                  minLength: 1
                lvmLogicalVolumeName:
                  type: string
                  description: |
                    Name of the snapshotted LLV resource.
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: Value is immutable.
                  minLength: 1
            status:
              type: object
              description: |
                Describes the resource status.
              properties:
                nodeName:
                  type: string
                  description: |
                    Name of the Kubernetes node the snapshot resides in.
                actualVGNameOnTheNode:
                  type: string
                  description: |
                    Name of the Volume Group, where the snapshot resides in.
                actualLVNameOnTheNode:
                  type: string
                  description: |
                    Name of the volume the snapshot is created from.
                phase:
                  type: string
                  enum: [Created, Pending, Failed]
                  description: |
                    Current resource's phase.
                    
                    Possible values:
                    
                    - `Created`: Snapshot was created successfully.
                    - `Pending`: Snapshot is being created.
                    - `Failed`: An error occurred while creating the snapshot.
                reason:
                  type: string
                  description: |
                    Reason of the phase.
                observedGeneration:
                  type: integer
                  format: int64
                  description: |
                    The value of `metadata.generation` the controller has last acted on. When it trails
                    `metadata.generation`, the controller has not yet processed the latest spec, and the
                    conditions below still describe the previous one.
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  description: |
                    The latest observations of the resource state. Condition type: `Ready`.
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        description: |
                          Condition type. `Ready` is `True` once the snapshot is in place, `False`
                          while it is not, and `Unknown` before anything has observed it.
                      status:
                        type: string
                        description: |
                          Current status of the condition.
                        enum:
                          - "True"
                          - "False"
                          - "Unknown"
                      observedGeneration:
                        type: integer
                        minimum: 0
                        format: int64
                        description: |
                          The value of `metadata.generation` this condition was set against.
                      lastTransitionTime:
                        type: string
                        format: date-time
                        description: |
                          Timestamp of the last status transition for this condition. It is not bumped
                          when only the reason or the message changes.
                      reason:
                        type: string
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        description: |
                          Machine-readable reason for the current status, suitable for log filtering
                          and alerting.
                      message:
                        type: string
                        maxLength: 32768
                        description: |
                          Human-readable explanation of the current status.
                size:
                  description: |
                    Snapshotted Logical Volume size on the node.
                  type: string
                usedSize:
                  description: |
                    Snapshot Logical Volume size on the node.
                  type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - jsonPath: .spec.lvmLogicalVolumeName
          name: Snapshotted LLV Name
          type: string
          description: Snapshotted LLV name
        - jsonPath: .status.nodeName
          name: NodeName
          type: string
          description: Name of the Kubernetes node the snapshot resides in.
        - jsonPath: .status.phase
          name: Phase
          type: string
          description: Current resource status.
        - jsonPath: .status.conditions[?(@.type=="Ready")].status
          name: Ready
          type: string
        - jsonPath: .status.size
          name: Size
          type: string
          description: Snapshotted Logical Volume size.
        - jsonPath: .status.usedSize
          name: UsedSize
          type: string
          description: Snapshot size.
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
          description: Age of this resource.
