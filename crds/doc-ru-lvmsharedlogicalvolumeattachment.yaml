spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Требование сделать один том общей группы активным на одном узле — и отчёт о том, что из
            этого вышло.

            Это отдельный ресурс, а не поле у тома, по трём причинам. У метаданных тома и у его
            активации разные писатели — владелец метаданных группы и узел, на котором том работает, —
            а один объект с двумя писателями это либо server-side apply с field manager'ами по ролям,
            либо взаимные затирания. Блочным томам с `ReadWriteMany` нужно больше одного подключения
            одновременно, чего поле с именем узла выразить не может. И агент может следить только за
            подключениями своего узла вместо всех томов пула.

            Удаление этого ресурса и есть способ освободить том: агент деактивирует его, эксклюзивная
            блокировка снимается, и том может забрать другой узел.
          properties:
            spec:
              description: |
                Какой том, на каком узле и в каком режиме.
              properties:
                lvmSharedLogicalVolumeName:
                  description: |
                    Том, который нужно активировать.
                nodeName:
                  description: |
                    Узел, на котором его нужно активировать. Узел должен входить в состав группы этого
                    тома: подключение к узлу вне группы удовлетворить невозможно, потому что блокировку
                    выдаёт lockspace, который держат только участники.
                accessMode:
                  description: |
                    Как активируется том.

                    Возможные значения:

                    - `ReadWriteOnce` — эксклюзивная активация. LVM отказывается активировать тот же том
                      эксклюзивно где-либо ещё, пока она держится, и именно этот отказ, а не учёт в
                      контроллере, не даёт двум узлам писать в один том.

                    - `ReadWriteMany` — разделяемая активация, для блочных томов, потребитель которых
                      арбитрирует доступ сам. Безопасности файловой системы здесь нет никакой:
                      разделяемая активация с обычной файловой системой — это разрушенная файловая
                      система, поэтому режим принимается только для томов, используемых в блочном виде.
            status:
              description: |
                Наблюдаемое состояние подключения; пишет только агент узла `spec.nodeName`.
              properties:
                phase:
                  description: |
                    Текущее состояние подключения, выводимое из перечисленных ниже условий.

                    Возможные значения:

                    - `Pending` — агент ещё не активировал том.
                    - `Attached` — том активен на узле, путь устройства опубликован ниже.
                    - `Failed` — активация не удалась; подробности в условиях. Блокировка, удерживаемая
                      другим узлом, — обычная причина и ошибкой этого узла не является.
                observedGeneration:
                  description: |
                    Значение `metadata.generation`, по которому агент отработал в последний раз.
                devicePath:
                  description: |
                    Путь активированного тома на этом узле.
                observedSize:
                  description: |
                    Размер логического тома в том виде, в каком его сейчас видит этот узел.

                    Публикуется здесь, а не только на томе, потому что расширение подключённого тома
                    делает именно этот узел — владелец метаданных не может, блокировку держат здесь, — а
                    потребителю нужно знать, что новый размер доехал, прежде чем растить что-либо
                    поверх. Файловая система этому ресурсу не подчиняется: её растит CSI-драйвер, а
                    результат наблюдает kubelet.
                lockspaceGeneration:
                  description: |
                    Воплощение lockspace этого узла, к которому относится данная активация.

                    Существует потому, что устройство device-mapper переживает блокировку, стоящую за
                    ним. `sanlock` и `lvmlockd` живут в одном поде и перезапускаются вместе, унося с
                    собой все аренды, тогда как ядро сохраняет все отображения: узел выглядит
                    активировавшим том и при этом не держит ничего. Сравнение этого числа с текущим
                    значением на узле — единственный способ отличить одно от другого, и расхождение
                    заставляет узел активировать том заново, а не доверять устройству, которое он
                    видит.
                conditions:
                  description: |
                    Последние наблюдения состояния подключения.
                  items:
                    properties:
                      type:
                        description: |
                          Тип условия.

                          - `LockAcquired` истинно, когда этот узел держит блокировку тома. Значение
                            «ложно» с причиной, называющей держателя, — нормальное состояние, пока том
                            ещё у другого узла.
                          - `Activated` истинно, когда устройство появилось на этом узле.
                          - `Resized` сообщает исход последнего выполненного здесь расширения.
                          - `Ready` обобщает остальные.
                      status:
                        description: |
                          Состояние условия.
                      observedGeneration:
                        description: |
                          Значение `metadata.generation`, для которого выставлено это условие.
                      lastTransitionTime:
                        description: |
                          Время последнего перехода состояния этого условия.
                      reason:
                        description: |
                          Машиночитаемая причина текущего состояния.
                      message:
                        description: |
                          Человекочитаемое объяснение текущего состояния.
