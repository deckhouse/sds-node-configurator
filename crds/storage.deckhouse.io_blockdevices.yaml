apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    backup.deckhouse.io/cluster-config: "true"
    heritage: deckhouse
    module: sds-node-configurator
  name: blockdevices.storage.deckhouse.io
spec:
  group: storage.deckhouse.io
  names:
    kind: BlockDevice
    plural: blockdevices
    shortNames:
    - bd
    singular: blockdevice
  preserveUnknownFields: false
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - description: Node the block device is on.
      jsonPath: .status.nodeName
      name: Node
      type: string
    - description: Defines whether the current block device can be used by `sds-node-configurator`.
      jsonPath: .status.consumable
      name: Consumable
      type: boolean
    - description: Why the device is or is not consumable.
      jsonPath: .status.conditions[?(@.type=="Consumable")].reason
      name: Reason
      priority: 1
      type: string
    - description: Size of the included device.
      jsonPath: .status.size
      name: Size
      type: string
    - description: Actual device path (name).
      jsonPath: .status.path
      name: Path
      type: string
    - description: Volume Group the block device is in.
      jsonPath: .status.actualVGNameOnTheNode
      name: VG
      priority: 1
      type: string
    - description: LVMVolumeGroup resource the block device is in.
      jsonPath: .status.lvmVolumeGroupName
      name: LVMVolumeGroup
      priority: 1
      type: string
    - description: Age of this resource
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          The resource displays up-to-date information about available block devices on nodes that can be used by the `sds-node-configurator` controller for LVM operations.

          > The resource is created and managed by the controller only. Manual modification of the resource is prohibited.
        properties:
          status:
            properties:
              actualVGNameOnTheNode:
                description: |-
                  The actual name of the LVM Volume Group the device is included in.

                  > **Optional**: exists if only the device is used as a Physical Volume and is included in a Volume Group.
                type: string
              conditions:
                description: |-
                  Latest state. Known type: `Consumable`, which carries the
                  reason behind `status.consumable`: `Available`, `OrphanPhysicalVolume`,
                  `Mounted`, `HasFilesystem`, `HasPartitionTable` or `HotPlugged`.
                items:
                  properties:
                    lastTransitionTime:
                      description: Timestamp of the last status transition for this
                        condition.
                      format: date-time
                      type: string
                    message:
                      description: Human-readable explanation of the current status.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: Value of `metadata.generation` the condition was
                        last set against.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        Machine-readable reason for the current status, suitable for
                        log filtering.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: Current status of the condition.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: Condition type, for example `Consumable`.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              consumable:
                description: The flag that defines whether this device can be used
                  by the controller to create an LVM Physical Volume.
                type: boolean
              fsType:
                description: The device's file system type.
                enum:
                - LVM2_member
                - ""
                type: string
              hotPlug:
                description: |-
                  Device connection type. Can be:
                  - `true`: If the device has been hot-plugged;
                  - `false`: Otherwise.
                type: boolean
              lvmVolumeGroupName:
                description: |-
                  The LVMVolumeGroup resource name.

                  > **Optional**: exists only if the device is used as a Physical Volume, is included in a Volume Group, and is specified in an LVMVolumeGroup resource.
                type: string
              machineId:
                description: Unique identifier of the machine the device is on (normally
                  at `/etc/machine-id`).
                type: string
              model:
                description: |-
                  Device model.

                  > **Optional**: might not exist if the manufacturer does not provide this information for the given type of disks.
                type: string
              nodeName:
                description: The name of the Kubernetes node the device is on.
                type: string
              partLabel:
                description: |-
                  The GPT name of the partition (PARTLABEL).

                  > **Optional**: exists only if the device is a partition of a GPT table and the partition has a name.
                type: string
              partUUID:
                description: |-
                  The UUID of the partition.

                  > **Optional**: exists only if the device is a partition.
                type: string
              path:
                description: The device path on the node (/dev/sda).
                type: string
              pvUUID:
                description: |-
                  The LVM Physical Volume UUID.

                  > **Optional**: exists only if the device is used as a LVM Physical Volume.
                type: string
              rota:
                description: |-
                  Device disk type. Can be:
                  - `true`: For HDD;
                  - `false`: For SSD.
                type: boolean
              serial:
                description: The device unique serial number.
                type: string
              size:
                anyOf:
                - type: integer
                - type: string
                description: The device size.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              type:
                description: The device's type (disk, partition, RAID, and others).
                type: string
              vgUUID:
                description: |-
                  The UUID of the LVM Volume Group to which this device belongs as a Physical Volume.

                  > **Optional**: exists only if the device is used as a Physical Volume and is included in a Volume Group.
                type: string
              wwn:
                description: |-
                  The device unique wwn (World Wide Name) identifier.

                  > **Optional**: might not exist if WWN is not supported for this type of disk by the manufacturer.
                type: string
            required:
            - consumable
            - hotPlug
            - machineId
            - nodeName
            - path
            - rota
            - size
            - type
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
