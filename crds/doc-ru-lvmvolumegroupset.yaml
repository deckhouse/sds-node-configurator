spec:
  versions:
    - name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |
            Интерфейс для одновременного создания нескольких ресурсов LVMVolumeGroup по общему шаблону.
          properties:
            spec:
              properties:
                strategy:
                  description: |
                    Стратегия (правило) создания ресурсов LVMVolumeGroup данным набором.
                nodeSelector:
                  description: |
                    Селектор узлов, которые будут использованы ресурсами LVMVolumeGroup.
                  properties:
                    matchLabels:
                      description: |
                        Метки для селектора узлов.
                    matchExpressions:
                      description: |
                        Выражения для селектора узлов.
                      items:
                        properties:
                          key:
                            description: |
                              Ключ метки для проверки.
                          operator:
                            description: |
                              Оператор для сравнения значений.
                          values:
                            description: |
                              Массив значений для сравнения. Требуется, если оператор `In` или `NotIn`.
                lvmVolumeGroupTemplate:
                  description: |
                    Общий шаблон для ресурсов LVMVolumeGroup, создаваемых данным набором.
                  properties:
                    blockDeviceSelector:
                      description: |
                        Селектор ресурсов BlockDevice, используемый в конфигурации ресурсов LVMVolumeGroup.
                      properties:
                        matchLabels:
                          description: |
                            Метки для селектора блочных устройств.
                        matchExpressions:
                          description: |
                            Выражения для селектора блочных устройств.
                          items:
                            properties:
                              key:
                                description: |
                                  Ключ метки для проверки.
                              operator:
                                description: |
                                  Оператор для сравнения значений.
                              values:
                                description: |
                                  Массив значений для сравнения. Требуется, если оператор `In` или `NotIn`.
                    metadata:
                      description: |
                        Метаданные ресурсов LVMVolumeGroup.
                      properties:
                        labels:
                          description: |
                            Обязательные метки для ресурсов LVMVolumeGroup.
                    type:
                      description: |
                        Тип группы томов в ресурсах LVMVolumeGroup.
                        
                        Возможные значения:
                        
                        - `Local` — локальная группа томов; используемые устройства не являются распределёнными (не Shared LUN).
                    fileDevices:
                      description: |
                        Файловые устройства, создаваемые как LVM PV для каждой группы томов,
                        порождённой этим набором. Значение копируется в spec.fileDevices каждого
                        создаваемого ресурса LVMVolumeGroup, поэтому на каждом узле появляется
                        собственный файл-подложка.

                        Каждый элемент определяется своим полем `name`. Поле `directory` изменить
                        нельзя, а `size` можно только увеличивать: при увеличении файл-подложка,
                        loop-устройство и физический том (PV) растут на месте на каждом узле,
                        который покрывает набор, без размонтирования и без остановки томов поверх
                        них. Уменьшение отклоняется: вернуть ёмкость — значит уменьшить группу
                        томов, а этого модуль не делает и для блочных устройств.

                        Увеличить ёмкость можно двумя способами: поднять `size` существующего
                        элемента либо добавить новый элемент с новым именем, если место нужно
                        взять с другой файловой системы — не более 32 элементов на группу.

                        > Элементы, удалённые из шаблона, удаляются и из дочерних ресурсов
                        > LVMVolumeGroup. Если такой элемент уже держит живой PV, агент сообщает
                        > о расхождении в условии `VGConfigurationApplied` дочернего ресурса и
                        > ничего не разрушает.
                      items:
                        properties:
                          name:
                            description: |
                              Идентификатор файлового устройства внутри каждой группы томов,
                              создаваемой набором. Входит в имя файла-подложки на узле.
                          directory:
                            description: |
                              Абсолютный путь к каталогу на файловой системе узла, где будет создан
                              файл-подложка. Должен находиться внутри базового каталога модуля
                              (параметр fileDevicesDirectory).
                          size:
                            description: |
                              Размер файла-подложки. Не менее 1Gi; меньшее значение отклоняется
                              на уровне admission, поскольку `size` нельзя уменьшить.
                              Принимаются только двоичные
                              единицы; `1G` (10^9 байт) меньше минимума в 1Gi и отклоняется
                              на уровне admission. Значение должно быть целым числом в указанной
                              единице — `1536Mi`, а не `1.5Gi`; причина описана у того же поля
                              в LVMVolumeGroup.
                    actualVGNameOnTheNode:
                      description: |
                        Желаемое имя группы томов в ресурсах LVMVolumeGroup. Должно быть уникальным для узла, на котором она находится.
                        
                        > Это поле неизменяемое.
                        > Указанное имя группы томов будет общим для каждого ресурса LVMVolumeGroup, созданного данным набором.
                    thinPools:
                      description: |
                        Желаемая конфигурация thin pool в ресурсах LVMVolumeGroup.
                        
                        > Указанная конфигурация будет общей для каждого ресурса LVMVolumeGroup, созданного данным набором.
                      items:
                        properties:
                          name:
                            description: |
                              Желаемое имя thin pool.
                              
                              > Это поле неизменяемое.
                          size:
                            description: |
                              Желаемый размер thin pool. Может быть указан как в численном формате, так и в процентах от общего размера группы томов.
                              
                              > При указании размера в процентах thin pool будет автоматически расширен при расширении группы томов.
                          allocationLimit:
                            description: |
                              Предел расширения thin pool.
            status:
              type: object
              properties:
                createdLVMVolumeGroups:
                  description: |
                    Краткая информация о ресурсах LVMVolumeGroup, созданных данным набором.
                  items:
                    properties:
                      lvmVolumeGroupName:
                        description: |
                          Имя созданного ресурса LVMVolumeGroup.
                      nodeName:
                        description: |
                          Имя узла, на котором создан ресурс LVMVolumeGroup.
                currentLVMVolumeGroupsCount:
                  description: |
                    Текущее количество ресурсов LVMVolumeGroup, созданных данным набором.
                desiredLVMVolumeGroupsCount:
                  description: |
                    Желаемое количество ресурсов LVMVolumeGroup, которые должны быть созданы данным набором.
                phase:
                  description: |
                    Фаза создания ресурсов LVMVolumeGroup.
                reason:
                  description: |
                    Причина текущей фазы.
