x-extend:
  schema: config-values.yaml
type: object
properties:
  internal:
    type: object
    default: {}
    properties:
      pythonVersions:
        type: array
        default: []
        items:
          type: string
      customWebhookCert:
        type: object
        default: {}
        x-required-for-helm:
          - crt
          - key
          - ca
        properties:
          crt:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          key:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          ca:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
      controllerMetricsProxyPort:
        type: integer
        default: 8080
        description: |
          The port the sds-health-watcher-controller serves its metrics on, over
          HTTPS: the manager's own reconcile and workqueue series plus this module's
          sds_node_configurator_* counters. Reaching it requires "get" on
          deployments/prometheus-metrics for the controller, which the controller
          checks on every scrape.
      controllerMetricsPort:
        type: integer
        default: 8080
        description: |
          Not used: the sds-health-watcher-controller serves its metrics on
          controllerMetricsProxyPort.
      schedulerExtenderMetricsProxyPort:
        type: integer
        default: 8080
        description: |
          The port the scheduler extender serves its metrics on, over HTTPS.
          Reaching it requires "get" on deployments/prometheus-metrics for the
          extender, which the extender checks on every scrape.
      schedulerExtenderMetricsPort:
        type: integer
        default: 8080
        description: |
          Not used: the scheduler extender serves its metrics on
          schedulerExtenderMetricsProxyPort.
      customSchedulerExtenderCert:
        type: object
        default: {}
        x-required-for-helm:
          - crt
          - key
          - ca
        properties:
          crt:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          key:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          ca:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
  registry:
    type: object
    description: "System field, overwritten by Deckhouse. Don't use"
