x-extend:
  schema: config-values.yaml
type: object
properties:
  internal:
    type: object
    default: {}
    properties:
      pythonVersions:
        type: array
        default: []
        items:
          type: string
      customWebhookCert:
        type: object
        default: {}
        x-required-for-helm:
          - crt
          - key
          - ca
        properties:
          crt:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          key:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          ca:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
      controllerMetricsProxyPort:
        type: integer
        default: 8080
        description: |
          The port the kube-rbac-proxy publishes the controller metrics on. Reaching
          it requires "get" on deployments/prometheus-metrics for the controller; the
          controller itself keeps its metrics on 127.0.0.1.
      controllerMetricsPort:
        type: integer
        default: 8080
        description: |
          The port the sds-health-watcher-controller serves its metrics on: the
          manager's own reconcile and workqueue series plus this module's
          sds_node_configurator_* counters.
      schedulerExtenderMetricsProxyPort:
        type: integer
        default: 8080
        description: |
          The port the kube-rbac-proxy publishes the scheduler extender metrics on.
          Reaching it requires "get" on deployments/prometheus-metrics for the
          extender.
      schedulerExtenderMetricsPort:
        type: integer
        default: 8080
        description: |
          The port the scheduler extender serves its metrics on. The manager has
          always bound it; until now nothing declared the port or scraped it.
      customSchedulerExtenderCert:
        type: object
        default: {}
        x-required-for-helm:
          - crt
          - key
          - ca
        properties:
          crt:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          key:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
          ca:
            type: string
            x-examples: ["YjY0ZW5jX3N0cmluZwo="]
  registry:
    type: object
    description: "System field, overwritten by Deckhouse. Don't use"
