type: object
required: []
properties:
  disableDs:
    type: boolean
    default: false
    description: Disable `sds-node-configurator` DaemonSet.
  logLevel:
    type: string
    enum:
      - ERROR
      - WARN
      - INFO
      - DEBUG
      - TRACE
    description: Module application log level.
    default: INFO
  enableThinProvisioning:
    type: boolean
    default: true
    description: Enable support of thin LVM volumes.
  enableNetlinkBlockDeviceDiscovery:
    type: boolean
    default: false
    description: |
      Use netlink/sysfs instead of `lsblk` as the data source for block device discovery on the agent.
      When disabled, the agent discovers block devices via `lsblk`.
  fileDevicesDirectory:
    type: string
    default: /opt/deckhouse/sds/file-devices
    # An absolute path of at least one non-empty component. The filesystem root
    # is excluded deliberately: setting this to '/' would make every absolute
    # path a valid subdirectory and disable the very confinement this setting
    # exists to provide.
    #
    # A '..' component cannot be excluded here — a CRD/config pattern is a RE2
    # regexp and has no lookahead — so the agent rejects it at startup instead,
    # in config.NewConfig. Without that check the path would merely be cleaned
    # (isWithinBaseDir does a lexical filepath.Clean), and '/opt/../etc' would
    # silently confine backing files to '/etc'.
    pattern: '^/[^/]+(/[^/]+)*$'
    description: |
      Base directory on each node under which the agent is allowed to create
      backing files for file-backed LVM devices (`spec.fileDevices`).

      Every `spec.fileDevices[].directory` must be this directory or a
      subdirectory of it; the agent rejects backing files outside this subtree
      to prevent an arbitrary host path (for example `/etc` or `/var/lib/kubelet`)
      from being filled up. Override it to point at a dedicated data disk
      mounted on the node when the default location does not have enough space.

      The filesystem root (`/`) is not accepted: it would make every absolute
      path a valid subdirectory and disable the restriction entirely.
  fileDevicesMinFreeSpacePercent:
    type: integer
    default: 15
    minimum: 0
    maximum: 90
    description: |
      Share of the backing-file filesystem, in percent, that the agent keeps free
      when creating or growing a file-backed LVM device (`spec.fileDevices`).

      Backing files are preallocated, and by default they live on the node's root
      filesystem. Allocating down to the last free byte is what causes a node-level
      outage rather than a mere provisioning error: kubelet starts evicting pods at
      `nodefs.available<10%`, long before the filesystem is actually full. The
      default of 15% matches kubelet's stricter `imagefs.available` threshold and
      leaves a margin above the `nodefs` one.

      An entry that does not fit within this limit is not provisioned and is
      reported on the LVMVolumeGroup's `VGConfigurationApplied` condition; the
      Volume Group itself keeps working.

      Lower it only when `fileDevicesDirectory` points at a dedicated disk that
      nothing else on the node depends on. `0` disables the reserve entirely.
