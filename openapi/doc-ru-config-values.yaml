type: object
properties:
  disableDs:
    description: Выключить DaemonSet `sds-node-configurator`.
  logLevel:
    description: Уровень логирования для приложений модуля.
  enableThinProvisioning:
    description: Включить поддержку thin-LVM-томов.
  enableNetlinkBlockDeviceDiscovery:
    description: |
      Использовать netlink/sysfs вместо `lsblk` как источник данных для обнаружения блочных устройств в agent.
      При выключенном флаге agent обнаруживает блочные устройства через `lsblk`.
  fileDevicesDirectory:
    description: |
      Базовый каталог на каждом узле, внутри которого агенту разрешено создавать
      файлы-подложки для файловых LVM-устройств (`spec.fileDevices`).

      Каждый `spec.fileDevices[].directory` должен совпадать с этим каталогом
      либо быть его подкаталогом; файлы-подложки вне этого поддерева агент
      отклоняет, чтобы произвольный путь на узле (например, `/etc` или
      `/var/lib/kubelet`) нельзя было переполнить. Переопределите параметр,
      указав отдельный диск с данными, смонтированный на узле, если в каталоге
      по умолчанию недостаточно места.

      Корень файловой системы (`/`) указать нельзя: тогда подкаталогом
      считался бы любой абсолютный путь и ограничение перестало бы работать.
  fileDevicesMinFreeSpacePercent:
    description: |
      Доля файловой системы (в процентах), которую агент оставляет свободной при
      создании или увеличении файлового LVM-устройства (`spec.fileDevices`).

      Файлы-подложки создаются с преаллокацией, и по умолчанию они лежат на
      корневой файловой системе узла. Занять место до последнего свободного байта —
      это уже не ошибка провижининга, а отказ уровня узла: kubelet начинает
      вытеснять поды при `nodefs.available<10%`, задолго до реального заполнения
      файловой системы. Значение по умолчанию (15%) совпадает с более строгим
      порогом kubelet `imagefs.available` и оставляет запас относительно порога
      `nodefs`.

      Запись, которая не укладывается в это ограничение, не создаётся, а причина
      сообщается в condition `VGConfigurationApplied` ресурса LVMVolumeGroup; сама
      Volume Group при этом продолжает работать.

      Уменьшать значение имеет смысл, только если `fileDevicesDirectory` указывает
      на отдельный диск, от которого больше ничего на узле не зависит. `0`
      полностью отключает резерв.
